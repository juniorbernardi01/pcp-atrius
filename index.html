<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCP Atrius — Programação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --ink:#1A1D23; --ink2:#545C69; --ink3:#8B93A1;
  --line:#E4E2DC; --line2:#EFEEE9; --line3:#F5F4F0;
  --prep:#0891B2; --run:#15803D; --pausa:#B45309; --danger:#B3261E; --lib:#15803D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.top h1{font-family:'Barlow Condensed';font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--line3);padding:3px;border-radius:9px}
.tabs button{padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink2);border-radius:7px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{display:flex;gap:1px}
.nav button{width:30px;height:30px;border-radius:7px;color:var(--ink2);display:grid;place-items:center;font-size:15px}
.nav button:hover{background:var(--line3)}
.per{font-size:14px;font-weight:600;min-width:180px}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:#15803D;border-color:#15803D;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.blue{background:#2563EB;border-color:#2563EB;color:#fff}
.btn.del{color:var(--danger);border-color:#EDCFCC}
.btn.sm{padding:6px 11px;font-size:12px}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sw button{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.sw button.on{background:var(--ink);color:#fff}
.sp{margin-left:auto}
.ondeest{font-family:'Barlow Condensed';font-size:17px;font-weight:600;color:var(--ink2);
  padding-left:11px;margin-left:2px;border-left:1px solid var(--line)}
.burger{width:34px;height:34px;border-radius:8px;display:grid;place-content:center;gap:4px;flex-shrink:0}
.burger:hover{background:var(--line3)}
.burger span{display:block;width:17px;height:2px;background:var(--ink);border-radius:2px}
.menu[hidden],.mendrop[hidden]{display:none!important}
.mendrop{position:fixed;inset:0;background:rgba(26,29,35,.35);z-index:49}
.menu{position:fixed;top:0;left:0;bottom:0;width:246px;background:var(--surface);
  border-right:1px solid var(--line);z-index:50;padding:14px 0 0;
  display:flex;flex-direction:column;gap:0;box-shadow:4px 0 24px rgba(0,0,0,.12)}
.menu .mtit,.menu .mlista{padding-left:12px;padding-right:12px}
.menu .mlista{display:flex;flex-direction:column;gap:3px}
.menu .mtit{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink3);padding:6px 10px 10px}
.menu button{text-align:left;padding:10px 12px;border-radius:9px;line-height:1.3}
.menu button:hover{background:var(--line3)}
.menu button.on{background:var(--ink);color:#fff}
.menu button.on i{color:rgba(255,255,255,.65)}
.menu button b{display:block;font-size:13.5px;font-weight:600}
.menu button i{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:1px}
.menu button.sub{padding:7px 12px 7px 22px;font-size:12.5px;color:var(--ink2)}
.menu button.sub.on{color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:100px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--ink2)}
.chip.bad{background:#FBEAE8;border-color:#EFCCC8;color:var(--danger)}
.chip.saldo{background:#F1ECFC;border-color:#CFC0F2;color:#5B21B6;cursor:pointer}
.chip.saldo:hover{background:#E7DEFA}
.chip.sop{background:#FEF3E7;border-color:#F0C89A;color:#8A5A08;font-weight:700}
.chip.atr{background:#FEF6E0;border-color:#E0B84A;color:#8A5A08;font-weight:700}
.chip.lib{background:#FDF3E3;border-color:#EDD3A0;color:#8A5A08;cursor:pointer;animation:bate 2s infinite}
.chip.lib:hover{background:#FBE7BF}
.chip.teste{background:var(--line3);border-color:var(--line);color:var(--ink3);font-weight:600}
@keyframes bate{0%,100%{box-shadow:0 0 0 0 rgba(180,83,9,.35)}50%{box-shadow:0 0 0 5px rgba(180,83,9,0)}}

.body{display:flex;flex:1;min-height:0}
.wrap{flex:1;overflow:auto;background:var(--surface);position:relative}
.grid{display:flex;min-width:max-content;position:relative}
.gut{width:52px;flex-shrink:0;position:sticky;left:0;z-index:10;background:var(--surface);border-right:1px solid var(--line)}
.guth{height:54px;position:sticky;top:0;z-index:22;background:var(--surface);border-bottom:1px solid var(--line)}
.gutb .h{height:60px;display:flex;justify-content:flex-end;padding-right:6px}
.gutb .h span{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);transform:translateY(-6px);font-weight:500}

.day{flex:1;min-width:288px;border-right:2px solid var(--line)}
.day:last-child{border-right:none}
.dhead{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);height:54px}
.dtop{display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 0 2px}
.dtop .dw{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3)}
.dtop .dn{font-family:'Barlow Condensed';font-size:21px;font-weight:700;line-height:1}
.day.today .dtop .dn{background:#2563EB;color:#fff;border-radius:50%;width:27px;height:27px;
  display:grid;place-items:center;font-size:15px}
.day.today .dtop .dw{color:#2563EB}
.dmaqs{display:flex;border-top:1px solid var(--line2)}
.dmaqs i{flex:1;text-align:center;font-style:normal;font-size:10px;font-weight:700;
  letter-spacing:.08em;color:var(--ink3);padding:4px 0;border-right:1px solid var(--line2)}
.dmaqs i:last-child{border-right:none}
.dmaqs i u{display:block;font-size:8.5px;font-weight:500;text-decoration:none;
  font-family:'JetBrains Mono';color:var(--ink3);opacity:.75;margin-top:1px}
.dmaqs i{padding:3px 0 4px}
.dbody{display:flex}
.mcol{flex:1;position:relative;border-right:1px solid var(--line2);cursor:copy}
.mcol:last-child{border-right:none}
.mcol .hh{height:30px;border-bottom:1px dashed var(--line3);box-sizing:border-box}
.mcol .hh.f{border-bottom:1px solid var(--line2)}
.posturno{background:repeating-linear-gradient(45deg,#FBFAF7,#FBFAF7 5px,#F1F0EB 5px,#F1F0EB 10px);
  border-top:1px solid var(--line);pointer-events:none}
.forajorn{position:absolute;left:0;right:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(45deg,#FAF9F6,#FAF9F6 6px,#F0EFEA 6px,#F0EFEA 12px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid #DC2626;z-index:12;pointer-events:none}
.nowlbl{position:sticky;left:0;display:inline-block;background:#DC2626;color:#fff;font-size:9.5px;
  font-weight:700;padding:1px 5px 1px 4px;border-radius:0 4px 4px 0;transform:translateY(-50%)}
.dl{position:absolute;left:1px;right:1px;border-top:2px dashed var(--ink);z-index:18;display:none;pointer-events:none}
.dl::after{content:attr(data-t);position:absolute;left:0;top:2px;font-family:'JetBrains Mono';
  font-size:9.5px;font-weight:700;background:var(--ink);color:#fff;padding:1px 4px;border-radius:3px}
.addhint{position:absolute;left:2px;right:2px;display:none;align-items:center;gap:5px;z-index:9;
  pointer-events:none;transform:translateY(-11px)}
.addhint::before{content:'';position:absolute;left:0;right:0;top:11px;height:2px;background:#0E9F6E;opacity:.5}
.addhint i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#0E9F6E;color:#fff;
  display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1;z-index:2;flex-shrink:0;
  pointer-events:auto;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.addhint i:hover{background:#0B7F58;transform:scale(1.12)}
.addhint span{font-family:'JetBrains Mono';font-size:10px;font-weight:700;background:#0E9F6E;color:#fff;
  padding:1px 5px;border-radius:4px;z-index:2}

.blk{position:absolute;left:2px;right:2px;border-radius:7px;overflow:hidden;cursor:pointer;z-index:3;
  border:1px solid var(--bc);background:var(--bg2);border-left:4px solid var(--bc);
  display:flex;flex-direction:column;transition:box-shadow .12s}
.blk:hover{box-shadow:0 3px 12px rgba(26,29,35,.2);z-index:6}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:7}
.blk.conf{border-color:var(--danger)}
.blk .pr{background:repeating-linear-gradient(45deg,rgba(184,115,9,.22),rgba(184,115,9,.22) 4px,transparent 4px,transparent 8px);
  border-bottom:1px dashed rgba(184,115,9,.6);flex-shrink:0}
.blk .in{padding:4px 7px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;gap:1px}
.blk .t1{font-size:12.5px;font-weight:700;line-height:1.2;color:var(--bc);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t2{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.blk .t3{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tagx{font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
  align-self:flex-start;margin-top:2px}
.tagx.ex{background:#8A5A08;color:#fff}
.tagx.atr{background:#C08A2E;color:#fff}
/* passou do fim previsto — chama a atenção do programador */
.blk.atrasada{background:#FEF6E0!important;border-color:#E0B84A!important;
  box-shadow:0 0 0 2px rgba(224,184,74,.35)}
.blk.atrasada .t1{color:#8A5A08!important}
.bat.atrasada{background:#FEF6E0;border-color:#E0B84A;box-shadow:0 0 0 2px rgba(224,184,74,.3)}
.bat .sptop{padding:2px 11px 8px}
.bat .spn{font-family:'Barlow Condensed';font-size:19px;font-weight:700;line-height:1.1;color:var(--ink)}
.bat .spq{font-family:'JetBrains Mono';font-size:17px;font-weight:700;color:var(--bc);margin-top:2px}
.bat .spenv{background:#FEF3E7;color:#8A5A08;font-size:11.5px;font-weight:700;
  padding:7px 11px;border-top:1px solid #F0C89A;letter-spacing:.02em}
.bat.st-pronto{opacity:.72}
.bat .bsop{background:#FEF3E7;color:#8A5A08;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat .bfin{background:#EAF2FE;color:#1D4ED8;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat .bvira{background:#F3EAFB;color:#6D28D9;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat.trocar{border-color:#2563EB;box-shadow:0 0 0 2px rgba(37,99,235,.3);background:#EEF4FF}
.vao.alvo{background:#CFEDDE;border-color:#0E9F6E;border-style:solid}
.vaoslim.alvo::before{opacity:1;height:3px}
.vaoslim.alvo i{opacity:1;transform:scale(1.15)}
body.arrastando .vaoslim{height:30px}
body.arrastando .vaoslim i{opacity:.4}
.bat .batr{background:#FBEEC8;color:#8A5A08;font-size:10.5px;font-weight:700;
  padding:6px 11px;line-height:1.35}
.tagx.ok{background:var(--run);color:#fff}
/* concluída: acinzentada, como evento passado */
.blk.st-concluida{background:var(--line3)!important;border-color:var(--line)!important;
  border-left-color:var(--ink3)!important;opacity:.6}
.blk.st-concluida .t1{color:var(--ink3)!important;font-weight:600}
.blk.st-concluida .t2,.blk.st-concluida .t3{color:var(--ink3)}
.blk.st-concluida .pr{opacity:.2}

.tqwrap{flex:1;overflow:auto;background:var(--surface);padding:16px}
.tqgrid{display:flex;gap:12px;min-width:max-content;align-items:flex-start}
.tqcol{width:272px;flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden}
.tqh{padding:11px 13px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.tqh .n{display:flex;align-items:baseline;gap:8px}
.tqh .n b{font-family:'Barlow Condensed';font-size:20px;font-weight:700}
.tqh .n span{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-left:auto}
.tqh .s{font-size:11px;color:var(--ink3);margin-top:2px}
.tqb{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:70px}
.bat{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  border-left:4px solid var(--bc);cursor:pointer}
/* sem isto o navegador seleciona o texto do card em vez de arrastá-lo */
.bat[draggable="true"]{cursor:grab;user-select:none;-webkit-user-select:none;
  -webkit-user-drag:element}
.bat[draggable="true"]:active{cursor:grabbing}
.bat[draggable="true"] *{user-select:none;-webkit-user-select:none}
.bat:hover{box-shadow:0 2px 10px rgba(0,0,0,.09)}
.bat.st-liberado{opacity:.85}
.bat.st-concluido{opacity:.55}
.bat.fora{border-color:var(--danger);border-left-color:var(--danger)}
.bat .bh{padding:9px 11px 7px;display:flex;align-items:flex-start;gap:8px}
.bat .bn{font-size:12.5px;font-weight:700;line-height:1.2;flex:1;color:var(--bc)}
.bat .bn .fam{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bat .bm{padding:0 11px 9px;font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink2);line-height:1.6}
.bat .bm .k{color:var(--ink3)}
.bat .bm .kk{color:var(--ink3);opacity:.8;padding-left:10px;position:relative}
.bat .bm .kk::before{content:'└';position:absolute;left:0;opacity:.5}
.bat .ban{display:flex;gap:6px;padding:0 11px 9px;flex-wrap:wrap}
.bat .ban span{font-family:'JetBrains Mono';font-size:10px;font-weight:700;background:var(--line3);
  color:var(--ink2);padding:2px 7px;border-radius:5px}
.bat .ban span.fora{background:#FBEAE8;color:var(--danger)}
.bat .bo{border-top:1px solid var(--line2);padding:7px 11px;font-size:10.5px;color:var(--ink3);line-height:1.5}
.bat .bpuxa{border-top:1px solid var(--line2);padding:8px 11px;text-align:center;
  font-size:11.5px;font-weight:700;color:#6D28D9;background:#FAF7FF;cursor:pointer}
.bat .bpuxa:hover{background:#F1ECFC}
.bat .bw{background:#FBEAE8;color:var(--danger);font-size:10.5px;font-weight:600;padding:5px 11px;line-height:1.35}
.sb.alvo{background:#F5F0FF;box-shadow:0 0 0 2px #CFC0F2 inset}
.tqcol.alvo{border-color:#0E9F6E;box-shadow:0 0 0 2px rgba(14,159,110,.25) inset;background:#F0FAF5}
.tqh[data-col]{cursor:grab;user-select:none}
.tqh .ord{position:absolute;top:7px;right:9px;display:flex;gap:3px;z-index:2}
.tqh .ordb{width:20px;height:20px;line-height:1;border:1px solid var(--line);background:var(--paper);
  border-radius:5px;color:var(--ink3);font-size:14px;cursor:pointer;padding:0;font-family:inherit}
.tqh .ordb:hover:not(:disabled){background:#EFE6FB;border-color:#6D28D9;color:#6D28D9}
.tqh .ordb:disabled{opacity:.28;cursor:default}
.tqh .n span{margin-right:46px}
.bat .spok{background:#E6F6EE;color:#15803D;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
#errbox{position:fixed;right:14px;bottom:14px;z-index:9999;max-width:460px;background:#fff;
  border:2px solid var(--danger);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.24);
  font-size:12px;overflow:hidden}
#errbox[hidden]{display:none!important}
#errbox .errh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--danger);color:#fff}
#errbox .errh b{flex:1;font-size:13px}
#errbox .errh button{background:transparent;border:0;color:#fff;font-size:15px;cursor:pointer;padding:0 2px}
#errbox .erri{padding:8px 12px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono';
  font-size:11px;line-height:1.45;color:var(--ink)}
#errbox .errp{padding:8px 12px;color:var(--ink3);line-height:1.45}
.tqh[data-col]:active{cursor:grabbing}
.tqh[data-col]::after{content:"⠿";position:absolute;right:11px;bottom:7px;font-size:12px;color:var(--ink3);opacity:0;transition:opacity .12s}
.tqcol:hover .tqh[data-col]::after{opacity:.55}
.tqcol.alvocol{border-color:#6D28D9;box-shadow:0 0 0 2px rgba(109,40,217,.28) inset;background:#F7F2FD}
.tqcol.alvocol .tqh{background:#EFE6FB}
body.arrastando-col .tqcol{border-style:dashed}
body.tv .tqh[data-col]{cursor:default}
body.tv .tqh[data-col]::after{display:none}
.tqcol.alvo .tqh{background:#E4F4EC}
.olist .o.pend{border-color:#CFC0F2;background:#FCFAFF;cursor:grab}
.olist .o.urg{border-color:#E0A96A;background:#FEF6EC}
.olist .o.pend:hover{border-color:#9C7BE8;box-shadow:0 2px 10px rgba(109,40,217,.14)}
.olist .o .fam{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
body.arrastando .tqcol{border-style:dashed}
.diacol{flex-shrink:0;width:420px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.diacol.hoje{border-color:#2563EB;box-shadow:0 0 0 1px rgba(37,99,235,.25)}
.diah{padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px}
.diah b{font-family:'Barlow Condensed';font-size:18px;font-weight:700;text-transform:capitalize}
.diah span{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-left:auto}
.diab{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}
.mqsub{min-width:0}
.mqh{font-size:9.5px;font-weight:700;color:var(--ink3);text-align:center;
  padding-bottom:5px;border-bottom:1px solid var(--line2);margin-bottom:6px;letter-spacing:.06em}
.mqh u{display:block;font-family:'JetBrains Mono';font-size:8.5px;font-weight:500;
  text-decoration:none;opacity:.8;margin-top:1px}
.mqh i{display:block;font-style:normal;font-family:'JetBrains Mono';font-size:8.5px;
  font-weight:500;color:var(--ink3);opacity:.75;margin-top:1px}
.diab .bat{margin-bottom:5px}
.diab .bat .bn{font-size:11px}
.diab .bat .bm{font-size:9.5px;line-height:1.55;padding:0 7px 7px}
.diab .bat .bh{padding:7px 7px 3px}
.diab .bat .stq{font-size:8.5px;padding:2px 6px}
.diab .bat .bsop,.diab .bat .bfin,.diab .bat .bw,.diab .bat .bvira{font-size:9px;padding:4px 7px}
.vao.mini{padding:5px 7px;flex-direction:column;gap:2px;text-align:center}
.vao.mini span{font-family:'JetBrains Mono';font-size:9.5px;color:#0E7A50}
.vao.mini i{width:18px;height:18px;font-size:13px}
.tqvazio{text-align:center;color:var(--ink3);font-size:11.5px;padding:20px 8px;line-height:1.55}

.side{width:300px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.sh{padding:13px 15px;border-bottom:1px solid var(--line2)}
.sh h3{font-size:13.5px;font-weight:700;line-height:1.3}
.sh .sub{font-size:11px;font-weight:500;color:var(--ink3);margin-top:2px}
.sb{flex:1;overflow-y:auto;padding:12px 14px}
.olist .o{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.olist .o:hover{border-color:var(--ink3);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.olist .o.fim{opacity:.5}
.olist .o .n{font-size:12.5px;font-weight:600;line-height:1.25}
.olist .o .m{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-top:4px}
.empty{color:var(--ink3);font-size:12.5px;line-height:1.6;padding:20px 4px}
.stq{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.stq.programada{background:var(--line3);color:var(--ink2)}
.stq.concluida{background:#E6F4EA;color:var(--run)}
.stq.aguardando{background:#FDF3E3;color:var(--pausa)}
.stq.liberado{background:#E6F4EA;color:var(--run)}
.stq.concluido{background:var(--line3);color:var(--ink3)}
.stq.saldo{background:#F1ECFC;color:#6D28D9}
.stq.atrasadaq{background:#FBEEC8;color:#8A5A08}
.stq.finalizado{background:#EAF2FE;color:#1D4ED8}
.stq.preparacao{background:#E0F2F7;color:#0E7490}
.stq.producao{background:#E6F4EA;color:var(--run)}
.stq.atrasada{background:#FBEEC8;color:#8A5A08}
.stq.pendente{background:#F1ECFC;color:#6D28D9}

/* relatório */
.rep{flex:1;overflow:auto;background:var(--surface);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3)}
.kpi .v{font-family:'Barlow Condensed';font-size:28px;font-weight:700;line-height:1.05;margin-top:4px}
.kpi .v.ok{color:var(--run)}.kpi .v.ruim{color:var(--danger)}.kpi .v.aviso{color:var(--pausa)}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:3px}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);
  margin:0 0 10px;display:flex;align-items:center;gap:9px}
.st::after{content:'';flex:1;height:1px;background:var(--line)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;font-size:12.5px;margin-bottom:20px}
th{background:var(--line3);text-align:left;padding:9px 12px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line2)}
td.n,th.n{text-align:right;font-family:'JetBrains Mono';white-space:nowrap}
tr:hover td{background:#FCFBF8}
tfoot td{background:var(--line3);font-weight:700;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
.pill.ok{background:#E6F4EA;color:var(--run)}
.pill.med{background:#FDF3E3;color:var(--pausa)}
.pill.mau{background:#FBEAE8;color:var(--danger)}
tr.mot td{background:#FDFAF0;font-size:11px;color:#7A5C0B;padding:6px 12px}
.vazio{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:34px;
  text-align:center;color:var(--ink3);font-size:13px;line-height:1.6}

.mask{position:fixed;inset:0;background:rgba(26,29,35,.45);display:none;place-items:center;z-index:60;padding:18px}
.mask.on{display:grid}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:470px;max-height:93vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:920px}
.modal.sacode{animation:sacode .28s}
@keyframes sacode{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.mh{padding:15px 19px 13px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:10px}
.mh h3{font-size:15.5px;font-weight:700}
.mh p{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:400}
.mh .x{color:var(--ink3);font-size:20px;line-height:1}
.mb{padding:16px 19px;overflow-y:auto;flex:1}
.mf{padding:12px 19px 16px;border-top:1px solid var(--line2);display:flex;
  align-items:flex-end;gap:14px;flex-wrap:wrap}
.mf .mfesq{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mf .mfrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.mf .mfrow:empty{display:none}
.mf .mfesq:empty{display:none}
.mf .mfdir{display:flex;gap:8px;flex-shrink:0;margin-left:auto}
#mAcao:empty{display:none}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fld label b{color:var(--danger);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:13.5px;background:var(--surface)}
.fld textarea{resize:vertical;min-height:60px}
.fld input:disabled,.fld select:disabled{background:var(--line3);color:var(--ink3)}
.fld input.dentro{border-color:#9FD3B4;background:#F6FCF9}
.fld input.fora{border-color:#E2A29C;background:#FDF4F3;color:var(--danger);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.gsku{display:grid;grid-template-columns:96px 1fr;gap:9px}
.gsku .sku{font-family:'JetBrains Mono';font-weight:700;text-align:center;letter-spacing:.04em}
.pin{font-family:'JetBrains Mono';font-size:21px!important;letter-spacing:.35em;text-align:center;font-weight:700}
.sec{border-top:1px solid var(--line2);margin-top:4px;padding-top:14px}
.calc{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.75}
.calc b{font-family:'JetBrains Mono';font-weight:700}
.calc .w{color:var(--danger);font-weight:600}
.alert{background:#FEF9E7;border:1px solid #F0DFA8;border-radius:9px;padding:10px 12px;
  font-size:12.5px;color:#7A5C0B;line-height:1.45;margin-bottom:13px}
.alert.red{background:#FBEAE8;border-color:#EFCCC8;color:var(--danger)}
.alert.blue{background:#EAF2FE;border-color:#C7DBFA;color:#1D4ED8}
.alert.ok{background:#E9F6EE;border-color:#B7E0C6;color:#14532D}
.log{border-top:1px solid var(--line2);margin-top:12px;padding-top:11px}
.log .e{display:flex;gap:9px;font-size:11.5px;padding:4px 0;line-height:1.45}
.log .e .t{font-family:'JetBrains Mono';color:var(--ink3);flex-shrink:0}
.log .e em{font-style:normal;color:var(--ink2);display:block}
.usu{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);font-weight:600}
.usu b{font-weight:700}
.usu button{color:var(--ink3);font-size:11.5px;text-decoration:underline}
.usu button:hover{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;
  z-index:90;opacity:0;transition:.22s;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--danger)}
/* ===== modo TV: leitura à distância ===== */
body.tv .tabs,body.tv .sw,body.tv .nav,body.tv #nova,body.tv #novoSaldo,
body.tv #baixar,body.tv #abrir,body.tv #tv,body.tv .side{display:none!important}
body.tv .top{padding:12px 22px}
body.tv h1{font-size:26px}
body.tv .per{font-size:19px;min-width:auto}
body.tv .chip{font-size:14px;padding:8px 14px}
body.tv #salvo{opacity:.55}
body.tv .tqgrid{gap:16px}
body.tv .tqcol{width:auto;flex:1;min-width:0}
body.tv .tqh{padding:14px 16px}
body.tv .tqh .n b{font-size:30px}
body.tv .tqh .n span,body.tv .tqh .s{font-size:14px}
body.tv .bat .bn{font-size:19px}
body.tv .bat .bm{font-size:15px;line-height:1.7;padding-bottom:12px}
body.tv .bat .stq{font-size:13px;padding:5px 12px}
body.tv .bat .bsop,body.tv .bat .bfin,body.tv .bat .bw,body.tv .bat .spenv{font-size:14px;padding:9px 14px}
body.tv .vao .vt b{font-size:15px}
body.tv .vao .vt span{font-size:13px}
body.tv .vao i,body.tv .vaoslim{display:none}
body.tv .tqwrap{padding:18px}
body.tv .bat{cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =====================================================================
   PAINEL DA TV — tela cheia própria, por cima de tudo
   ===================================================================== */
.tvpanel{position:fixed;inset:0;z-index:900;background:#EEF0F3;color:#12151A;
  display:flex;flex-direction:column;overflow:hidden}
.tvpanel[hidden]{display:none!important}
.tvpanel *{box-sizing:border-box}
.tvtop{display:flex;align-items:center;gap:13px;padding:7px 16px;background:#fff;
  border-bottom:1px solid #DDE1E7;flex-shrink:0}
.tvtop h1{font-family:'Barlow Condensed';font-size:23px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;line-height:1;margin:0}
.tvtop .sp{flex:1}
.tvclock{font-family:'JetBrains Mono';font-weight:700;font-size:22px;letter-spacing:.02em;
  background:#12151A;color:#fff;padding:5px 12px;border-radius:8px;line-height:1}
.tvhoje{font-family:'Barlow Condensed';font-size:16px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:#4A5361}
.tvsair{font:inherit;font-size:12px;font-weight:600;color:#8A93A1;border:1px solid #DDE1E7;
  background:#F4F6F8;padding:5px 11px;border-radius:8px;cursor:pointer}
.tvsair[hidden]{display:none!important}

.tvgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:11px;
  padding:10px 11px 11px;min-height:0}
.tvmaq{background:#fff;border:1px solid #DDE1E7;border-radius:14px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tvmaq::before{content:"";height:5px;background:var(--sit)}
.tvmh{display:flex;align-items:center;gap:10px;padding:11px 14px 9px}
.tvmh b{font-family:'Barlow Condensed';font-size:27px;font-weight:700;line-height:1;letter-spacing:.02em}
.tvtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:5px 10px;border-radius:999px;color:#fff;background:var(--sit);line-height:1}

/* o card grande só existe quando o operador iniciou */
.tvagora{margin:0 12px;border:2px solid var(--sit);border-radius:12px;overflow:hidden}
.tvabar{display:flex;align-items:center;gap:10px;background:var(--sit);color:#fff;padding:5px 12px}
.tvabar .t{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.tvabar .d{font-family:'JetBrains Mono';font-size:13px;font-weight:700}
.tvabody{padding:10px 12px 11px}
.tvprod{font-family:'Barlow Condensed';font-size:26px;font-weight:700;line-height:1.05;
  letter-spacing:.015em;text-transform:uppercase;margin-bottom:9px}

/* o que o operador confere antes de abrir a válvula */
.tvpanel .dest{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:#BFD2FA;
  border:1px solid #BFD2FA;border-radius:10px;overflow:hidden;margin-bottom:8px}
.tvpanel .dcel{background:#E8EFFD;padding:7px 11px}
.tvpanel .dcel .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:#1D4ED8;opacity:.82;margin-bottom:2px}
.tvpanel .dcel .vl{font-family:'Barlow Condensed';font-size:21px;font-weight:700;line-height:1;color:#1D4ED8}
.tvpanel .dcel .vl .num{font-family:'JetBrains Mono';font-size:18px}
.tvpanel .dcel .vl .lt{font-family:'JetBrains Mono';font-size:16px}
.tvpanel .d2{grid-column:span 2}
.tvpanel .d3{grid-column:span 3}

.tvpanel .tempos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tvpanel .tcx{border:1px solid #DDE1E7;border-radius:9px;padding:7px 10px}
.tvpanel .tcx.real{border-color:var(--sit)}
.tvpanel .tcx .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:#8A93A1;margin-bottom:2px}
.tvpanel .tcx .vl{font-family:'JetBrains Mono';font-size:16px;font-weight:700;line-height:1}
.tvpanel .tcx.prev .vl{color:#4A5361}
.tvpanel .tcx .curso{font-size:12.5px;font-weight:600;color:#8A93A1}

.tvparada{margin:0 12px;border:1px dashed #DDE1E7;border-radius:12px;background:#F4F6F8;
  padding:14px;text-align:center}
.tvparada .t{font-family:'Barlow Condensed';font-size:20px;font-weight:600;color:#4A5361;
  text-transform:uppercase;letter-spacing:.02em}
.tvparada .s{font-size:12.5px;color:#8A93A1;margin-top:3px}
.tvparada .s b{font-family:'JetBrains Mono';color:#4A5361}

.tvfilah{display:flex;align-items:center;gap:9px;padding:11px 14px 6px}
.tvfilah span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8A93A1}
.tvfilah hr{flex:1;border:0;border-top:1px solid #EAEDF1}
.tvfila{padding:0 12px 12px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.tvfila .tvoc[hidden],.tvfila .mais[hidden]{display:none!important}
.tvoc{border:1px solid #DDE1E7;border-left:3px solid var(--fam);border-radius:9px;
  background:#fff;padding:7px 11px;flex-shrink:0}
.tvoc .n{font-family:'Barlow Condensed';font-size:17px;font-weight:600;line-height:1.12;margin-bottom:2px;
  text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.tvoc .m{font-family:'JetBrains Mono';font-size:11px;color:#8A93A1;line-height:1.45}
.tvoc .m b{color:#4A5361;font-weight:700}
.tvoc .m .hr{color:#12151A;font-weight:700}
.tvoc.fim{background:#F4F6F8;opacity:.72}
.tvoc.fim .n{color:#4A5361}
.tvpanel .selo{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:#127A41;background:#E7F5ED;border:1px solid #BFE2CE;border-radius:999px;padding:3px 8px;line-height:1}
.tvpanel .mais{border:1px dashed #DDE1E7;border-radius:9px;padding:6px 12px;text-align:center;
  font-size:11.5px;font-weight:600;color:#8A93A1;flex-shrink:0}
.tvvazio{padding:22px 12px;text-align:center;color:#8A93A1;font-size:13px}

@media (max-width:1100px){
  .tvgrid{grid-template-columns:1fr;overflow-y:auto}
  .tvpanel .dest{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tvpanel .d2,.tvpanel .d3{grid-column:span 1}
}
.rep .sub2{font-size:10px;color:var(--ink3);font-weight:400;margin-top:2px}


/* ---------- tela de login ---------- */
.login{position:fixed;inset:0;z-index:1200;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:20px}
.login[hidden]{display:none!important}
.lgcx{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:26px 24px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.lgcx h1{font-family:'Barlow Condensed';font-size:29px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 4px;line-height:1}
.lgcx p{font-size:12.5px;color:var(--ink3);margin:0 0 18px;line-height:1.5}
.lgcx .fld{margin-bottom:12px}
.lgcx .btn{width:100%;justify-content:center;margin-top:6px}
.lgerro{background:#FDECEE;border:1px solid #F5C2C7;color:#B02A37;border-radius:9px;
  padding:9px 12px;font-size:12.5px;line-height:1.45;margin-bottom:10px}
.lgerro[hidden]{display:none!important}
.lgpe{font-size:11.5px;color:var(--ink3);margin-top:14px;text-align:center;line-height:1.45}

/* ---------- marca ---------- */
.top .logo{height:26px;width:auto;display:block;flex-shrink:0}
.lglogo{height:52px;width:auto;display:block;margin:0 auto 14px}
.tvtop .tvlogo{height:26px;width:auto;display:block;flex-shrink:0}
.lgcx{text-align:center}
.lgcx .fld,.lgcx .lgerro{text-align:left}
.lgcx h1{font-family:'Barlow Condensed';font-size:19px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 4px;line-height:1.15}

/* ---------- acessos ---------- */
.acth{font-family:'Barlow Condensed';font-size:25px;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;margin:0 0 3px}
.actp{font-size:12.5px;color:var(--ink3);line-height:1.5;margin:0 0 16px;max-width:620px}
.sen{font-family:'JetBrains Mono';font-weight:700;background:#EAF2FE;color:#1D4ED8;
  padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.ordb.del:hover:not(:disabled){background:#FDECEE;border-color:var(--danger);color:var(--danger)}
.vazioc{padding:26px 12px;text-align:center;color:var(--ink3);font-size:13px}

/* ---------- perdas por motivo ---------- */
.perdt{font-family:'Barlow Condensed';font-size:21px;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;margin:26px 0 10px}
.perdb{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.perdb.vermelho{border-color:#F0BFC4}
.perdb.laranja{border-color:#F0D5AC}
.perdh{display:flex;align-items:baseline;gap:10px;padding:9px 14px;color:#fff;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.perdb.vermelho .perdh{background:var(--danger)}
.perdb.laranja .perdh{background:#B45309}
.perdh span{flex:1}
.perdh b{font-family:'JetBrains Mono';font-size:17px;letter-spacing:0}
.perdc{padding:12px 14px;background:var(--surface)}
.perdm{padding-top:11px;margin-top:11px;border-top:1px solid var(--line2)}
.perdm:first-child{padding-top:0;margin-top:0;border-top:0}
.perdmh{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.perdmh span{font-family:'Barlow Condensed';font-size:17px;font-weight:700;flex:1}
.perdmh b{font-family:'JetBrains Mono';font-size:13.5px}
.perdmh i{font-style:normal;font-size:11px;color:var(--ink3)}
.perdl{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.perdl span{width:160px;font-size:12.5px;color:var(--ink2)}
.perdl b{width:110px;text-align:right;font-family:'JetBrains Mono';font-size:11.5px;font-weight:700}
.perdbar{flex:1;height:7px;background:var(--line2);border-radius:999px;overflow:hidden}
.perdbar i{display:block;height:100%;background:var(--danger)}
.perdb.laranja .perdbar i{background:#B45309}
.perdz{font-size:12.5px;color:var(--ink3);padding:12px 2px;line-height:1.5}

/* ---------- motivos na conclusão ---------- */
.mot{border:1px solid var(--line);border-left:3px solid #B45309;border-radius:10px;
  padding:11px 13px;margin-top:13px;background:var(--surface)}
.mot.q{border-left-color:var(--danger)}
.motc{font-size:13px;color:var(--ink);margin-bottom:8px;display:flex;align-items:baseline;gap:9px}
.mott{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.motl{display:flex;flex-wrap:wrap;gap:6px}
.motb{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.motb:hover{border-color:var(--ink3)}
.motb.on{background:#1D4ED8;border-color:#1D4ED8;color:#fff}
.motb.pr{background:#12306E;border-color:#12306E}
.motp{margin-top:8px;font-size:11px;color:var(--ink3);line-height:1.45}

/* ---------- Administração em abas ---------- */
.adabas{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  margin-bottom:20px;padding-bottom:0}
.adaba{font:inherit;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;
  background:transparent;border:0;border-bottom:2px solid transparent;

table.cpr td.e{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}

.qbr{display:inline-block;font-size:11px;font-weight:600;background:#FDECEE;color:#B02A37;
  border:1px solid #F5C2C7;border-radius:999px;padding:1px 8px;margin-left:6px;
  font-family:'Inter'}

.vaoop{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--card)}
.vaoop:hover{border-color:#1D4ED8;background:#F7FAFF}
.vaoop b{display:block;font-size:13.5px}
.vaoop span{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.vaolista{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.vaoit{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.vaoit:hover{border-color:#1D4ED8;background:#F7FAFF}
.vaoit.nao{opacity:.55}
.vaoit .n{display:block;font-size:13px;font-weight:600}
.vaoit .d{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.vaoit .w{display:block;font-size:11px;color:#B45309;margin-top:3px}

.puxarop{display:block;margin-top:7px;font:inherit;font-size:11.5px;font-weight:600;
  cursor:pointer;border:1px solid var(--run);border-radius:999px;padding:4px 11px;
  background:#fff;color:var(--run);max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.puxarop:hover{background:var(--run);color:#fff}

.linkb{font:inherit;font-size:12.5px;font-weight:600;color:#1D4ED8;background:none;
  border:none;border-bottom:1px solid #9DBEF5;padding:0;cursor:pointer;margin-left:4px}
.linkb:hover{border-bottom-color:#1D4ED8}
</style>

/* =====================================================================
   LOTE — numérico, do tanque, sequência por granel.
   O número parte do último que o Tiny usou, cadastrado uma vez.
   Uma batelada tem um lote só: os formatos que puxam dela o herdam.
   ===================================================================== */
const PROX_LOTE={};                       /* granel -> próximo número */
const proxLote=g=>{const v=PROX_LOTE[g];return v==null?null:+v;};
/* chave da batelada: mesmo tanque, mesmo granel, mesmo dia */
const chaveLote=o=>{const p=prodOf(o.codigo);
  return [o.data,o.tanque||'',p?p.tanque:''].join('|');};
/* devolve o lote da batelada a que esta OP pertence, criando se for a primeira */
function loteDaBatelada(o,criar){
  const ch=chaveLote(o);
  const irmao=ORDENS.find(x=>x!==o&&x.lote&&naGrade(x)&&chaveLote(x)===ch);
  if(irmao)return irmao.lote;
  if(!criar)return null;
  const p=prodOf(o.codigo);if(!p)return null;
  /* sem numeração cadastrada, começa em 1 — o lote nunca fica em branco */
  const n=proxLote(p.tanque)??1;
  PROX_LOTE[p.tanque]=n+1;
  agendarSalvar();
  return String(n);
}
const somaMP=g=>(formulaDe(g).mp||[]).reduce((s,x)=>s+(+x.pct||0),0);
/* quanto de cada insumo uma batelada consome */
function consumoMP(g,litros){
  return (formulaDe(g).mp||[]).map(x=>({...x,
    kg:+( (+x.pct||0)/100*(litros||0) ).toFixed(3),
    total:+( (+x.pct||0)/100*(litros||0)*(+x.custo||0) ).toFixed(2)}));
}

const ensaiosDe=g=>{const e=especDe(g);return e?ENSAIOS.filter(([k])=>e[k]):[];};
/* devolve 'ok', 'fora' ou null quando ainda não foi medido */
function confereEnsaio(g,k,valor){
  const e=especDe(g);if(!e||!e[k])return null;
  if(QUALI.includes(k))return valor==='ok'?'ok':(valor==='fora'?'fora':null);
  if(valor===''||valor==null)return null;
  const v=+String(valor).replace(',','.');
  if(isNaN(v))return null;
  const f=e[k];
  if(f.min!=null&&v<f.min)return 'fora';
  if(f.max!=null&&v>f.max)return 'fora';
  return 'ok';
}

const temOC=d=>ORDENS.some(o=>o.data===ymd(d)&&naGrade(o));
const diaUtil=d=>{const w=d.getDay();return w>=1&&w<=5||w===6&&temOC(d);};
function proximoUtil(d,dir){let x=new Date(d),g=0;
  while(!diaUtil(x)&&g++<14)x=addD(x,dir);return x;}
function andarUteis(ref,n){
  let x=new Date(ref),dir=n<0?-1:1,faltam=Math.abs(n);
  while(faltam>0){x=addD(x,dir);if(diaUtil(x))faltam--;}
  return x;}
function diasHorizonte(ref,qtd){
  const out=[];let x=proximoUtil(new Date(ref),1);
  while(out.length<qtd){if(diaUtil(x))out.push(new Date(x));x=addD(x,1);}
  return out;}

/* =====================================================================
   ORDENS — base zerada, pronta para lançar
   ===================================================================== */
const ORDENS=[];
function ordem(o){
  ORDENS.push({id:uid(),...o,status:o.status||'programada',
    turnos:o.turnos||[],
    iniReal:o.iniReal||'',setupFim:o.setupFim||'',envIni:o.envIni||'',fimReal:o.fimReal||'',
    caixas:o.caixas??null,log:o.log||[]});
  const nova=ORDENS[ORDENS.length-1];
  /* lote é do tanque: herda do irmão da mesma batelada ou tira número novo */
  if(!nova.lote&&nova.tanque)nova.lote=loteDaBatelada(nova,true)||'';
  return nova;
}
const total=o=>o.setup+o.envase;
/* realizado por etapa: setup (iniReal→setupFim) e envase (envIni→fimReal) */
const setupReal=o=>(o.iniReal&&o.envIni)?Math.max(0,hm(o.envIni)-hm(o.iniReal)):null;
const iniEnvase=o=>o.envIni||o.iniReal||'';
const envaseReal=o=>{const i=iniEnvase(o);
  return (i&&o.fimReal)?Math.max(0,hm(o.fimReal)-hm(i)):null;};
const dvSetup=o=>{const t=setupReal(o);return t==null?null:t-o.setup;};
const dvEnvase=o=>{const t=envaseReal(o);return t==null?null:t-o.envase;};
const badge=v=>(v==null||v===0)?'':` <b style="color:${v>0?'var(--danger)':'var(--run)'}">${v>0?'+':''}${v}</b>`;
const fimPrev=o=>o.inicio+total(o);
const caixasPrev=o=>{const p=prodOf(o.codigo);return Math.floor(o.litros/(p.un_cx*p.litragem));};
const litrosCx=o=>{const p=prodOf(o.codigo);return p.un_cx*p.litragem;};
/* O fechamento é medido em LITROS. Caixas de formatos diferentes não se somam:
   316 cx de 2L (12 L/cx) e 500 cx de 5L (20 L/cx) não são 816 de nada. */
const litrosFeitos=o=>o.caixas==null?null:o.caixas*litrosCx(o);
const quebraL=o=>{const f=litrosFeitos(o);return f==null?null:o.litros-f;};
const somaL=(l,f)=>l.reduce((s,o)=>s+(f(o)||0),0);
const ativa=o=>o.status!=='cancelada';
/* tempo de produção realizado, em minutos */
const tempoReal=o=>(o.iniReal&&o.fimReal)?Math.max(0,hm(o.fimReal)-hm(o.iniReal)):null;
const desvio=o=>{const t=tempoReal(o);return t==null?null:t-total(o);};
const ST={programada:'Programada',preparacao:'Preparação',producao:'Produção',
  finalizado:'Envase finalizado',concluida:'Concluída',
  cancelada:'Cancelada',pendente:'Saldo a reprogramar'};
/* a situação vem dos horários lançados, não de um campo escolhido */
function sit(o){
  if(['cancelada','pendente'].includes(o.status))return o.status;
  /* turnos abertos: a OP continua em produção mesmo com o dia fechado */
  if((o.turnos||[]).length&&cxFeitas(o)<caixasPrev(o))return 'producao';
  if(o.fimReal&&o.caixas!=null)return 'concluida';
  if(o.fimReal)return 'finalizado';
  if(o.envIni) return 'producao';
  if(o.iniReal)return 'preparacao';
  return 'programada';
}
const emAndamento=o=>['preparacao','producao'].includes(sit(o));
/* saldo interrompido fica fora da grade até ser reprogramado */
const naGrade=o=>!['cancelada','pendente'].includes(o.status);

/* saldos já existentes no tanque — sobra de produção anterior */

function saldo(x){SALDOS.push({id:uid(),...x});return SALDOS[SALDOS.length-1];}
const consumidoDe=id=>ORDENS.filter(o=>o.saldoId===id&&ativa(o)).reduce((s,o)=>s+o.litros,0);
const dispDe=sd=>sd.volume-consumidoDe(sd.id);

/* apontamento do lote de tanque, por (data|tanque|lote) */
const APONTA={};

/* =====================================================================
   BATELADAS — derivadas das ordens de envase
   ===================================================================== */
function bateladas(data){
  const list=[];
  /* saldos existentes: aparecem no dia em que foram lançados e seguem
     visíveis enquanto tiverem volume disponível */
  SALDOS.filter(sd=>sd.data<=data&&(dispDe(sd)>0||ORDENS.some(o=>o.saldoId===sd.id&&o.data===data)))
    .forEach(sd=>{
      const ords=ORDENS.filter(o=>o.saldoId===sd.id&&ativa(o));
      list.push({origem:'saldo',saldoId:sd.id,data:sd.data,tanque:sd.tanque,produto:sd.produto,
        grupo:sd.grupo,volume:sd.volume,consumido:consumidoDe(sd.id),disponivel:dispDe(sd),
        desde:sd.interrompidoEm||'',
        ordens:ords,lotes:new Set(ords.map(o=>o.lote).filter(Boolean)),
        prontoAte:ords.length?Math.min(...ords.map(o=>o.inicio??Infinity)):Infinity,idx:0,g:'saldo'+sd.id});
    });

  /* agrupa por tanque + produto, mas quebra em bateladas sequenciais
     sempre que o volume acumulado passa da capacidade — duas produções
     de 3.800 L no mesmo tanque são duas bateladas, uma depois da outra */
  const grupos={};
  ORDENS.filter(o=>o.data===data&&ativa(o)&&!o.saldoId).forEach(o=>{
    const pr=prodOf(o.codigo);
    const g=`${o.data}|${o.tanque||'—'}|${pr.tanque}`;
    (grupos[g] ||= []).push(o);
  });

  Object.entries(grupos).forEach(([g,ords])=>{
    ords.sort((a,b)=>(a.inicio??0)-(b.inicio??0));
    const tanque=ords[0].tanque||null;
    const pr=prodOf(ords[0].codigo);
    /* limite: o tanque escolhido ou a menor capacidade que comporte a ordem */
    const limite=tanque?tqOf(tanque).cap
      :(CAPACIDADES.find(c=>c>=Math.max(...ords.map(o=>o.litros)))||Math.max(...CAPACIDADES));
    let atual=null;
    ords.forEach(o=>{
      if(!atual||atual.volume+o.litros>limite){
        atual={data,tanque,produto:pr.tanque,grupo:pr.grupo,
          volume:0,ordens:[],lotes:new Set(),prontoAte:Infinity,idx:list.filter(b=>b.g===g).length,g};
        list.push(atual);
      }
      atual.volume+=o.litros;atual.ordens.push(o);
      if(o.lote)atual.lotes.add(o.lote);
      if(o.inicio!=null)atual.prontoAte=Math.min(atual.prontoAte,o.inicio);
    });
  });

  list.forEach(b=>{
    b.lote=[...b.lotes].join(', ');
    b.chave=b.origem==='saldo'?`saldo|${b.saldoId}`:`${b.data}|${b.tanque||'—'}|${b.produto}|${b.idx}`;
    const a=APONTA[b.chave]||{};
    b.obs=a.obs||'';b.liberadoEm=a.liberadoEm||'';b.log=a.log||[];b.concluidoEm=a.concluidoEm||'';
    b.analise=a.analise||null;          /* {resultados:{}, por:'', em:''} */
    b.excedeCap=b.tanque?b.volume>tqOf(b.tanque).cap:false;
    if(b.origem==='saldo'){
      b.status=b.disponivel<=0&&b.ordens.every(o=>sit(o)==='concluida')?'concluido'
        :(b.liberadoEm?'liberado':'saldo');
    }else{
      const todas=b.ordens.length&&b.ordens.every(o=>sit(o)==='concluida');
      b.status=(todas||b.concluidoEm)?'concluido':(b.liberadoEm?'liberado':'aguardando');
    }
    b.ordem=1;b.total=1;
  });
  TANQUES.forEach(t=>{
    const seq=list.filter(b=>b.tanque===t.id).sort((a,b)=>a.prontoAte-b.prontoAte);
    seq.forEach((b,i)=>{
      b.ordem=i+1;b.total=seq.length;
      /* limpeza só quando o granel anterior naquele tanque foi outro */
      b.trocouProduto=i===0?true:seq[i-1].produto!==b.produto;
    });
  });
  list.forEach(b=>{b.etapas=etapasDoLote(b);});
  return list;
}

/* =====================================================================
   LINHA DO TEMPO DO LOTE
   limpeza (se trocou de produto) → enchimento → fabricação → descanso
   → análise. O envase só pode começar quando tudo isso terminou.
   ===================================================================== */
function etapasDoLote(b){
  const g=tempoG(b.produto);
  const ench=b.tanque?(tqOf(b.tanque)||{}).ench||0:0;
  const passos=[];
  /* a limpeza é do produto: desinfetante sai rápido, lava roupas não */
  if(b.trocouProduto&&g.limpeza)passos.push({k:'limpeza',rot:'Limpeza',min:g.limpeza,
    nota:'trocou de produto'});
  if(ench)passos.push({k:'enchimento',rot:'Enchimento',min:ench,
    nota:'separação das MPs em paralelo'});
  if(g.fabricacao)passos.push({k:'fabricacao',rot:'Fabricação',min:g.fabricacao,nota:''});
  if(g.descanso)passos.push({k:'descanso',rot:'Descanso',min:g.descanso,nota:''});
  const total=passos.reduce((s,p)=>s+p.min,0);
  /* o preparo termina quando a primeira OP quer envasar; começa antes disso */
  const fimPreparo=b.prontoAte===Infinity?null:b.prontoAte;
  let t0=fimPreparo!=null?fimPreparo-total:null;
  passos.forEach(p=>{if(t0!=null){p.de=t0;p.ate=t0+p.min;t0=p.ate;}});
  return {passos,total,inicio:fimPreparo!=null?fimPreparo-total:null,
    fimPreparo:fimPreparo,pronto:b.liberadoEm?hm(b.liberadoEm):null};
}
/* a que horas o envase pode começar de verdade */
function liberadoAPartir(b){
  if(b.liberadoEm)return hm(b.liberadoEm);
  return b.etapas&&b.etapas.fimPreparo!=null?b.etapas.fimPreparo:null;
}
/* a análise cumpre a especificação? */
function analiseOk(b){
  const ens=ensaiosDe(b.produto);
  if(!ens.length)return {ok:true,pend:[],fora:[]};
  const r=(b.analise&&b.analise.resultados)||{};
  const pend=[],fora=[];
  ens.forEach(([k,rot])=>{
    const s=confereEnsaio(b.produto,k,r[k]);
    if(s===null)pend.push(rot); else if(s==='fora')fora.push(rot);
  });
  return {ok:!pend.length&&!fora.length,pend,fora,desvio:!!(b.analise&&b.analise.desvio)};
}
const batDe=o=>bateladas(o.data).find(b=>b.ordens.some(x=>x.id===o.id));
const loteDe=o=>{const b=batDe(o);return b?b.status:'aguardando';};
const loteLiberado=o=>['liberado','concluido'].includes(loteDe(o));

function aguardandoLiberacao(){
  const dias=[...new Set(ORDENS.filter(ativa).map(o=>o.data))];
  const r=[];
  dias.forEach(d=>bateladas(d).filter(b=>b.status==='aguardando').forEach(b=>r.push(b)));
  return r.sort((a,b)=>a.data.localeCompare(b.data)||a.prontoAte-b.prontoAte);
}

function conflitos(){
  const s=new Set(),by={};
  ORDENS.filter(naGrade).forEach(o=>{(by[o.maq+'|'+o.data] ||= []).push(o)});
  Object.values(by).forEach(l=>{
    for(let i=0;i<l.length-1;i++)for(let j=i+1;j<l.length;j++)
      if(l[i].inicio<fimPrev(l[j])&&l[j].inicio<fimPrev(l[i])){s.add(l[i].id);s.add(l[j].id);}
  });
  return s;
}
const fimEfetivo=o=>o.fimReal?hm(o.fimReal):fimPrev(o);
function ocupadas(maq,data,inicio,dur,ignora){
  const fim=inicio+dur;
  return ORDENS.filter(o=>o.maq===maq&&o.data===data&&ativa(o)&&sit(o)==='programada'
    &&(!ignora||o.id!==ignora)&&o.inicio<fim&&fimPrev(o)>inicio).sort((a,b)=>a.inicio-b.inicio);
}

/* =====================================================================
   ORDENS DE SOPRO — derivadas das OPs de envase
   ===================================================================== */
const LBL_SOP={aguardando:'Aguardando',soprando:'Soprando',pronto:'Pronto'};
const COR_SOP={aguardando:'#8B93A1',soprando:'#0891B2',pronto:'#15803D'};
/* rotulagem: segunda etapa do frasco. Soprado não basta, tem que estar rotulado. */
const LBL_ROT={aguardando:'Sem rótulo',rotulando:'Rotulando',pronto:'Rotulado'};
const COR_ROT={aguardando:'#8B93A1',rotulando:'#B45309',pronto:'#15803D'};

function sopros(data){
  return ORDENS.filter(x=>x.data===data&&ativa(x)&&x.status!=='pendente'
    &&sopraFrasco(prodOf(x.codigo))).map(x=>{
    const p=prodOf(x.codigo),fr=frascoDe(p);
    const un=caixasPrev(x)*p.un_cx;
    const ap=SOPRO[x.id]||{};
    const sop=ap.sopradora?sopOf(ap.sopradora):null;
    const cad=sop?sop.cad:(SOPRADORAS[0]||{cad:1000}).cad;
    const dur=Math.max(15,Math.ceil(un/cad*60/5)*5);
    const fimP=ap.fimPrev?hm(ap.fimPrev):x.inicio;      /* pronto quando o envase começa */
    const iniP=ap.iniPrev?hm(ap.iniPrev):Math.max(H0*60,fimP-dur);
    const boas=(ap.produzidas??0)-(ap.quebras??0);
    const rot=ap.rotulo||'aguardando';
    const st=ap.status||'aguardando';
    return {oc:x,codigo:x.codigo,frasco:fr,info:frascoInfo(fr),un,
      sopradora:ap.sopradora||null,iniPrev:iniP,fimPrev:fimP,dur,
      iniReal:ap.iniReal||'',fimReal:ap.fimReal||'',
      produzidas:ap.produzidas??null,quebras:ap.quebras??null,boas,
      obs:ap.obs||'',status:st,naFila:ap.fila??null,
      rot,rotIni:ap.rotIni||'',rotFim:ap.rotFim||'',rotQuem:ap.rotQuem||'',
      rotUn:ap.rotUn??null,rotObs:ap.rotObs||'',
      liberado:st==='pronto'&&rot==='pronto',
      falta:Math.max(0,un-boas),envaseEm:x.inicio};
  }).sort((a,b)=>a.envaseEm-b.envaseEm);
}
const soproDe=oc=>{if(!sopraFrasco(prodOf(oc.codigo)))return 'pronto';
  const a=SOPRO[oc.id]||{};return a.status||'aguardando';};
const rotuloDe=oc=>{if(!sopraFrasco(prodOf(oc.codigo)))return 'pronto';
  const a=SOPRO[oc.id]||{};return a.rotulo||'aguardando';};
/* o envase só pode contar com o frasco quando ele está soprado E rotulado */
const frascoOk=oc=>soproDe(oc)==='pronto'&&rotuloDe(oc)==='pronto';
/* o que falta, em uma palavra, para o card do envase */
function faltaNoFrasco(oc){
  const s=soproDe(oc),r=rotuloDe(oc);
  if(s!=='pronto')return s==='soprando'?'em sopro':'aguardando sopro';
  if(r!=='pronto')return r==='rotulando'?'em rotulagem':'soprado, falta rotular';
  return '';
}

function topo(conf){
  const env=S.page==='envase';
  M('vw').style.display=env?'':'none';
  M('nova').style.display=['relatorio','admin','sopro'].includes(S.page)?'none':'';
  M('novoSaldo').style.display=S.page==='tanques'?'':'none';
  const d=S.page==='envase'?S.ref:S.refTq;
  M('prev').disabled=M('next').disabled=['admin','inicio'].includes(S.page);
  const nomes={envase:'Envase',tanques:'Tanques',sopro:'Sopro',relatorio:'Relatórios',admin:'Administração'};
  try{M('ondeest').textContent=nomes[S.page]||'';}catch(e){}
  if(env&&S.view!=='dia'){
    const dias=diasHorizonte(S.ref,+S.view);
    const f=x=>`${p2(x.getDate())} ${x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}`;
    const asg=M('assina');
  if(asg){asg.textContent=quemAssina().split(' ')[0];
    asg.classList.toggle('pri',!!OPERADOR);
    asg.title=OPERADOR?`Lançando como ${OPERADOR.nome}`:'Clique para informar o PIN de quem está lançando';}
  M('per').textContent=`${f(dias[0])} – ${f(dias[dias.length-1])}`;
  }else M('per').textContent=dLongo(ymd(d));
  const c=M('conf');c.hidden=!conf.size;c.textContent=`${conf.size} sobrepostas`;
  const sl=ORDENS.filter(x=>x.status==='pendente').length,se=M('saldo');
  se.hidden=!sl;se.textContent=`${sl} a programar`;
  const hojeS=ymd(new Date());
  const sp=sopros(S.page==='envase'?ymd(S.ref):ymd(S.refTq)).filter(x=>!x.liberado).length;
  const se2=M('chipSop');se2.hidden=!sp;se2.textContent=`${sp} frasco${sp>1?'s':''} pendente${sp>1?'s':''}`;
  const at=ORDENS.filter(atrasada).length,ae=M('chipAtr');
  ae.hidden=!at;ae.textContent=`${at} atrasada${at>1?'s':''}`;
  const lb=aguardandoLiberacao(),le=M('lib');
  le.hidden=!lb.length;

/* ---------- fila: um dia ou horizonte de dias úteis ---------- */
function colunaMaq(m,data,conf,estreita){
  const seq=ORDENS.filter(o=>o.maq===m&&o.data===data&&naGrade(o)).sort((a,b)=>a.inicio-b.inicio);
  const ocup=seq.reduce((s,o)=>s+total(o),0);
  const [ji,jf]=jorn(m),jornMin=jf-ji,livre=Math.max(0,jornMin-ocup);
  let corpo='',cur=ji;
  seq.forEach(o=>{corpo+=vao(m,data,cur,o.inicio,estreita);corpo+=cardFila(o,conf,estreita);
    cur=Math.max(cur,o.fimReal?hm(o.fimReal):fimPrev(o));});
  corpo+=vao(m,data,cur,jf,estreita);
  if(estreita)return `<div class="mqsub">
    <div class="mqh">${m}<u>${hhmm(ji)}–${hhmm(jf)}</u>
      <i>${seq.length?`${seq.length} OP · ${Math.floor(livre/60)}h livre`:'livre'}</i></div>
    ${corpo}</div>`;
  return `<div class="tqcol" style="width:306px">
    <div class="tqh"><div class="n"><b>${m}</b>
      <span>${Math.floor(ocup/60)}h ${p2(ocup%60)} ocupada</span></div>
      <div class="s">${seq.length?`${seq.length} OP${seq.length>1?'s':''}`:'Sem programação'}
        · ${Math.floor(livre/60)}h ${p2(livre%60)} livres · jornada ${hhmm(ji)}–${hhmm(jf)}</div></div>
    <div class="tqb">${corpo}</div></div>`;
}

/* move a OP para outra máquina/horário */
function moverOC(o,maq,data,inicio){
  const [ji,jf]=jorn(maq);
  const novo=Math.max(ji,Math.min(jf-total(o),inicio));
  if(o.maq===maq&&o.data===data&&o.inicio===novo)return;
  const de=`${o.maq} ${hhmm(o.inicio)}`;
  o.maq=maq;o.data=data;o.inicio=novo;o.inicioOriginal=null;
  registrar(o,'Reprogramada na fila',null,`${de} → ${maq} ${hhmm(novo)}`);
  S.sel=o.id;render();toast(`${nomeCurto(o.codigo)} → ${maq}, ${hhmm(novo)}.`);
}
/* troca duas OPs de posição, inclusive entre máquinas */
function trocarOC(a,b){
  if(!a||!b)return;
  const A={maq:a.maq,data:a.data,inicio:a.inicio};
  const B={maq:b.maq,data:b.data,inicio:b.inicio};
  const [ja]=jorn(B.maq),[jb]=jorn(A.maq);
  Object.assign(a,{maq:B.maq,data:B.data,inicio:Math.max(ja,B.inicio)});
  Object.assign(b,{maq:A.maq,data:A.data,inicio:Math.max(jb,A.inicio)});
  a.inicioOriginal=null;b.inicioOriginal=null;
  registrar(a,'Trocada de posição',null,`${A.maq} ${hhmm(A.inicio)} ↔ ${B.maq} ${hhmm(B.inicio)}`);
  registrar(b,'Trocada de posição',null,`${B.maq} ${hhmm(B.inicio)} ↔ ${A.maq} ${hhmm(A.inicio)}`);
  S.sel=a.id;render();
  toast(`${nomeCurto(a.codigo)} ↔ ${nomeCurto(b.codigo)}.`);
}

      document.body.classList.remove('arrastando');setTimeout(()=>ARR=null,80);});

  /* a coluna inteira é alvo — dragenter e dragover precisam do preventDefault */
  M('tqgrid').querySelectorAll('.tqcol').forEach(z=>{

      ev.dataTransfer.dropEffect='move';if(ARR)marca(true);});
    z.addEventListener('dragleave',ev=>{if(!z.contains(ev.relatedTarget))marca(false);});
    z.addEventListener('drop',ev=>{

/* devolve o lote para a fila de programação, sem tanque */
function devolverParaProgramar(b){
  const antigo=b.tanque,apont=APONTA[b.chave];

  b.ordens.forEach(o=>{o.tanque=null;
    registrar(o,'Tanque removido',null,`${antigo} → a programar`);});
  render();
  toast(`${abrevTq(b.produto)} voltou para "a programar".`);
}

/* atribui ou troca o tanque de um lote inteiro */
function atribuirTanque(b,destino){
  const cap=tqOf(destino).cap;
  if(b.volume>cap){toast(`O ${destino} comporta ${nf(cap)} L e o lote tem ${nf(b.volume)} L.`,true);return;}
  const sd=SALDOS.find(x=>x.tanque===destino&&dispDe(x)>0);
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent=b.tanque?'Trocar de tanque':'Programar no tanque';
  M('mSub').textContent=`${b.produto} · ${nf(b.volume)} L · ${b.tanque?`${b.tanque} → ${destino}`:destino}`;
  M('mSub').hidden=false;M('modal').classList.add('wide');
  M('mB').innerHTML=`
    ${sd?`<div class="alert">O ${destino} ainda tem <b>${nf(dispDe(sd))} L</b> de
      <b>${sd.produto}</b>${sd.interrompidoEm?`, interrompido em ${sd.interrompidoEm}`:''}.
      Este lote entra como batelada seguinte.</div>`:''}
    <div class="alert blue">Isto define o tanque de <b>${b.ordens.length}</b>
      OP${b.ordens.length>1?'s':''} de envase:
      <ul style="margin:8px 0 0;padding-left:18px;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.7">
      ${b.ordens.map(o=>`<li>${nomeCurto(o.codigo)} ·
        ${o.maq} ${hhmm(o.inicio)} · ${nf(o.litros)} L</li>`).join('')}</ul></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="aC">Cancelar</button>
    <button class="btn pri" id="aK">Confirmar</button>`;
  M('aC').onclick=()=>{fecharModal();render();};
  M('aK').onclick=()=>{
    const antigo=b.tanque,apont=APONTA[b.chave];
    if(apont)delete APONTA[b.chave];
    b.ordens.forEach(o=>{o.tanque=destino;
      registrar(o,antigo?'Tanque alterado':'Tanque definido',null,
        antigo?`${antigo} → ${destino}`:`${destino} · ${b.produto}`);});
    if(apont){const nova=batDe(b.ordens[0]);if(nova)APONTA[nova.chave]=apont;}
    fecharModal();render();
    toast(antigo?`Lote movido para ${destino}.`:`${b.produto} programado no ${destino}.`);
  };
  abrirMask();
}

function gradeAdmin(){
  M('adgrid').innerHTML=`
    <div class="adabas">${ABAS_ADMIN.map(([c,r])=>
      `<button class="adaba ${c===ABA_ADMIN?'on':''}" data-aba="${c}">${r}</button>`).join('')}</div>
    <div class="adcorpo">${corpoAba(ABA_ADMIN)}</div>`;
  M('adgrid').querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{
    ABA_ADMIN=b.dataset.aba;gradeAdmin();});

  /* funções */
  if(M('fngrid'))gradeFuncoes();

  /* responsável técnico */
  if(M('rtgridx'))gradeRT();

  /* operadores */
  if(M('opgrid'))gradeOperadores();

  /* preformas */
  M('adgrid').querySelectorAll('[data-pfg]').forEach(e=>e.addEventListener('change',()=>{
    PREFORMAS[+e.dataset.pfg].gramatura=+e.value||0;gravarCad();}));
  M('adgrid').querySelectorAll('[data-pfp]').forEach(e=>e.addEventListener('change',()=>{
    PREFORMAS[+e.dataset.pfp].pescoco=e.value.trim();gravarCad();}));
  M('adgrid').querySelectorAll('[data-pfc]').forEach(e=>e.addEventListener('change',()=>{
    PREFORMAS[+e.dataset.pfc].consumo=Math.max(0,+e.value||0);gravarCad();gradeAdmin();}));
  M('adgrid').querySelectorAll('[data-pfs]').forEach(e=>e.addEventListener('change',()=>{
    PREFORMAS[+e.dataset.pfs].seg=Math.max(0,+e.value||0);gravarCad();gradeAdmin();}));

  /* integração */
  if(M('intgrid'))gradeIntegra();

  /* insumos */
  if(M('insgrid'))gradeInsumos();

  /* formulações */
  if(M('fmgrid'))gradeFormulas();

  /* máquinas: todos os grupos numa página */
  if(M('mqgrid'))gradeMaquinas();

  /* produtos e granéis: só na aba Produtos */
  if(M('pgrid'))gradeProdutos();
  if(M('ggrid'))gradeGraneis();
  if(M('pBusca'))M('pBusca').addEventListener('input',gradeProdutos);

  /* acessos: só existem quando a aba Pessoas está aberta */
  if(M('acgrid'))gradeAcessos();

  /* motivos */
  if(M('adMotNovo'))M('adMotNovo').onclick=()=>modalMotivo(null);
  M('adgrid').querySelectorAll('[data-moted]').forEach(b=>b.onclick=()=>
    modalMotivo(MOTIVOS.find(x=>String(x.id)===b.dataset.moted)));
  M('adgrid').querySelectorAll('[data-motdel]').forEach(b=>b.onclick=()=>
    excluirMotivo(b.dataset.motdel));
  if(M('adTol'))M('adTol').addEventListener('change',ev=>{
    TOLERANCIA=Math.max(0,+ev.target.value||0);agendarSalvar();
    toast(`Tolerância: ${TOLERANCIA} min.`);});

  /* apelido local: grava o cadastro. Nome próprio para não sombrear salvar() da OP. */
  const gravarCad=()=>{agendarSalvar();};
  /* cópia de segurança: os botões saíram do cabeçalho e vivem aqui */
  if(M('adBaixar'))M('adBaixar').onclick=baixarDados;
  if(M('adAbrir'))M('adAbrir').onclick=()=>M('arq').click();
  /* a senha mestra e a lista de PINs sairam na reforma: quem manda e o login */
  M('adgrid').querySelectorAll('[data-fg]').forEach(e=>e.onchange=()=>{
    FRASCOS[+e.dataset.fg].gramatura=+e.value||0;gravarCad();render();});
  M('adgrid').querySelectorAll('[data-fp]').forEach(e=>e.onchange=()=>{
    FRASCOS[+e.dataset.fp].pescoco=e.value.trim();gravarCad();render();});
  M('adgrid').querySelectorAll('[data-fc]').forEach(e=>e.addEventListener('change',()=>{
    FRASCOS[+e.dataset.fc].consumo=Math.max(0,+e.value||0);gravarCad();gradeAdmin();}));
  M('adgrid').querySelectorAll('[data-fs]').forEach(e=>e.addEventListener('change',()=>{
    FRASCOS[+e.dataset.fs].seg=Math.max(0,+e.value||0);gravarCad();gradeAdmin();}));
  M('adgrid').querySelectorAll('[data-sn]').forEach(e=>e.onchange=()=>{
    SOPRADORAS[+e.dataset.sn].nome=e.value.trim();gravarCad();render();});
  M('adgrid').querySelectorAll('[data-sc]').forEach(e=>e.onchange=()=>{
    SOPRADORAS[+e.dataset.sc].cad=+e.value||1;gravarCad();render();});
  M('adgrid').querySelectorAll('[data-tc]').forEach(e=>e.onchange=()=>{
    TANQUES[+e.dataset.tc].cap=+e.value||0;gravarCad();render();});
  M('adgrid').querySelectorAll('[data-te]').forEach(e=>e.addEventListener('change',()=>{
    TANQUES[+e.dataset.te].ench=Math.max(0,+e.value||0);gravarCad();recomporTudo();render();
  }));
  M('adgrid').querySelectorAll('[data-ji]').forEach(e=>e.onchange=()=>{
    JORNADA[e.dataset.ji][0]=e.value;gravarCad();render();});
  M('adgrid').querySelectorAll('[data-jf]').forEach(e=>e.onchange=()=>{
    JORNADA[e.dataset.jf][1]=e.value;gravarCad();render();});
  M('adgrid').querySelectorAll('[data-pf]').forEach(e=>e.onchange=()=>{
    FRASCO_PROD[e.dataset.pf]=e.value;gravarCad();toast('Frasco atualizado.');});
}

function gradeProdutos(){

  const q=(M('pBusca')&&M('pBusca').value||'').trim().toLowerCase();
  const l=PRODUTOS.filter(p=>!q||p.descricao.toLowerCase().includes(q)||String(p.codigo).includes(q));
  el.innerHTML=`
    <table class="tb"><thead><tr>
      <th>SKU</th><th>Produto</th><th class="n">L/cx</th><th>Lote no tanque</th>
      ${MAQUINAS.map(m=>`<th class="n">${m}</th>`).join('')}
      <th class="n">Lote padrão</th><th class="n">Limpeza</th><th class="n">Fabric.</th><th class="n">Descanso</th><th></th>
    </tr></thead><tbody>
    ${l.map(p=>{
      const x=TEMPOS[String(p.codigo)]||{t:{}};
      return `<tr class="${ativoProd(p)?'':'inat'}">
        <td class="mono">${p.codigo}</td>
        <td>${p.descricao}${ativoProd(p)?'':' <span class="k">inativo</span>'}</td>
        <td class="n mono">${p.un_cx}×${fmtLit(p.litragem)}</td>

          return `<td class="n mono ${v?'':'k'}">${v?hmin(v):'—'}</td>`;}).join('')}
        <td class="n mono">${x.lote?nf(x.lote)+' L':'—'}</td>
        <td class="n mono">${tempoG(p.tanque).limpeza||0} min</td>
        <td class="n mono">${tempoG(p.tanque).fabricacao||0} min</td>
        <td class="n mono">${tempoG(p.tanque).descanso||0} min</td>
        <td class="n"><button class="ordb" data-ped="${p.codigo}" title="Editar">&#9998;</button></td>
      </tr>`;}).join('')}

  el.querySelectorAll('[data-ped]').forEach(b=>b.onclick=()=>

const hmin=m=>m>=60?`${Math.floor(m/60)}:${p2(m%60)}`:`${m}min`;

    alvo.descricao=desc;alvo.tanque=gran;
    alvo.litragem=+M('pLit').value||1;alvo.un_cx=+M('pUn').value||6;
    alvo.ativo=M('pAtivo').value==='1';

      if(v)PREF_PROD[cod]=v; else delete PREF_PROD[cod];}
    const t={};
    MAQUINAS.forEach(m=>{const v=+M('pT'+m.replace(/\D/g,'')).value;if(v>0)t[m]=v;});
    TEMPOS[cod]={lote:+M('pLote').value||3800,t:t};
    TEMPO_GRANEL[gran]={...(TEMPO_GRANEL[gran]||{}),
      limpeza:Math.max(0,+M('pLimp').value||0),
      fabricacao:Math.max(0,+M('pFab').value||0),
      descanso:Math.max(0,+M('pDesc').value||0)};
    if(M('pVal'))VALIDADE[gran]={n:Math.max(1,+M('pVal').value||12),un:M('pValU').value||'meses'};
    /* especificação de análise do granel */
    const esp={...(ESPEC[gran]||{})};
    M('pEsp').querySelectorAll('[data-esp]').forEach(i=>{
      const v=i.value.trim();
      if(v)esp[i.dataset.esp]=v; else delete esp[i.dataset.esp];});
    ENSAIOS.filter(([k])=>!QUALI.includes(k)).forEach(([k])=>{
      const a=M('pEsp').querySelector(`[data-espmin="${k}"]`);
      const b=M('pEsp').querySelector(`[data-espmax="${k}"]`);
      const mn=a&&a.value!==''?+a.value:null, mx=b&&b.value!==''?+b.value:null;
      if(mn==null&&mx==null){delete esp[k];return;}
      esp[k]={min:mn,max:mx,
        txt:mn!=null&&mx!=null?`Entre ${mn} e ${mx}`:(mn!=null?`Acima de ${mn}`:`Até ${mx}`)};
    });
    if(Object.keys(esp).length)ESPEC[gran]=esp; else delete ESPEC[gran];
    if(!PROD_TANQUE.includes(gran))PROD_TANQUE.push(gran);
    agendarSalvar();fecharModal();gradeAdmin();
    toast(novo?'Produto cadastrado.':'Produto atualizado.');
  };
  abrirMask();
}

/* =====================================================================
   RECURSOS — todas as máquinas num lugar só
   Envasadoras, sopradoras, rotuladoras, túneis e tanques compartilham
   o mesmo cadastro. O grupo diz quais campos aquela máquina tem.
   As listas antigas (MAQUINAS, JORNADA, TANQUES, SOPRADORAS) continuam
   existindo e são refeitas a partir daqui, para nada mais precisar mudar.
   ===================================================================== */
/* cadencia = mede produtividade; un = em que unidade ela é contada */
const GRUPOS_MAQ=[
  {id:'envase', nome:'Envasadoras',jornada:true, cadencia:false,capacidade:false,fixo:true},
  {id:'sopro',  nome:'Sopradoras', jornada:true, cadencia:true, un:'un/h', capacidade:false,fixo:true},
  {id:'rotulo', nome:'Rotuladoras',jornada:true, cadencia:true, un:'un/h', capacidade:false},
  {id:'tunel',  nome:'Túneis',     jornada:true, cadencia:true, un:'fd/h', capacidade:false},
  {id:'tanque', nome:'Tanques',    jornada:true, cadencia:false,capacidade:true, fixo:true},
];
const unDoGrupo=g=>(g&&g.un)||'un/h';
const grupoDe=id=>GRUPOS_MAQ.find(g=>g.id===id)||GRUPOS_MAQ[0];
const RECURSOS=[];
const PAUSAS={};                          /* máquina -> intervalos do turno */
const pausaMin=m=>(PAUSAS[m]||[]).reduce((s,p)=>s+Math.max(0,hm(p.ate)-hm(p.de)),0);

function semearRecursos(){
  if(RECURSOS.length)return;
  MAQUINAS.forEach(m=>RECURSOS.push({id:m,nome:'',grupo:'envase',
    ini:(JORNADA[m]||['05:00'])[0],fim:(JORNADA[m]||[,'20:00'])[1],pausas:[],ativo:true}));
  SOPRADORAS.forEach(s=>RECURSOS.push({id:s.id,nome:s.nome,grupo:'sopro',
    ini:'05:00',fim:'20:00',cad:s.cad,ativo:true}));
  TANQUES.forEach(t=>RECURSOS.push({id:t.id,nome:'',grupo:'tanque',
    ini:'05:00',fim:'20:00',pausas:[],cap:t.cap,ench:t.ench,ativo:true}));
  RECURSOS.push({id:'ROT BOPP',   nome:'Rotuladora BOPP',   grupo:'rotulo',ini:'05:00',fim:'20:00',cad:1200,ativo:true});
  RECURSOS.push({id:'ROT ADESIVA',nome:'Rotuladora Adesiva',grupo:'rotulo',ini:'05:00',fim:'20:00',cad:900, ativo:true});
  RECURSOS.push({id:'TUN 1',nome:'Túnel de encolhimento',grupo:'tunel',ini:'05:00',fim:'20:00',cad:900,ativo:true});
}
const recursosDe=g=>RECURSOS.filter(r=>r.grupo===g);

/* refaz as listas antigas a partir do cadastro, sem trocar as referências */
function sincronizarRecursos(){
  const env=recursosDe('envase').filter(r=>r.ativo!==false);
  MAQUINAS.length=0;env.forEach(r=>MAQUINAS.push(r.id));
  Object.keys(JORNADA).forEach(k=>delete JORNADA[k]);
  env.forEach(r=>{JORNADA[r.id]=[r.ini||'05:00',r.fim||'20:00'];
    PAUSAS[r.id]=(r.pausas||[]).filter(p=>p.de&&p.ate);});
  SOPRADORAS.length=0;
  recursosDe('sopro').filter(r=>r.ativo!==false)
    .forEach(r=>SOPRADORAS.push({id:r.id,nome:r.nome,cad:+r.cad||900}));
  TANQUES.length=0;
  recursosDe('tanque').filter(r=>r.ativo!==false)
    .forEach(r=>TANQUES.push({id:r.id,cap:+r.cap||3800,ench:+r.ench||0,limp:+r.limp||0}));
}

        ${g.fixo?'<span class="grpf" title="Grupo usado pela programação">fixo</span>'
          :`<button class="ordb del" data-grpdel="${g.id}" title="Excluir grupo">&#10005;</button>`}
      </div>
      ${l.length?`<table class="tb"><thead><tr>
        <th>Código</th><th>Nome</th>
        ${g.jornada?'<th>Turno</th><th>Intervalos</th><th class="n">Jornada útil</th>':''}
        ${g.cadencia?`<th class="n">Produtividade (${unDoGrupo(g)})</th>`:''}
        ${g.capacidade?'<th class="n">Capacidade (L)</th><th class="n">Enchimento (min)</th>':''}
        <th>Situação</th><th></th></tr></thead><tbody>
        ${l.map(r=>{
          const jn=g.jornada&&r.ini&&r.fim?Math.max(0,hm(r.fim)-hm(r.ini)):null;
          return `<tr class="${r.ativo===false?'inat':''}">
            <td><b>${r.id}</b></td>
            <td>${r.nome||'<span class="k">—</span>'}</td>
            ${g.jornada?(()=>{
              const ps=(r.pausas||[]).filter(x=>x.de&&x.ate).sort((a,b)=>hm(a.de)-hm(b.de));
              const pp=ps.reduce((s,x)=>s+Math.max(0,hm(x.ate)-hm(x.de)),0);
              const liq=Math.max(0,(jn||0)-pp);
              const i0=r.ini?hm(r.ini):0, tot=Math.max(1,jn||1);
              return `
              <td class="mono">${r.ini||'—'} – ${r.fim||'—'}
                <div class="turnob">${ps.map(x=>`<i style="left:${(hm(x.de)-i0)/tot*100}%;
                  width:${Math.max(1,(hm(x.ate)-hm(x.de))/tot*100)}%"></i>`).join('')}</div></td>
              <td>${ps.length?ps.map(x=>`<span class="ivl">${x.de}–${x.ate}</span>`).join(' ')
                :'<span class="k">sem intervalo</span>'}</td>
              <td class="n mono"><b>${Math.floor(liq/60)}h${p2(liq%60)}</b>
                ${pp?`<div class="sub2">${Math.floor(jn/60)}h${p2(jn%60)} − ${
                  pp>=60?`${Math.floor(pp/60)}h${p2(pp%60)}`:`${pp}min`}</div>`:''}</td>`;})():''}
            ${g.cadencia?`<td class="n mono">${r.cad?nf(r.cad):'—'}</td>`:''}
            ${g.capacidade?`<td class="n mono">${r.cap?nf(r.cap):'—'}</td>
              <td class="n mono">${r.ench!=null?r.ench:'—'}</td>`:''}
            <td>${r.ativo===false?'<span class="k">inativa</span>':'ativa'}</td>
            <td class="n" style="white-space:nowrap">
              <button class="ordb" data-mqed="${r.id}" title="Editar">&#9998;</button>
              <button class="ordb del" data-mqdel="${r.id}" title="Excluir">&#10005;</button>
            </td></tr>`;}).join('')}
        </tbody></table>`
        :'<div class="vazioc">Nenhuma máquina neste grupo.</div>'}
    </div>`;}).join('')
    +`<button class="btn sm" id="mqNovoGrupo" style="margin-top:8px">+ Novo grupo de máquinas</button>`;

  el.querySelectorAll('[data-mqnovo]').forEach(b=>b.onclick=()=>modalMaquina(null,b.dataset.mqnovo));
  el.querySelectorAll('[data-mqed]').forEach(b=>b.onclick=()=>
    modalMaquina(RECURSOS.find(r=>r.id===b.dataset.mqed)));
  el.querySelectorAll('[data-mqdel]').forEach(b=>b.onclick=()=>excluirMaquina(b.dataset.mqdel));
  el.querySelectorAll('[data-grpdel]').forEach(b=>b.onclick=()=>excluirGrupo(b.dataset.grpdel));
  if(M('mqNovoGrupo'))M('mqNovoGrupo').onclick=modalGrupo;
}

  M('mB').innerHTML=`
    <div class="g2">
      <div class="fld"><label>Código <b>*</b></label>
        <input id="mqId" value="${novo?'':r.id}" ${novo?'':'disabled'} placeholder="${
          {envase:'MAQ 4',sopro:'SOP 3',rotulo:'ROT 2',tunel:'TUN 2',tanque:'TQ 9'}[g.id]||'MAQ 4'}"></div>
      <div class="fld"><label>Situação</label>
        <select id="mqAtivo"><option value="1" ${novo||r.ativo!==false?'selected':''}>Ativa</option>

    </div>

    ${g.jornada?`<div class="g2">
      <div class="fld"><label>Início do turno</label>
        <input type="time" id="mqIni" step="300" value="${novo?'05:00':(r.ini||'05:00')}"></div>
      <div class="fld"><label>Fim do turno</label>
        <input type="time" id="mqFim" step="300" value="${novo?'20:00':(r.fim||'20:00')}"></div>
    </div>

      <div class="hint" id="mqJorn" style="font-size:12px;color:var(--ink3);margin-top:8px"></div>
    </div>`:''}
    ${g.cadencia?`<div class="fld"><label>Produtividade (${unDoGrupo(g)})</label>
      <input type="number" id="mqCad" min="0" step="50" value="${novo?900:(r.cad||0)}">
      <div class="hint" style="font-size:11.5px;color:var(--ink3);margin-top:4px">
        Quanto a máquina entrega por hora rodando.</div></div>`:''}
    ${g.capacidade?`<div class="g2">
      <div class="fld"><label>Capacidade (L)</label>
        <input type="number" id="mqCap" min="0" step="100" value="${novo?3800:(r.cap||0)}"></div>
      <div class="fld"><label>Enchimento (min)</label>
        <input type="number" id="mqEnch" min="0" step="5" value="${novo?50:(r.ench||0)}"></div>
    </div>
    <div class="hint" style="font-size:11.5px;color:var(--ink3);margin:-6px 0 12px">
      A limpeza é do produto, não do tanque — está no cadastro do item.</div>`:''}`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="mqC">Fechar</button>
    <button class="btn pri" id="mqK">${novo?'Cadastrar':'Salvar'}</button></div>`;
  /* intervalos: cada linha é um par início/fim que sai da jornada */
  let pausas=(novo?[]:(r.pausas||[])).map(p=>({de:p.de,ate:p.ate}));
  const contaJornada=()=>{
    const el=M('mqJorn');if(!el||!M('mqIni'))return;
    const j=Math.max(0,hm(M('mqFim').value||'20:00')-hm(M('mqIni').value||'05:00'));
    const p=pausas.reduce((s,x)=>s+(x.de&&x.ate?Math.max(0,hm(x.ate)-hm(x.de)):0),0);
    const liq=Math.max(0,j-p);
    el.innerHTML=p
      ? `Turno de <b>${Math.floor(j/60)}h${p2(j%60)}</b> menos <b>${p} min</b> de intervalo =
         <b>${Math.floor(liq/60)}h${p2(liq%60)}</b> de jornada útil.`
      : `Jornada de <b>${Math.floor(j/60)}h${p2(j%60)}</b>, sem intervalo.`;

  const pintarPausas=()=>{
    const el=M('mqPausas');if(!el)return;

    el.querySelectorAll('[data-pate]').forEach(i=>i.addEventListener('change',()=>{
      pausas[+i.dataset.pate].ate=i.value;contaJornada();}));
    el.querySelectorAll('[data-prem]').forEach(b=>b.onclick=()=>{
      pausas.splice(+b.dataset.prem,1);pintarPausas();contaJornada();});

    M('mqAddP').onclick=()=>{pausas.push({de:'12:00',ate:'13:00'});pintarPausas();};

  M('mqK').onclick=()=>{
    const id=(novo?M('mqId').value:r.id).trim().toUpperCase();
    if(!id){toast('Informe o código.',true);return;}
    if(novo&&RECURSOS.some(x=>x.id===id)){toast('Já existe uma máquina com esse código.',true);return;}
