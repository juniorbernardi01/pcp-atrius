   ===================================================================== */
const fabFimDe=b=>((APONTA[b.chave]||{}).fabFim)||null;
/* lote de cada insumo consumido — é o que fecha a rastreabilidade */
const lotesMP=b=>((APONTA[b.chave]||{}).lotesMP)||{};
const loteMP=(b,nome)=>lotesMP(b)[nome]||'';
const escAttr=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/[<>&]/g,
  c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function etapasHTML(b){
  const e=b.etapas;
  if(!e||!e.passos.length)return '';
  const ff=fabFimDe(b);
  const env=b.ordens.length?Math.min(...b.ordens.map(o=>o.inicio==null?1e9:o.inicio)):null;
  /* o preparo pode ter sido no dia anterior: o que importa é estar pronto antes do envase */
  const atrasado=ff&&ff.data===b.data&&env!=null&&env<1e9&&hm(ff.hora)>env;
  return `<div class="lin">
    <div class="linh">Preparo do lote · ${e.total} min no total</div>
    ${e.passos.map(p=>`<div class="linp">
      <span class="r">${p.rot}${p.nota?` <i>${p.nota}</i>`:''}</span>
      <span class="m">${p.min} min</span></div>`).join('')}
    <div class="linf">${env!=null&&env<1e9
      ? `O produto precisa estar liberado antes do envase, às <b>${hhmm(env)}</b>.`
      : 'Envase ainda sem horário.'}</div>
  </div>
  <div class="fabx">
    <div class="fld"><label>Fabricação concluída em</label>
      <div class="g2">
        <input type="date" id="fabD" value="${ff?ff.data:b.data}">
        <input type="time" id="fabH" step="300" value="${ff?ff.hora:''}">
      </div>
      <div class="hint" style="font-size:11.5px;margin-top:5px;color:${atrasado?'var(--danger)':'var(--ink3)'}">
        ${ff
          ? (atrasado
              ? `Concluído depois do início do envase — o envase ficou esperando.`
              : `Pronto${ff.data!==b.data?' no dia anterior':''}, às ${ff.hora}.`)
          : 'Informe quando o lote ficou pronto. É essa hora que libera o envase.'}</div>
    </div>
  </div>`;
}

function certificadoHTML(b){
  const ens=ensaiosDe(b.produto);
  if(!ens.length)return `<div class="alert">Sem especificação de análise cadastrada para
    <b>${b.produto}</b>.</div>`;
  const esp=especDe(b.produto);
  const r=(b.analise&&b.analise.resultados)||{};
  const a=analiseOk(b);
  const trava=b.status==='concluido'?'disabled':'';
  return `<div class="cert">
    <div class="certh">Certificado de análise
      <span>${b.produto} · ${b.tanque||'sem tanque'}${b.lote?` · lote ${b.lote}`:''}</span></div>
    <table class="certt"><thead><tr>
      <th>Análise</th><th>Especificação</th><th>Resultado</th><th class="n">Situação</th>
    </tr></thead><tbody>
    ${ens.map(([k,rot])=>{
      const s=confereEnsaio(b.produto,k,r[k]);
      const espTxt=QUALI.includes(k)?esp[k]:esp[k].txt;
      return `<tr class="${s==='fora'?'fora':''}">
        <td>${rot}</td>
        <td class="k">${espTxt}</td>
        <td>${QUALI.includes(k)
          ? `<select data-ens="${k}" ${trava}>
              <option value="">—</option>
              <option value="ok" ${r[k]==='ok'?'selected':''}>Conforme</option>
              <option value="fora" ${r[k]==='fora'?'selected':''}>Não conforme</option></select>`
          : `<input type="text" inputmode="decimal" data-ens="${k}" ${trava}
              value="${r[k]!=null?r[k]:''}" placeholder="—">`}</td>
        <td class="n">${s==='ok'?'<span class="pill ok">conforme</span>'
          :s==='fora'?'<span class="pill mau">fora</span>'
          :'<span class="k">a medir</span>'}</td></tr>`;}).join('')}
    </tbody></table>
    ${a.ok?`<div class="certok">Todos os ensaios dentro da especificação.</div>`
      :a.fora.length
      ?`<div class="certno"><b>Lote não pode ser liberado</b><br>
         Fora da especificação: ${a.fora.join(', ')}. Corrija o lote e refaça a análise,
         ou registre um desvio.</div>`
      :`<div class="certpe">Falta medir: ${a.pend.join(', ')}.</div>`}
    ${a.desvio?`<div class="certdv">Desvio registrado por <b>${b.analise.desvioPor||'—'}</b>:
      ${b.analise.desvioObs||''}</div>`:''}
    ${(a.fora.length&&!a.desvio&&b.status==='aguardando')
      ?`<button class="btn warn sm" id="certDv" style="margin-top:10px">Registrar desvio</button>`:''}
  </div>`;
}

function ligarCertificado(b){
  const grava=()=>{
    const at=APONTA[b.chave]||{};
    const res={};
    M('mB').querySelectorAll('[data-ens]').forEach(e=>{
      if(e.value!=='')res[e.dataset.ens]=e.value;
    });
    /* quem mediu fica registrado: o certificado é documento, não rascunho */
    const antes=(at.analise&&at.analise.resultados)||{};
    const mudou=ENSAIOS.filter(([k])=>String(antes[k]??'')!==String(res[k]??''))
      .map(([k,r])=>`${r}: ${antes[k]??'—'} → ${res[k]??'—'}`);
    const an={...(at.analise||{}),resultados:res,em:relogio(),por:quemAssina()};
    APONTA[b.chave]={...at,analise:an,
      log:[...(at.log||[]),...(mudou.length?[{t:relogio(),d:ymd(new Date()),
        e:'Análise lançada',op:quemAssina(),m:mudou.join(' · ')}]:[])]};
    agendarSalvar();
    /* redesenha o modal para a situação de cada ensaio acompanhar */
    const nova=bateladas(b.data).find(x=>x.chave===b.chave);
    if(nova)abrirLote(nova);
  };
  M('mB').querySelectorAll('[data-ens]').forEach(e=>e.addEventListener('change',grava));
  if(M('certDv'))M('certDv').onclick=()=>modalDesvio(b);
}

function modalDesvio(b){
  const a=analiseOk(b);
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('mTit').textContent='Registrar desvio';
  M('mSub').textContent=`${b.produto} · ${b.tanque||''}${b.lote?` · lote ${b.lote}`:''}`;
  M('mSub').hidden=false;
  M('mB').innerHTML=`
    <div class="alert">Fora da especificação: <b>${a.fora.join(', ')}</b>.<br>
      O desvio libera este lote e fica registrado no histórico e no relatório.
      Só o responsável técnico deve fazer isto.</div>
    <div class="fld"><label>Responsável técnico <b>*</b></label>
      <select id="dvQuem"><option value="">Selecione…</option>
      ${USUARIOS.map(u=>`<option>${u.nome}</option>`).join('')}</select></div>
    <div class="fld"><label>Justificativa <b>*</b></label>
      <textarea id="dvObs" placeholder="Por que este lote pode seguir mesmo assim"></textarea></div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="dvC">Voltar</button>
    <button class="btn warn" id="dvK">Registrar desvio</button></div>`;
  M('dvC').onclick=()=>abrirLote(bateladas(b.data).find(x=>x.chave===b.chave));
  M('dvK').onclick=()=>{
    const quem=M('dvQuem').value,obs=M('dvObs').value.trim();
    if(!quem){toast('Informe o responsável técnico.',true);return;}
    if(!obs){toast('Justifique o desvio.',true);return;}
    const at=APONTA[b.chave]||{};
    APONTA[b.chave]={...at,
      analise:{...(at.analise||{}),desvio:true,desvioPor:quem,desvioObs:obs,desvioEm:relogio()},
      log:[...(at.log||[]),{t:relogio(),e:'Desvio de análise registrado',op:quem,
        m:`${a.fora.join(', ')} — ${obs}`}]};
    agendarSalvar();
    abrirLote(bateladas(b.data).find(x=>x.chave===b.chave));
    toast('Desvio registrado. O lote pode ser liberado.');
  };
  abrirMask();
}

function modalAjuste(b){

  M('mB').innerHTML=`
    <div class="alert blue">Use quando o lote precisou de mais insumo para acertar
      pH, viscosidade ou cor. Entra no consumo do lote e fica no histórico.</div>
    <div class="fld"><label>Insumo <b>*</b></label>
      <input id="ajNome" list="lstAj" placeholder="Ácido cítrico, soda…">

let ABA_LOTE='preparo';

    PROX_LOTE[b.produto]=n+1;

          ${mp.map(x=>`<tr><td>${x.nome}</td><td class="n mono">${nf1(x.pct)}%</td>

      ${ajustesHTML(b,trava)}`:''}
    ${ABA_LOTE==='cert'?`    ${certificadoHTML(b)}

/* =====================================================================
   PERDAS POR MOTIVO
   Litro e minuto não se somam num percentual só, então são duas contas.
   O peso vai para o motivo PRINCIPAL; os demais ficam registrados.
   ===================================================================== */
function perdasPorMotivo(l){
  const vazio=()=>({total:0,porMaq:{}});
  const litros=vazio(),minutos=vazio();
  const soma=(acc,maq,id,qt)=>{
    acc.total+=qt;
    const m=acc.porMaq[maq]||(acc.porMaq[maq]={total:0,motivos:{}});
    m.total+=qt; m.motivos[id]=(m.motivos[id]||0)+qt;
  };
  l.forEach(o=>{
    const mt=motivosOP(o);
    if(mt.quebra&&mt.quebra.principal){
      const q=quebraL(o);
      if(q&&q>0)soma(litros,o.maq,mt.quebra.principal,q);
    }
    ['setup','envase'].forEach(et=>{
      if(!mt[et]||!mt[et].principal)return;
      const d=et==='setup'?dvSetup(o):dvEnvase(o);
      if(d!=null&&d>0)soma(minutos,o.maq,mt[et].principal,d);
    });
  });
  return {litros,minutos};
}
function blocoPerdas(acc,titulo,unidade,cor){
  if(!acc.total)return `<div class="perdz">Nenhum motivo registrado no período para ${titulo.toLowerCase()}.</div>`;
  const un=v=>unidade==='L'?nf(v)+' L':(v>=60?`${Math.floor(v/60)}h${p2(Math.round(v%60))}`:Math.round(v)+' min');
  const maqs=Object.entries(acc.porMaq).sort((a,b)=>b[1].total-a[1].total);
  return `<div class="perdb ${cor}">
    <div class="perdh"><span>${titulo}</span><b>${un(acc.total)}</b></div>
    <div class="perdc">${maqs.map(([maq,d])=>`
      <div class="perdm">
        <div class="perdmh"><span>${maq}</span><b>${un(d.total)}</b>
          <i>${nf1(d.total/acc.total*100)}% do total</i></div>
        ${Object.entries(d.motivos).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`
          <div class="perdl"><span>${motivoNome(id)}</span>
            <div class="perdbar"><i style="width:${v/d.total*100}%"></i></div>
            <b>${nf1(v/d.total*100)}% · ${un(v)}</b></div>`).join('')}
      </div>`).join('')}</div></div>`;
}

function relSopro(etapa){
  const p=diasDoPeriodo(),f=FILTRO_REP,rot=etapa==='rotulagem';
  const dias=[];
  for(let d=new Date(p.de+'T00:00:00');ymd(d)<=p.ate;d.setDate(d.getDate()+1))dias.push(ymd(d));
  const l=dias.flatMap(d=>sopros(d)).filter(x=>{
    if(rot&&x.status!=='pronto')return false;
    const pr=prodOf(x.codigo);
    if(f.prod&&(!pr||pr.tanque!==f.prod))return false;
    return casaBusca(`${x.frasco} ${pr?pr.descricao:''} ${x.sopradora||''}`);
  });
  const prev=l.reduce((s,x)=>s+x.un,0);
  const feito=l.reduce((s,x)=>s+(rot?(x.rotUn??0):Math.max(0,x.boas)),0);
  const quebras=l.reduce((s,x)=>s+(x.quebras??0),0);
  const prontos=l.filter(x=>rot?x.rot==='pronto':x.status==='pronto').length;
  const min=x=>{const a=rot?x.rotIni:x.iniReal,b=rot?x.rotFim:x.fimReal;
    return a&&b?Math.max(0,hm(b)-hm(a)):null;};
  const tot=l.reduce((s,x)=>s+(min(x)||0),0);
  const unBoas=l.reduce((s,x)=>s+(min(x)?(rot?(x.rotUn??0):Math.max(0,x.boas)):0),0);
  const porHora=tot?Math.round(unBoas/(tot/60)):null;
  M('repgrid').innerHTML=`
    ${barraFiltro(['maq','prod'])}
    <div class="repd">${tituloPeriodo()}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Ordens</div><div class="v">${l.length}</div>
        <div class="s">${prontos} concluída${prontos===1?'':'s'}</div></div>
      <div class="kpi"><div class="k">Previsto</div><div class="v">${nf(prev)} un</div>
        <div class="s">necessidade do envase</div></div>
      <div class="kpi"><div class="k">${rot?'Rotulado':'Soprado'}</div>
        <div class="v ok">${nf(feito)} un</div>
        <div class="s">${prev?nf1(feito/prev*100):0}% do previsto</div></div>
      ${rot?'':`<div class="kpi"><div class="k">Quebras</div>
        <div class="v ${quebras?'ruim':''}">${nf(quebras)} un</div>
        <div class="s">${feito+quebras?nf1(quebras/(feito+quebras)*100):0}% do produzido</div></div>`}
      <div class="kpi"><div class="k">Por hora</div>
        <div class="v">${porHora!=null?nf(porHora):'—'}</div>
        <div class="s">${tot?`em ${Math.floor(tot/60)}h${p2(tot%60)} apontados`:'sem tempo apontado'}</div></div>
    </div>
    ${l.length?`<div class="st">Ordens de ${rot?'rotulagem':'sopro'}</div>
    <table><thead><tr><th>Frasco</th><th>Produto</th>
      ${rot?'':'<th>Sopradora</th>'}<th class="n">Previsto</th>
      <th class="n">${rot?'Rotulado':'Boas'}</th>${rot?'':'<th class="n">Quebras</th>'}
      <th>Realizado</th><th class="n">Tempo</th><th class="n">Un/h</th><th>Situação</th>
    </tr></thead><tbody>
      ${l.map(x=>{const m=min(x);
        const q=rot?(x.rotUn??0):Math.max(0,x.boas);
        const st=rot?x.rot:x.status;
        return `<tr>
        <td><b>${x.frasco}</b></td><td>${nomeCurto(x.codigo)}</td>
        ${rot?'':`<td>${x.sopradora||'—'}</td>`}
        <td class="n mono">${nf(x.un)}</td>
        <td class="n mono">${q?nf(q):'—'}</td>
        ${rot?'':`<td class="n mono">${x.quebras?`<span class="pill mau">${nf(x.quebras)}</span>`:'—'}</td>`}
        <td class="mono">${(rot?x.rotIni:x.iniReal)||'--:--'} – ${(rot?x.rotFim:x.fimReal)||'--:--'}</td>
        <td class="n mono">${m!=null?m+' min':'—'}</td>
        <td class="n mono">${m?nf(Math.round(q/(m/60))):'—'}</td>
        <td><span class="stq ${st==='pronto'?'liberado':st==='soprando'||st==='rotulando'?'preparando':'aguardando'}">${
          rot?LBL_ROT[st]:LBL_SOP[st]}</span></td></tr>`;}).join('')}
    </tbody></table>`
    :`<div class="vazioc">${rot?'Nenhum frasco soprado neste dia.':'Nenhuma ordem de sopro neste dia.'}</div>`}`;
  ligarFiltro();
}


/* =====================================================================
   INÍCIO — saúde da operação num relance
   Só números que o sistema já tem. Nada estimado.
   ===================================================================== */
function saudeHoje(){
  const hoje=ymd(new Date()),agora=agoraMin();
  const l=ORDENS.filter(o=>o.data===hoje&&naGrade(o));
  const feitas=l.filter(o=>sit(o)==='concluida');
  const volPrev=l.reduce((s,o)=>s+o.litros,0);
  const volFeito=feitas.reduce((s,o)=>s+(litrosFeitos(o)||0),0);
  const atrasadas=l.filter(o=>sit(o)!=='concluida'&&sit(o)!=='finalizado'&&fimPrev(o)<agora).length;
  const maqs=MAQUINAS.map(m=>{
    const dl=l.filter(o=>o.maq===m);
    const [j0,j1]=jorn(m);
    const ocupado=dl.reduce((s,o)=>s+total(o),0);
    const jornada=Math.max(1,j1-j0);
    const rodando=dl.find(o=>sit(o)==='producao');
    return {maq:m,ocs:dl.length,ocupado,jornada,pc:Math.min(100,ocupado/jornada*100),
      rodando:rodando?nomeCurto(rodando.codigo):null,
      atrasada:rodando?fimPrev(rodando)<agora:false};
  });
  return {hoje,l,feitas,volPrev,volFeito,atrasadas,maqs,
    lotes:aguardandoLiberacao().length,
    frascos:sopros(hoje).filter(x=>!x.liberado).length};
}

}
function ligarFiltro(){
  const set=(id,k,ev)=>{const e=M(id);if(!e)return;
    e.addEventListener(ev||'change',()=>{FILTRO_REP[k]=e.value;gradeRelatorio();});};
  set('fbDe','de');set('fbAte','ate');set('fbMaq','maq');set('fbProd','prod');
  const b=M('fbBusca');
  if(b)b.addEventListener('input',()=>{FILTRO_REP.busca=b.value;
    clearTimeout(ligarFiltro.t);ligarFiltro.t=setTimeout(gradeRelatorio,250);});
  if(M('fbLimpa'))M('fbLimpa').onclick=()=>{
    FILTRO_REP={busca:'',maq:'',prod:'',de:'',ate:''};gradeRelatorio();};
}
const casaBusca=(txt)=>{
  const q=FILTRO_REP.busca.trim().toLowerCase();
  return !q||String(txt).toLowerCase().includes(q);
};

/* lotes do período, já filtrados */
function lotesFiltrados(){
  const p=diasDoPeriodo(),f=FILTRO_REP;
  const dias=[];
  for(let d=new Date(p.de+'T00:00:00');ymd(d)<=p.ate;d.setDate(d.getDate()+1))dias.push(ymd(d));
  const out=[];
  dias.forEach(d=>bateladas(d).forEach(b=>{
    if(f.prod&&b.produto!==f.prod)return;
    if(f.maq&&!b.ordens.some(o=>o.maq===f.maq))return;
    if(!casaBusca(`${b.lote||''} ${b.produto} ${b.tanque||''} ${b.ordens.map(o=>o.maq).join(' ')}`))return;
    out.push(b);
  }));
  return out;
}

const ABAS_REP=[['envase','Envase'],['tanques','Tanques'],['sopro','Sopro'],['rotulagem','Rotulagem'],['cert','Certificados']];
let ABA_REP='envase';

function gradeRelatorio(){
  const ab=M('repabas');
  if(ab){
    ab.innerHTML=ABAS_REP.map(([c,r])=>
      `<button class="adaba ${c===ABA_REP?'on':''}" data-rab="${c}">${r}</button>`).join('');
    ab.querySelectorAll('[data-rab]').forEach(b=>b.onclick=()=>{ABA_REP=b.dataset.rab;gradeRelatorio();});
  }
  if(ABA_REP==='cert')    return relCertificados();
  if(ABA_REP==='tanques') return relTanques();
  if(ABA_REP==='sopro')   return relSopro('sopro');
  if(ABA_REP==='rotulagem')return relSopro('rotulagem');
  return relEnvase();
}
function ordensFiltradas(){
  const p=diasDoPeriodo(),f=FILTRO_REP;
  return ORDENS.filter(o=>{
    if(!ativa(o))return false;
    if(o.data<p.de||o.data>p.ate)return false;
    if(f.maq&&o.maq!==f.maq)return false;
    const pr=prodOf(o.codigo);
    if(f.prod&&(!pr||pr.tanque!==f.prod))return false;
    return casaBusca(`${o.lote||''} ${pr?pr.descricao:''} ${o.maq} ${o.tanque||''}`);
  });
}

}

/* =====================================================================
   PERSISTÊNCIA — guarda o que foi lançado e sobrevive a troca de versão
   ===================================================================== */
const CHAVE='pcp-atrius-v6';
/* espelhamento entre abas: a TV recebe o que a aba de edição grava */
let CANAL=null,RECEBENDO=false;
try{if(typeof BroadcastChannel!=='undefined')CANAL=new BroadcastChannel('pcp-atrius');}catch(e){}
function aplicarRemoto(dados){
  if(!dados)return;
  try{
    RECEBENDO=true;aplicarEstado(dados);ULTIMO=corpoDados();
    if(MODO_TV){S.ref=new Date();S.refTq=new Date();try{renderTV();}catch(e){}}
    render();
    const el=M('salvo');if(el)el.textContent=`atualizado ${relogio()}`;
  }catch(e){console.warn('estado remoto ilegível',e);}
  finally{RECEBENDO=false;}
}
if(CANAL)CANAL.onmessage=ev=>{if(ev.data&&ev.data.tipo==='estado')aplicarRemoto(ev.data.dados);};
try{window.addEventListener('storage',ev=>{
  if(ev.key===CHAVE&&ev.newValue)aplicarRemoto(ev.newValue);});}catch(e){}
let PRONTO=false,tSalvar,ULTIMO='',salvando=false;

function estadoAtual(){
  return JSON.stringify({versao:1,gravado:new Date().toISOString(),
    vendo:ymd(S.page==='envase'?S.ref:S.refTq),
    ordens:ORDENS,aponta:APONTA,saldos:SALDOS,sopro:SOPRO,
    cadastro:{insumos:INSUMOS,proxLote:PROX_LOTE,formulas:FORMULAS,funcoes:FUNCOES,validade:VALIDADE,rt:RT,operadores:OPERADORES,espec:ESPEC,preformas:PREFORMAS,prefProd:PREF_PROD,recursos:RECURSOS,gruposMaq:GRUPOS_MAQ,motivos:MOTIVOS,tolerancia:TOLERANCIA,tempos:TEMPOS,setupEnv:SETUP_ENV,tempoGranel:TEMPO_GRANEL,frascos:FRASCOS,sopradoras:SOPRADORAS,tanques:TANQUES,
      jornada:JORNADA,frascoProd:FRASCO_PROD,usuarios:USUARIOS}});
}
function aplicarEstado(txt){
  const d=JSON.parse(txt);
  if(!d||!Array.isArray(d.ordens))throw new Error('arquivo sem ordens');
  ORDENS.length=0;d.ordens.forEach(o=>ORDENS.push({setupFim:'',envIni:'',...o}));
  SALDOS.length=0;(d.saldos||[]).forEach(x=>SALDOS.push(x));
  Object.keys(SOPRO).forEach(k=>delete SOPRO[k]);Object.assign(SOPRO,d.sopro||{});
  const cad=d.cadastro||{};
  /* frascos: casa por id e respeita a ordem gravada (as colunas são reordenáveis) */
  if(cad.insumos&&cad.insumos.length){INSUMOS.length=0;cad.insumos.forEach(x=>INSUMOS.push(x));}
  if(cad.proxLote)Object.assign(PROX_LOTE,cad.proxLote);
  if(cad.formulas)Object.assign(FORMULAS,cad.formulas);
  if(cad.funcoes&&cad.funcoes.length){FUNCOES.length=0;cad.funcoes.forEach(f=>FUNCOES.push(f));}
  if(cad.validade)Object.assign(VALIDADE,cad.validade);
  if(cad.rt)Object.assign(RT,cad.rt);
  if(cad.operadores){OPERADORES.length=0;cad.operadores.forEach(o=>OPERADORES.push(o));}
  if(cad.espec)Object.assign(ESPEC,cad.espec);
  if(cad.preformas&&cad.preformas.length){PREFORMAS.length=0;cad.preformas.forEach(x=>PREFORMAS.push(x));}
  if(cad.prefProd)Object.assign(PREF_PROD,cad.prefProd);
  if(cad.gruposMaq&&cad.gruposMaq.length){GRUPOS_MAQ.length=0;cad.gruposMaq.forEach(g=>GRUPOS_MAQ.push(g));}
  if(cad.recursos&&cad.recursos.length){RECURSOS.length=0;cad.recursos.forEach(r=>RECURSOS.push(r));
    sincronizarRecursos();}
  if(cad.tempos)Object.assign(TEMPOS,cad.tempos);
  if(cad.setupEnv!=null)SETUP_ENV=+cad.setupEnv||0;
  if(cad.tempoGranel)Object.assign(TEMPO_GRANEL,cad.tempoGranel);
  if(cad.motivos&&cad.motivos.length){MOTIVOS.length=0;cad.motivos.forEach(m=>MOTIVOS.push(m));}
  if(cad.tolerancia!=null)TOLERANCIA=+cad.tolerancia||0;
  if(cad.frascos&&cad.frascos.length){
    const sobra=FRASCOS.slice(),ordenados=[];
    cad.frascos.forEach(f=>{
      const k=sobra.findIndex(x=>x.id===f.id);
      if(k>=0){Object.assign(sobra[k],f);ordenados.push(sobra.splice(k,1)[0]);}
    });
    FRASCOS.length=0;ordenados.concat(sobra).forEach(f=>FRASCOS.push(f));
  }
  if(cad.sopradoras)cad.sopradoras.forEach((m,i)=>{if(SOPRADORAS[i])Object.assign(SOPRADORAS[i],m);});
  if(cad.tanques)cad.tanques.forEach((t,i)=>{if(TANQUES[i])Object.assign(TANQUES[i],t);});
  if(cad.jornada)Object.assign(JORNADA,cad.jornada);
  if(cad.usuarios&&cad.usuarios.length){
    USUARIOS.length=0;cad.usuarios.forEach(u=>USUARIOS.push(u));
    if(EU)EU=USUARIOS.find(u=>u.id===EU.id)||USUARIOS[0];
  }
  if(cad.frascoProd){Object.keys(FRASCO_PROD).forEach(k=>delete FRASCO_PROD[k]);
    Object.assign(FRASCO_PROD,cad.frascoProd);}
  Object.keys(APONTA).forEach(k=>delete APONTA[k]);
  Object.assign(APONTA,d.aponta||{});
  return d;
}
function corpoDados(){
  /* só o que é dado; a data de gravação fica de fora para poder comparar */
  return JSON.stringify({ordens:ORDENS,aponta:APONTA,saldos:SALDOS,sopro:SOPRO,
    frascos:FRASCOS,sopradoras:SOPRADORAS,tanques:TANQUES,jornada:JORNADA,
    frascoProd:FRASCO_PROD,usuarios:USUARIOS});
}
async function persistir(forcar){
  if(!PRONTO||salvando||RECEBENDO||MODO_TV)return;
  const corpo=corpoDados();
  if(!forcar&&corpo===ULTIMO)return;          // nada mudou, não gasta gravação
  salvando=true;
  const dados=estadoAtual();
  let okLocal=false,okNuvem=false,erro='',conflito=false;
  /* cópia local sempre, para não perder nada se a internet cair */
  try{if(typeof localStorage!=='undefined'){localStorage.setItem(CHAVE,dados);okLocal=true;}}catch(e){}
  const queriaNuvem=ONLINE;
  if(ONLINE){
    try{
      const r=await nuvemGravar(dados);
      if(r.conflito)conflito=true; else okNuvem=true;
    }catch(e){erro=e.message||'banco';ONLINE=false;}
  }
  const ok=okNuvem||(!queriaNuvem&&okLocal);
  salvando=false;
  if(ok){ULTIMO=corpo;try{if(CANAL)CANAL.postMessage({tipo:'estado',dados});}catch(e){}}
  if(conflito){
    /* ninguém perde trabalho em silêncio: avisa e recarrega o que está no banco */
    toast('Outra pessoa gravou antes de você. Recarregando o que está no banco.',true);
    await conferirNuvem();
    marcarEstado('recarregado do banco — confira e lance de novo',true);
    return;
  }
  const el=M('salvo');
  if(!el)return;
  /* três situações diferentes, três avisos diferentes:
     gravou no banco · o banco caiu mas o navegador guardou · não gravou em lugar nenhum */
  if(okNuvem){
    el.textContent=`salvo no banco ${relogio()} · ${ORDENS.length} OP`;
    el.style.color='';el.style.background='';
    el.title='Gravado no banco';
  }else if(okLocal){
    el.textContent=queriaNuvem
      ?`sem conexão · guardado neste navegador ${relogio()}`
      :`salvo neste navegador ${relogio()} · ${ORDENS.length} OP`;
    el.style.color=queriaNuvem?'#7A4A00':'';
    el.style.background=queriaNuvem?'#FDF1E3':'';
    el.title=queriaNuvem
      ?'O banco não respondeu ('+erro+'). Nada foi perdido: assim que voltar, sincroniza.'
      :'Gravado neste navegador';
  }else{
    el.textContent='NÃO SALVOU — baixe os dados';
    el.style.color='#fff';el.style.background='var(--danger)';
    el.title='Falha: '+erro;
  }
}

async function autenticar(email,senha){

}
async function renovarSessao(){
  if(!SESSAO||!SESSAO.refresh_token)return false;
  try{

      method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:SESSAO.refresh_token})});
    if(!r.ok)return false;
    SESSAO=await r.json();
    try{localStorage.setItem(SUPA_SESSAO,JSON.stringify(SESSAO));}catch(e){}
    return true;
  }catch(e){return false;}
}

async function nuvemLer(){

    {headers:cabecalhos()});
  if(r.status===401){ if(await renovarSessao())return nuvemLer(); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('leitura falhou ('+r.status+')');
  const l=await r.json();
  return l[0]||null;
}
async function nuvemVersao(){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_estado?id=eq.${SUPA.linha}&select=versao`,
    {headers:cabecalhos()});
  if(!r.ok)return null;
  const l=await r.json();
  return l[0]?l[0].versao:null;
}
/* Grava só se a versão ainda for a que lemos. Se outra pessoa gravou
   nesse meio tempo, o banco não altera nada e devolve lista vazia. */
async function nuvemGravar(texto){
  const corpo={dados:JSON.parse(texto),versao:VERSAO_NUVEM+1,
    atualizado_em:new Date().toISOString(),atualizado_por:emailDaSessao()};
  const r=await fetch(
    `${SUPA.url}/rest/v1/pcp_estado?id=eq.${SUPA.linha}&versao=eq.${VERSAO_NUVEM}`,
    {method:'PATCH',headers:cabecalhos({'Prefer':'return=representation'}),
     body:JSON.stringify(corpo)});
  if(r.status===401){ if(await renovarSessao())return nuvemGravar(texto); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('gravação falhou ('+r.status+')');
  const l=await r.json();
  if(!l.length)return {conflito:true};
  VERSAO_NUVEM=l[0].versao;
  return {conflito:false,versao:l[0].versao};
}

const arrastando=()=>!!(typeof DRAG!=='undefined'&&DRAG)||!!(typeof ARR!=='undefined'&&ARR)

async function conferirNuvem(){
  if(!ONLINE)return;

  try{

    if(!linha)return;
    VERSAO_NUVEM=linha.versao;

/* =====================================================================
   ACESSOS — cadastro das pessoas dentro do sistema
   Ter conta e ter acesso são coisas diferentes: a conta é criada aqui,
   mas quem libera é a lista no banco, conferida pelo servidor.
   ===================================================================== */
let ACESSOS=[], MEU_ACESSO=null;
const souMaster=()=>!!(MEU_ACESSO&&MEU_ACESSO.master);

/* senha legível, sem caracteres que se confundem (0/O, 1/l/I) */
function gerarSenha(){
  const letras='abcdefghjkmnpqrstuvwxyz',num='23456789';
  let s='';
  for(let i=0;i<6;i++)s+=letras[Math.floor(Math.random()*letras.length)];
  for(let i=0;i<3;i++)s+=num[Math.floor(Math.random()*num.length)];
  return s;
}

async function lerAcessos(){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso?select=*&order=nome`,{headers:cabecalhos()});
  if(r.status===401){ if(await renovarSessao())return lerAcessos(); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('não consegui ler os acessos ('+r.status+')');
  ACESSOS=await r.json();
  const meu=emailDaSessao().toLowerCase();
  MEU_ACESSO=ACESSOS.find(a=>a.email===meu)||null;
  /* o topo precisa saber de quem é a sessão assim que o cadastro chega */
  try{M('quem').querySelector('b').textContent=nomeDaSessao()==='—'?'':nomeDaSessao();}catch(e){}
  return ACESSOS;
}
async function gravarAcesso(linha,novo,email){
  const alvo=email||linha.email;
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso`+(novo?'':`?email=eq.${encodeURIComponent(alvo)}`),{
    method:novo?'POST':'PATCH',
    headers:cabecalhos({'Prefer':'return=representation'}),
    body:JSON.stringify(novo?[linha]:linha)});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&(d.message||d.hint))||'falha ao gravar ('+r.status+')');
  return d;
}
async function apagarAcesso(email){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso?email=eq.${encodeURIComponent(email)}`,
    {method:'DELETE',headers:cabecalhos()});
  if(!r.ok)throw new Error('falha ao excluir ('+r.status+')');
}

/* cria a conta no banco sem derrubar a sessão de quem está cadastrando */
async function criarConta(email,senha){
  const guardada=SESSAO;
  const r=await fetch(`${SUPA.url}/auth/v1/signup`,{
    method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:senha})});
  const d=await r.json().catch(()=>({}));
  SESSAO=guardada;                       /* o signup devolve sessão nova: descarta */
  try{localStorage.setItem(SUPA_SESSAO,JSON.stringify(guardada));}catch(e){}
  if(!r.ok){
    const m=(d.msg||d.message||d.error_description||'').toLowerCase();
    if(m.indexOf('already')>=0||m.indexOf('registered')>=0)
      return {jaExistia:true};
    throw new Error(d.msg||d.message||d.error_description||'não consegui criar a conta');
  }
  return {jaExistia:false};
}

/* ---------- arranque ---------- */
async function iniciarComNuvem(){
  let linha=null;
  try{ linha=await nuvemLer(); }
  catch(e){
    if(String(e.message).indexOf('sessão')>=0){telaLogin('Sua sessão expirou. Entre de novo.');return;}
    ONLINE=false;
    await restaurarLocal();
    marcarEstado('sem conexão com o banco — trabalhando neste navegador',true);
    return;
  }
  ONLINE=true;
  VERSAO_NUVEM=linha?linha.versao:0;
  const vazio=!linha||!linha.dados||!linha.dados.ordens;
  if(vazio){
    /* primeira vez: sobe o que já existe neste navegador */
    await restaurarLocal();
    PRONTO=true;
    try{ await nuvemGravar(estadoAtual()); marcarEstado(`primeira carga enviada · ${ORDENS.length} OP`); }
    catch(e){ marcarEstado('não consegui enviar a primeira carga',true); }
  }else{
    try{
      const d=aplicarEstado(JSON.stringify(linha.dados));
      if(d.vendo){S.ref=new Date(d.vendo+'T00:00:00');S.refTq=new Date(d.vendo+'T00:00:00');}
    }catch(e){}
    PRONTO=true;ULTIMO=corpoDados();
    marcarEstado(`${ORDENS.length} OP · ${SALDOS.length} saldo · online`);
  }
  render();
  if(MODO_TV){try{renderTV();}catch(e){}}else{irParaAgora();}
  ligarPolling();
  const q=M('quem');
  if(q&&emailDaSessao()){const b=q.querySelector('b');if(b)b.textContent=emailDaSessao().split('@')[0];}
}
function marcarEstado(txt,ruim){
  const el=M('salvo');if(!el)return;
  el.textContent=txt;
  el.style.color=ruim?'#fff':'';
  el.style.background=ruim?'var(--danger)':'';
}


async function restaurarLocal(){
  let dados=null;
  try{if(typeof window!=='undefined'&&window.storage){const r=await window.storage.get(CHAVE);if(r&&r.value)dados=r.value;}}catch(e){}
  if(!dados){try{if(typeof localStorage!=='undefined')dados=localStorage.getItem(CHAVE);}catch(e){}}
  if(dados){try{
    const d=aplicarEstado(dados);
    if(d.vendo){S.ref=new Date(d.vendo+'T00:00:00');S.refTq=new Date(d.vendo+'T00:00:00');}
  }catch(e){console.warn('dados anteriores ilegíveis',e);}}
  PRONTO=true;ULTIMO=corpoDados();
}
async function restaurar(){
  if(temNuvem()){
    if(!SESSAO){telaLogin('');return;}
    await iniciarComNuvem();
    return;
  }
  await restaurarLocal();
  render();irParaAgora();
  marcarEstado(ORDENS.length||SALDOS.length
    ?`${ORDENS.length} OP · ${SALDOS.length} saldo carregados`:'pronto para lançar');
}

function baixarDados(){
  const nome=`pcp-atrius-dados-${ymd(new Date())}.json`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([estadoAtual()],{type:'application/json'}));
  a.download=nome;a.click();URL.revokeObjectURL(a.href);
  toast(`${nome} baixado · ${ORDENS.length} OP.`);
}
function abrirDados(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=aplicarEstado(r.result);
      persistir(true);render();
      toast(`${ORDENS.length} OP carregadas${d.gravado?` · arquivo de ${dCurto(d.gravado.slice(0,10))}`:''}.`);
    }catch(e){toast('Arquivo inválido: '+e.message,true);}
  };
  r.readAsText(file);
}

/* =====================================================================
   PAINEL DA TV — tela própria, não a grade de edição aumentada.
   Regras: o card grande só nasce quando o operador iniciou a produção;
   atrasada é passar do fim previsto, não da hora de começar;
   concluídas descem para o fim da fila; nada de sopro aqui.
   ===================================================================== */
const SIT_TV={
  producao:{cor:'#127A41',rot:'Em produção'},
  atrasada:{cor:'#C62230',rot:'Atrasada'},
  parada:{cor:'#98A1AE',rot:'Sem ordem iniciada'}
};
/* data de fabricação leva o ano: é o que vai no rótulo do frasco */
const dFab=s=>new Date(s+'T00:00:00')
  .toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const escTV=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const celTV=(cls,lb,vl)=>`<div class="dcel ${cls}"><div class="lb">${lb}</div><div class="vl">${vl}</div></div>`;

/* diferença em h:mm, para a faixa colorida */
function hmm(min){
  const m=Math.max(0,Math.round(min));
  return m>=60?`${Math.floor(m/60)}h${p2(m%60)}`:`${m}min`;
}

/* o que a máquina está fazendo agora, do ponto de vista da TV */
function estadoMaquina(maq,data){
  const doDia=ORDENS.filter(o=>o.maq===maq&&o.data===data&&naGrade(o))
    .sort((a,b)=>a.inicio-b.inicio);
  /* em produção = envase iniciado e ainda não encerrado */
  const rodando=doDia.find(o=>sit(o)==='producao');
  const agora=agoraMin();
  if(rodando){
    const fim=fimPrev(rodando);
    return {sit:agora>fim?'atrasada':'producao',oc:rodando,
      delta:agora>fim?`+${hmm(agora-fim)}`:`faltam ${hmm(fim-agora)}`,
      fila:doDia.filter(o=>o.id!==rodando.id)};
  }
  const prox=doDia.find(o=>sit(o)!=='concluida'&&sit(o)!=='finalizado');
  return {sit:'parada',proxima:prox?hhmm(prox.inicio):null,fila:doDia};
}

function blocoAgoraTV(m){
  const s=SIT_TV[m.sit],o=m.oc,p=prodOf(o.codigo);
  return `<div class="tvagora">
    <div class="tvabar"><span class="t">${escTV(s.rot)}</span><span class="d">${escTV(m.delta)}</span></div>
    <div class="tvabody">
      <div class="tvprod">${escTV(p.descricao)}</div>
      <div class="dest">
        ${celTV('d2','Máquina',escTV(o.maq))}
        ${celTV('d2','Lote',`<span class="num">${escTV(o.lote||'—')}</span>`)}
        ${celTV('d2','Fabricação',`<span class="num">${escTV(dFab(o.data))}</span>`)}
        ${celTV('d3','Puxar do tanque',
          `${escTV(o.tanque||'—')} <span class="lt">· ${nf(o.litros)} L</span>`)}
        ${celTV('d3','Qtde prevista',`<span class="num">${nf(caixasPrev(o))} cx</span>`)}
      </div>
      <div class="tempos">
        <div class="tcx prev"><div class="lb">Previsto</div>
          <div class="vl">${hhmm(o.inicio)} – ${hhmm(fimPrev(o))}</div></div>
        <div class="tcx real"><div class="lb">Realizado</div>
          <div class="vl">${escTV(iniEnvase(o)||o.iniReal)} – ${
            o.fimReal?escTV(o.fimReal):'<span class="curso">em curso</span>'}</div></div>
      </div>
    </div>
  </div>`;
}

const blocoParadaTV=m=>`<div class="tvparada">
  <div class="t">Nenhuma ordem iniciada</div>
  <div class="s">${m.proxima?`A próxima começa às <b>${escTV(m.proxima)}</b>`
    :'Sem programação para hoje'}</div></div>`;

function colunaTV(maq,data){
  const m=estadoMaquina(maq,data),s=SIT_TV[m.sit];
  const fechadas=m.fila.filter(o=>sit(o)==='concluida');
  const abertas=m.fila.filter(o=>sit(o)!=='concluida');
  const cont=[`${abertas.length} próximo${abertas.length===1?'':'s'} na fila`];
  if(fechadas.length)cont.push(`${fechadas.length} concluída${fechadas.length>1?'s':''}`);
  const linha=o=>{
    const p=prodOf(o.codigo),fim=sit(o)==='concluida';
    return `<div class="tvoc ${fim?'fim':''}" style="--fam:${fim?'#98A1AE':CORES[p.grupo]}">
      <div class="n">${escTV(p.descricao)}${fim?'<span class="selo">Concluída</span>':''}</div>
      <div class="m">Lote ${escTV(o.lote||'—')} · <b>${escTV(o.tanque||'—')}</b> ·
        <b>${nf(o.litros)} L</b> · ${nf(caixasPrev(o))} cx ·
        previsto <span class="hr">${hhmm(o.inicio)}–${hhmm(fimPrev(o))}</span></div>
    </div>`;
  };
  return `<section class="tvmaq" style="--sit:${s.cor}">
    <div class="tvmh"><b>${escTV(maq)}</b><span class="tvtag">${escTV(s.rot)}</span></div>
    ${m.sit==='parada'?blocoParadaTV(m):blocoAgoraTV(m)}
    <div class="tvfilah"><span>${escTV(cont.join(' · '))}</span><hr></div>
    <div class="tvfila">
      ${abertas.concat(fechadas).map(linha).join('')
        ||'<div class="tvvazio">Sem ordens para hoje.</div>'}
      <div class="mais" hidden></div>
    </div>
  </section>`;
}

/* Na TV ninguém rola a tela: o que não couber sai do fim e vira contagem.
   Como as concluídas já estão no fim, são as primeiras a sair. */
function coubeNaTela(){
  document.querySelectorAll('.tvmaq').forEach(sec=>{
    const fila=sec.querySelector('.tvfila');if(!fila)return;
    const mais=fila.querySelector('.mais');if(!mais)return;
    const itens=[].slice.call(fila.querySelectorAll('.tvoc'));
    itens.forEach(o=>{o.hidden=false});
    mais.hidden=true;
    let fora=0;
    for(let k=itens.length-1;k>=0;k--){
      if(fila.scrollHeight<=fila.clientHeight+1)break;
      itens[k].hidden=true;fora++;
      mais.hidden=false;
      mais.textContent=fora>1?`mais ${fora} ordens abaixo`:'mais 1 ordem abaixo';
    }
  });
}

function renderTV(){
  const d=new Date(),data=ymd(d);

  M('tvhoje').textContent=dLongo(data);
  M('tvgrid').innerHTML=MAQUINAS.map(m=>colunaTV(m,data)).join('');
  coubeNaTela();
}

/* =====================================================================
   ENDEREÇO E HISTÓRICO
   Cada tela vira um endereço. Assim o voltar do navegador funciona,
   dá para abrir o sistema já numa tela e o F5 não perde o lugar.
   ===================================================================== */
const ROTAS=['inicio','envase','tanques','sopro','rotulagem','relatorio','admin'];
let VOLTANDO=false;                       /* mudou por causa do botão voltar */

function rotaAtual(){
  let r=S.page;
  if(S.page==='admin'&&typeof ABA_ADMIN!=='undefined')r+='/'+ABA_ADMIN;
  if(S.page==='relatorio'&&typeof ABA_REP!=='undefined')r+='/'+ABA_REP;
  if(S.page==='envase'&&S.view&&S.view!=='dia')r+='/'+S.view;
  return '#'+r;
}
function lerRota(h){
  const p=String(h||'').replace(/^#/,'').split('/');
  if(!ROTAS.includes(p[0]))return null;
  return {page:p[0],aba:p[1]||null};
}
/* troca a tela sem empurrar no histórico de novo */
function aplicarRota(r){
  if(!r)return;
  /* módulo guardado: o endereço não leva a ele */
  if(!moduloLigado(r.page)){S.page='envase';S.view='dia';
    try{render();}catch(e){}return;}
  VOLTANDO=true;
  S.page=r.page;
  if(r.page==='admin'&&r.aba&&typeof ABA_ADMIN!=='undefined')ABA_ADMIN=r.aba;
  if(r.page==='relatorio'&&r.aba&&typeof ABA_REP!=='undefined')ABA_REP=r.aba;
  if(r.page==='envase')S.view=r.aba||'dia';
  try{render();}finally{VOLTANDO=false;}
}
/* chamado no fim de cada render: só empurra quando o endereço mudou */
function marcarRota(){
  if(MODO_TV||VOLTANDO)return;
  try{
    const alvo=rotaAtual();
    if(location.hash===alvo)return;
    history.pushState({r:alvo},'',alvo);
  }catch(e){}
}
try{
  window.addEventListener('popstate',ev=>{
    const r=lerRota((ev.state&&ev.state.r)||location.hash);
    /* endereço desconhecido: não faz nada, para não pular para outra tela */
    if(r)aplicarRota(r);
  });
}catch(e){}

/* =====================================================================
   ERRO À VISTA — sem isto, uma falha some no console e a tela só "não faz nada"
   ===================================================================== */
const ERROS=[];
function mostrarErro(msg,onde){
  const txt=`${msg}${onde?`  (${onde})`:''}`;
  if(ERROS.includes(txt))return;                 /* não repete o mesmo */
  ERROS.push(txt);
  let cx=M('errbox');
  if(!cx){
    cx=document.createElement('div');cx.id='errbox';
    cx.innerHTML=`<div class="errh"><b>Falha no sistema</b>
      <button id="errX" title="Fechar">✕</button></div><div id="errL"></div>
      <div class="errp">Baixe os dados antes de recarregar. Mande este texto para o desenvolvedor.</div>`;
    document.body.appendChild(cx);
    const x=M('errX');if(x)x.onclick=()=>{cx.remove();ERROS.length=0;};
  }
  const l=M('errL');
  if(l)l.innerHTML=ERROS.map(e=>`<div class="erri">${e.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>`).join('');
}
try{
  window.addEventListener('error',ev=>{
    mostrarErro(ev.message||'erro desconhecido',
      ev.filename?`linha ${ev.lineno}, coluna ${ev.colno}`:'');
  });
  window.addEventListener('unhandledrejection',ev=>{
    const r=ev.reason;
    mostrarErro((r&&r.message)||String(r)||'promessa rejeitada','assíncrono');
  });
}catch(e){}
