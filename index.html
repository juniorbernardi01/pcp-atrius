function fecharModal(){
  DESTRAVADA=false;
  if(M('mAcao'))M('mAcao').innerHTML='';M('mask').classList.remove('on');M('mSub').hidden=true;M('modal').classList.remove('wide');}
function sacudir(){const m=M('modal');m.classList.remove('sacode');void m.offsetWidth;m.classList.add('sacode');}

let EDIT=null,SALDO_ATUAL=null,DESTRAVADA=false;
function abrirOrdem(o,pre){
  EDIT=o||null;
  const fim=o&&sit(o)==='concluida'&&!DESTRAVADA;
  const fin=o&&sit(o)==='finalizado';
  const V=(k,def)=>{if(o)return o[k]??def;
    if(pre&&pre[k]!==undefined&&pre[k]!==null&&pre[k]!=='')return pre[k];return def;};
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent=o?(fim?'OC concluída':'Editar OC de envase'):'Nova OC de envase';
  M('mSub').innerHTML=o?`#${o.id} · <span class="stq ${sit(o)}">${ST[sit(o)]}</span>`:'';
  M('mSub').hidden=!o;M('modal').classList.add('wide');
  const dis=fim?'disabled':'';
  const sdId=o?o.saldoId:(pre&&pre.saldoId);
  SALDO_ATUAL=sdId||null;
  const sd=sdId?SALDOS.find(x=>x.id===sdId):null;
  const dispSaldo=sd?dispDe(sd)+(o?o.litros:0):0;

  M('mB').innerHTML=`
    ${sd?`<div class="alert" style="background:#F1ECFC;border-color:#CFC0F2;color:#4C1D95">
      Puxando do saldo de <b>${sd.produto}</b> no <b>${sd.tanque}</b> ·
      <b>${nf(dispSaldo)} L</b> disponíveis. Escolha o formato que vai envasar.</div>`:''}
    ${o&&!fim&&!loteLiberado(o)?`<div class="alert">Tanque${o.tanque?` ${o.tanque}`:''}
      não liberado pelo gestor para envase.</div>`:''}
    ${fin?`<div class="alert blue">Envase finalizado ${o.iniReal}–${o.fimReal} ·
      ${tempoReal(o)} min. <b>Falta informar as caixas produzidas</b> para concluir.</div>`:''}
    ${fim?`<div class="alert ok">Concluída${o.fimReal?` às ${o.fimReal}`:''}.
      ${o.caixas!=null?`<b>${nf(o.caixas)} caixas</b> atendidas de ${nf(caixasPrev(o))} previstas.`:''}
      ${tempoReal(o)!=null?`Tempo de produção: <b>${tempoReal(o)} min</b>
        (previsto ${total(o)} min).`:''}</div>`:''}
    <div class="g2">
      <div class="fld"><label>${sd?'Litros a puxar':'Volume do tanque'} <b>*</b></label>
        ${sd?`<input type="number" id="fVol" min="1" max="${dispSaldo}" step="10"
              value="${V('litros',dispSaldo)}" ${dis}>`
           :`<input type="number" id="fVol" min="1" step="10" placeholder="litros"
              value="${+V('litros',0)||''}" ${dis}>`}</div>
      <div class="fld"><label>Tanque</label>
        <select id="fTq" ${sd?'disabled':dis}>
          <option value="">Selecione…</option>
          ${TANQUES.map(t=>`<option value="${t.id}" ${V('tanque','')===t.id?'selected':''}>${t.id} · ${nf(t.cap)} L</option>`).join('')}</select></div>
    </div>
    <div class="hint" id="fTqHint" style="font-size:11px;color:var(--ink3);margin:-6px 0 13px"></div>
    <div class="fld"><label>Produto de envase <b>*</b></label>
      <div class="gsku">
        <input type="text" id="fBusca" placeholder="SKU" autocomplete="off" ${dis} class="sku">
        <select id="fPr" ${dis}></select>
      </div>
      <div class="hint" id="fPrHint" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
    <div class="g2">
      <div class="fld"><label>Máquina <b>*</b></label>
        <select id="fMq" ${dis}><option value="">Selecione…</option>
        ${MAQUINAS.map(m=>`<option ${V('maq','')===m?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="fld"><label>Lote</label>
        <input type="text" id="fLote" value="${V('lote','')}" placeholder="opcional" ${dis}></div>
    </div>

    <div class="sec"><div class="st">Previsto</div>
      <div class="g3">
        <div class="fld"><label>Data <b>*</b></label>
          <input type="date" id="fDt" value="${o&&o.status==='pendente'?ymd(new Date()):V('data',ymd(S.ref))}" ${dis}></div>
        <div class="fld"><label>Início <b>*</b></label>
          <input type="time" id="fHr" step="900" value="${hhmm(o&&o.inicio==null?H0*60:V('inicio',H0*60))}" ${dis}></div>
        <div class="fld"><label>Fim previsto</label>
          <input type="time" id="fFimP" value="" disabled></div>
      </div>
      <div class="g2">
        <div class="fld"><label>Setup (min)</label>
          <input type="number" id="fSet" min="0" step="5" value="${V('setup',SETUP_PADRAO)}" ${dis}></div>
        <div class="fld"><label>Envase (min)</label>
          <input type="number" id="fEnv" min="5" step="5" value="${V('envase',ENVASE_PADRAO)}" ${dis}></div>
      </div>
    </div>

    <div class="sec"><div class="st">Realizado</div>
      <div class="g3">
        <div class="fld"><label>Início do setup</label>
          <input type="time" id="fIniR" step="300" value="${V('iniReal','')}">
          <div class="hint" id="fSetT" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
        <div class="fld"><label>Início do envase <b>*</b></label>
          <input type="time" id="fEnvI" step="300" value="${V('envIni','')}"></div>
        <div class="fld"><label>Fim do envase</label>
          <input type="time" id="fFimR" step="300" value="${V('fimReal','')}">
          <div class="hint" id="fEnvT" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
      </div>
      <div class="fld"><label>Caixas atendidas</label>
        <input type="number" id="fCx" min="0" step="1" value="${o&&o.caixas!=null?o.caixas:''}"
          placeholder="${o?nf(caixasPrev(o)):''}"></div>
    </div>

    <div class="calc" id="fCalc">—</div>
    ${o&&o.log.length?`<div class="log"><div class="st">Histórico</div>
      ${o.log.map(e=>`<div class="e"><span class="t">${e.t}</span>
      <span><b>${e.e}</b>${e.op?` · ${e.op}`:''}${e.m?`<em>${e.m}</em>`:''}</span></div>`).join('')}</div>`:''}`;

  const acts=[];
  const ed=podeEditar('envase'),xc=podeExcluir('envase');
  if(fim&&ed)acts.push(`<button class="btn warn sm" id="mReab">Reabrir OC</button>`);
  if(o&&o.status!=='cancelada'&&ed)acts.push(`<button class="btn sm" id="mRep">Repetir em seguida</button>`);
  /* dividir e interromper valem enquanto a OC não fechou o envase:
     dividir troca o formato puxando do mesmo tanque; interromper devolve litros ao tanque */
  if(o&&ed&&['programada','preparacao','producao'].includes(sit(o))){
    acts.push(`<button class="btn sm" id="mDiv">Dividir OC</button>`);
    acts.push(`<button class="btn warn sm" id="mInt">Interromper</button>`);
  }
  /* fecha o ciclo: é aqui que as caixas produzidas entram no sistema */
  const fechas=[];
  if(o&&ed&&['preparacao','producao'].includes(sit(o))){
    fechas.push(`<button class="btn blue" id="mFim">Concluir envase</button>`);
  }
  /* OC concluída abre travada: para mexer, o usuário pede Editar de propósito */
  if(o&&fim&&ed&&!DESTRAVADA)
    acts.push(`<button class="btn sm" id="mEdit">Editar</button>`);
  if(o&&ed&&sit(o)==='finalizado')
    fechas.push(`<button class="btn blue" id="mFim">Concluir envase</button>`);

  /* excluir fica sozinho no alto, longe dos botões que se usa todo dia */
  M('mAcao').innerHTML=(o&&!fim&&xc)?`<button class="btn del sm" id="mDel">Excluir</button>`:'';

  /* esquerda: o que se faz com a OC, em duas fileiras.
     direita: fechar e salvar, sempre no mesmo canto. */
  M('mF').innerHTML=`
    <div class="mfesq">
      ${acts.length?`<div class="mfrow">${acts.join('')}</div>`:''}
      ${fechas.length?`<div class="mfrow">${fechas.join('')}</div>`:''}
    </div>
    <div class="mfdir">
      <button class="btn" id="mC2">Fechar</button>
      ${(fim||!ed)?'':`<button class="btn pri" id="mS">${o?'Salvar':'Lançar OC'}</button>`}
    </div>`;
  M('mC2').onclick=fecharModal;
  if(M('mS'))M('mS').onclick=salvar;

  /* Salvar está sempre disponível. O que evita lixo no histórico é o mudancas():
     salvar sem mexer em nada não gera linha nenhuma. */

  if(M('mRep'))M('mRep').onclick=()=>repetir(o);
  if(M('mDiv'))M('mDiv').onclick=()=>dividir(o);
  if(M('mInt'))M('mInt').onclick=()=>interromper(o);
  if(M('mDel'))M('mDel').onclick=()=>excluir(o);
  if(M('mFim'))M('mFim').onclick=()=>concluir(o);
  if(M('mEdit'))M('mEdit').onclick=()=>{DESTRAVADA=true;abrirOrdem(o);
    toast('Campos liberados. O que mudar entra no histórico.');};

  /* lista de produtos filtrável por SKU ou nome */
  const montar=(termo)=>{
    const t=(termo||'').trim().toLowerCase();
    const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    /* item fora de linha some da lista, mas continua legível nas OCs antigas */
    const antigo=V('codigo','');
    const vivos=PRODUTOS.filter(p=>ativoProd(p)||p.codigo===antigo);
    const base=sd?vivos.filter(p=>p.tanque===sd.produto):vivos;
    const lista=t?base.filter(p=>p.codigo.startsWith(t)||norm(p.descricao).includes(norm(t))
      ||norm(p.tanque).includes(norm(t))):base;
    const sel=M('fPr'),atual=sel.value||V('codigo','');
    const grupos=[...new Set(lista.map(p=>p.grupo))];
    sel.innerHTML=`<option value="">${lista.length?'Selecione o produto…':'Nenhum produto encontrado'}</option>`+
      grupos.map(g=>`<optgroup label="${g}">${lista.filter(p=>p.grupo===g)
        .map(p=>`<option value="${p.codigo}" ${atual===p.codigo?'selected':''}>${p.codigo} · ${p.descricao}</option>`).join('')}</optgroup>`).join('');
    if(t&&lista.length===1)sel.value=lista[0].codigo;
    M('fPrHint').textContent=sd?`${lista.length} formato${lista.length>1?'s':''} de ${sd.produto}`
      :(t?`${lista.length} de ${vivos.length} produtos`:`${vivos.length} produtos em linha`);
    calc();
  };
  M('fBusca').addEventListener('input',e=>montar(e.target.value));
  /* o produto e a máquina definem a meta de envase e o lote padrão, sem digitar */
  const sugerir=()=>{
    const cod=M('fPr').value,maq=M('fMq').value;
    if(!cod)return;
    const lp=lotePadrao(cod),v=M('fVol');
    if(lp&&v&&!v.disabled&&(!(+v.value)||TANQUES.some(x=>x.cap===+v.value)||+v.value===lp))v.value=lp;
    const min=tempoDe(cod,maq),e=M('fEnv');
    if(min&&e&&!e.disabled){
      /* proporcional ao volume: o tempo da tabela é para o lote padrão */
      const vol=+v.value||lp||0;
      e.value=lp&&vol?Math.round(min*vol/lp):min;
    }
    calc();
  };
  M('fPr').addEventListener('change',()=>{
    const pr=prodOf(M('fPr').value);
    if(pr)M('fBusca').value=pr.codigo;
    sugerir();
  });
  M('fMq').addEventListener('change',sugerir);
  montar('');
  if(V('codigo',''))M('fBusca').value=V('codigo','');

  ['fPr','fMq','fVol','fTq','fDt','fHr','fSet','fEnv','fLote','fIniR','fEnvI','fFimR','fCx'].forEach(i=>
    M(i)?.addEventListener('input',calc));
  const dicaTq=()=>{
    const t=tqOf(M('fTq').value),v=+M('fVol').value||0;
    const sd=t?SALDOS.find(x=>x.tanque===t.id&&dispDe(x)>0):null;
    let txt,cor='var(--ink3)';
    if(!t)txt='Sem tanque, o lote fica pendente de programação. Você precisará selecionar um tanque.';
    else if(v>t.cap){txt=`O ${t.id} comporta ${nf(t.cap)} L e o lote tem ${nf(v)} L.`;cor='var(--danger)';}
    else if(sd){txt=`O ${t.id} ainda tem ${nf(dispDe(sd))} L de ${sd.produto}`
      +`${sd.interrompidoEm?`, interrompido em ${sd.interrompidoEm}`:''}. `
      +`Esta OC entra como batelada seguinte.`;cor='var(--pausa)';}
    else txt=`${t.id} · ${nf(t.cap)} L de capacidade.`;
    M('fTqHint').textContent=txt;M('fTqHint').style.color=cor;
  };


  /* escolher o tanque sugere a capacidade; o campo continua livre para ajustar */
  M('fTq').addEventListener('change',()=>{
    const tq=tqOf(M('fTq').value),v=M('fVol');
    if(tq&&v&&!v.disabled){
      const atual=+v.value||0;
      /* sugere quando está vazio ou quando o número era a capacidade de outro tanque;
         um volume digitado à mão, menor que o tanque, é respeitado */
      if(!atual||TANQUES.some(x=>x.cap===atual))v.value=tq.cap;
      else if(atual>tq.cap){v.value=tq.cap;
        toast(`O ${tq.id} comporta ${nf(tq.cap)} L — volume ajustado.`);}
    }
    dicaTq();calc();
  });
  M('fVol').addEventListener('change',dicaTq);
  dicaTq();
  if(!o&&pre&&pre.tanque){const t=tqOf(pre.tanque);if(t&&!M('fVol').value)M('fVol').value=t.cap;}
  calc();
  M('mask').classList.add('on');
}

/* campo que pode não estar na tela devolve vazio, em vez de derrubar a função */
const cv=id=>{const e=M(id);return e?e.value:'';};
function ler(){
  return {saldoId:SALDO_ATUAL,lote:cv('fLote').trim(),
    tanque:SALDO_ATUAL?(SALDOS.find(x=>x.id===SALDO_ATUAL)||{}).tanque:(cv('fTq')||null),
    litros:+cv('fVol')||0,codigo:cv('fPr'),
    maq:cv('fMq'),data:cv('fDt'),inicio:cv('fHr')?hm(cv('fHr')):null,
    setup:+cv('fSet')||0,envase:+cv('fEnv')||0,
    iniReal:cv('fIniR'),setupFim:cv('fEnvI'),
    envIni:cv('fEnvI'),fimReal:cv('fFimR'),
    caixas:cv('fCx')===''?null:+cv('fCx')};
}
function calc(){
  const f=ler(),p=prodOf(f.codigo),el=M('fCalc');
  if(!el)return;
  const dur=f.setup+f.envase;
  if(f.inicio!=null)M('fFimP').value=hhmm(f.inicio+dur);
  const t=(f.iniReal&&f.fimReal)?Math.max(0,hm(f.fimReal)-hm(f.iniReal)):null;
  const ts=(f.iniReal&&f.setupFim)?Math.max(0,hm(f.setupFim)-hm(f.iniReal)):null;
  const te=(f.envIni&&f.fimReal)?Math.max(0,hm(f.fimReal)-hm(f.envIni)):null;
  M('fSetT').textContent=ts!=null?`setup ${ts} min · previsto ${f.setup}`:'';
  M('fEnvT').textContent=te!=null?`envase ${te} min · previsto ${f.envase}`:'';
  const hp=M('fPrHint');
  if(hp&&p)hp.textContent=`Lote no tanque: ${p.tanque} · ${p.un_cx} × ${p.litragem} L por caixa`;
  if(!p||!f.litros){el.textContent='Escolha o produto e o volume para ver o cálculo.';return;}
  const cx=Math.floor(f.litros/(p.un_cx*p.litragem)),sobra=f.litros-cx*p.un_cx*p.litragem;
  const cap=f.tanque?tqOf(f.tanque).cap:Infinity;
  /* quantas bateladas o tanque já tem no dia, contando esta */
  const mesmoTq=ORDENS.filter(o=>o.data===f.data&&o.tanque===f.tanque&&f.tanque
    &&ativa(o)&&(!EDIT||o.id!==EDIT.id));
  const outroProd=mesmoTq.filter(o=>prodOf(o.codigo).tanque!==p.tanque);
  let h=`Lote no tanque: <b>${p.tanque}</b>.<br>Rende <b>${nf(cx)} caixas</b> · ${p.un_cx} × ${p.litragem} L por caixa.<br>`;
  if(sobra>0)h+=`Sobram <b>${nf(sobra)} L</b> sem completar caixa.<br>`;
  if(f.inicio!=null){
    h+=`Ocupa das <b>${hhmm(f.inicio)}</b> às <b>${hhmm(f.inicio+dur)}</b> · ${dur} min.<br>`;
    h+=`${f.setup?`Setup <b>${hhmm(f.inicio)}–${hhmm(f.inicio+f.setup)}</b> (${f.setup} min) · `:''}`+
       `Envase <b>${hhmm(f.inicio+f.setup)}–${hhmm(f.inicio+dur)}</b> (${f.envase} min).<br>`;
  }
  if(t!=null)h+=`Tempo real <b>${t} min</b> · ${t>dur?`<span class="w">${t-dur} min acima do previsto</span>`
    :`<span style="color:var(--run)">${dur-t} min abaixo</span>`}.<br>`;
  if(f.caixas!=null&&cx)h+=`Atendidas <b>${nf(f.caixas)}</b> de ${nf(cx)} · ${nf1(f.caixas/cx*100)}%.<br>`;
  /* a tabela de tempos diz em que máquina cada produto roda */
  if(f.maq&&!rodaEm(f.codigo,f.maq)){
    const lm=maqsDe(f.codigo);
    h+=`<span class="w">${p.descricao} não tem tempo cadastrado na ${f.maq}`
      +`${lm.length?` — roda na ${lm.join(' e na ')}`:' — sem tempo em máquina nenhuma'}.</span><br>`;
  }else if(f.maq){
    const meta=tempoDe(f.codigo,f.maq),lp=lotePadrao(f.codigo);
    if(meta&&lp){
      const esperado=Math.round(meta*f.litros/lp);
      h+=`Meta de envase para ${nf(f.litros)} L na ${f.maq}: <b>${esperado} min</b>`
        +`${f.envase&&Math.abs(f.envase-esperado)>2?` · lançado ${f.envase} min`:''}.<br>`;
    }
  }
  if(f.tanque&&f.litros>cap)
    h+=`<span class="w">Esta OC tem ${nf(f.litros)} L e o ${f.tanque} comporta ${nf(cap)} L.</span><br>`;
  else if(f.tanque&&mesmoTq.length)
    h+=`O ${f.tanque} já tem <b>${mesmoTq.length}</b> OC no dia — esta entra como
        <b>batelada seguinte</b>, depois de esvaziar${outroProd.length?', com lavagem entre os produtos':''}.<br>`;
  if(f.saldoId){const sdv=SALDOS.find(x=>x.id===f.saldoId);
    const livre=dispDe(sdv)+(EDIT?EDIT.litros:0);
    h+= f.litros>livre?`<span class="w">O saldo tem ${nf(livre)} L disponíveis.</span><br>`
      :`Sobram <b>${nf(livre-f.litros)} L</b> no ${sdv.tanque} depois desta OC.<br>`;}
  else if(!f.tanque)h+=`<span style="color:var(--pausa)">Sem tanque — vai para <b>a programar</b> na tela de Tanques.</span><br>`;
  if(f.maq&&f.inicio!=null){
    const [ji,jf]=jorn(f.maq);
    if(f.inicio<ji)h+=`<span class="w">A ${f.maq} começa às ${hhmm(ji)}.</span><br>`;
    else if(f.inicio+dur>jf)h+=`<span class="w">Passa da jornada da ${f.maq}, que encerra
      às ${hhmm(jf)} — sobram ${f.inicio+dur-jf} min.</span><br>`;
  }
  const ch=ocupadas(f.maq,f.data,f.inicio,dur,EDIT?EDIT.id:null);
  if(ch.length)h+=`<span class="w">Choca com ${ch.length} OC nesta máquina.</span>`;
  el.innerHTML=h;
}

function salvar(){
  if(!M('fLote'))return;            /* formulário fechado: nada a salvar */
  const f=ler();
  /* começou a envasar sem a anterior fechada? */
  if(EDIT&&f.envIni&&!EDIT.envIni&&!LIBEROU[EDIT.id]){
    const pend=pendenteAntes({...EDIT,inicio:f.inicio??EDIT.inicio,maq:f.maq,data:f.data});
    if(pend){liberarInicio(EDIT,pend,f);return;}
  }
  if(!f.litros||!f.codigo||!f.maq||!f.data||f.inicio==null){
    toast('Preencha volume, produto, máquina, data e hora.',true);return;}
  if(f.saldoId){
    const sdv=SALDOS.find(x=>x.id===f.saldoId);
    const livre=dispDe(sdv)+(EDIT?EDIT.litros:0);
    if(f.litros>livre){toast(`O saldo tem ${nf(livre)} L disponíveis.`,true);return;}
  }
  if(!f.saldoId&&f.tanque&&f.litros>tqOf(f.tanque).cap){
    toast(`Esta OC tem ${nf(f.litros)} L e o ${f.tanque} comporta ${nf(tqOf(f.tanque).cap)} L.`,true);return;}
  if(f.maq){
    const [ji,jf]=jorn(f.maq);
    if(f.inicio<ji){toast(`A ${f.maq} começa às ${hhmm(ji)}.`,true);return;}
    if(f.inicio>=jf){toast(`A ${f.maq} encerra às ${hhmm(jf)}.`,true);return;}
  }

  if(EDIT){
    const antesSit=sit(EDIT),antes=retrato(EDIT);
    const eraPendente=EDIT.status==='pendente';
    Object.assign(EDIT,f);
    if(eraPendente){EDIT.status='programada';
      registrar(EDIT,'Saldo reprogramado',null,`${f.maq} ${hhmm(f.inicio)} em ${dCurto(f.data)}`);}
    else var mud=mudancas(antes,f);
    if(typeof mud!=='undefined'&&mud)registrar(EDIT,'OC editada',null,mud);
    S.sel=EDIT.id;
    const alvo=EDIT;
    fecharModal();S.ref=new Date(f.data+'T00:00:00');S.refTq=new Date(f.data+'T00:00:00');
    EDIT=null;render();
    /* fechou agora e sobrou produto no tanque? oferece a continuação */
    const sobra=caixasPrev(alvo)-(alvo.caixas??0);
    if(antesSit!=='concluida'&&sit(alvo)==='concluida'&&sobra>0&&alvo.tanque){
      continuar(alvo,sobra);return;}
    toast(sit(alvo)==='concluida'?`OC concluída · ${nf(alvo.caixas)} caixas.`
      :(typeof mud!=='undefined'&&!mud?'Nada foi alterado.':'OC salva.'));return;
  }
  const n=ordem(f);registrar(n,'OC lançada',null,`${f.maq} ${hhmm(f.inicio)}`);
  S.sel=n.id;fecharModal();
  S.ref=new Date(f.data+'T00:00:00');S.refTq=new Date(f.data+'T00:00:00');
  render();toast(`OC lançada no ${f.tanque}.`);
}

/* atrasada: passou do fim previsto e ainda não foi concluída */
function atrasada(o){
  const st=sit(o);
  if(['concluida','cancelada','pendente','finalizado'].includes(st))return false;
  const hoje=ymd(new Date());
  if(o.data>hoje)return false;
  if(o.data<hoje)return true;
  const agora=agoraMin();
  /* não começou e já passou da hora de começar */
  if(st==='programada')return agora>o.inicio;
  /* começou mas já passou da hora de terminar */
  return agora>fimPrev(o);
}
/* recompõe a fila da máquina: o que atrasou empurra o que vem depois */
function recomporDia(maq,data){
  const hoje=ymd(new Date());
  if(data<hoje)return;
  const [ji,jf]=jorn(maq);
  /* o cursor anda pelo que realmente aconteceu, não pelo relógio:
     quem atrasou empurra quem vem depois, sem colapsar a agenda no agora */
  let cursor=ji;
  ORDENS.filter(x=>x.maq===maq&&x.data===data&&naGrade(x))
    .sort((a,b)=>a.inicio-b.inicio)
    .forEach(x=>{
      /* só quem tem fim real está encerrado; ele define quando a máquina liberou */
      if(x.fimReal){cursor=Math.max(cursor,hm(x.fimReal));return;}
      /* o resto tem o previsto realinhado, mesmo que já tenha começado */
      if(x.inicio<cursor){
        const novo=Math.min(Math.round(cursor),jf-SNAP);
        if(novo>x.inicio){
          if(x.inicioOriginal==null)x.inicioOriginal=x.inicio;
          x.inicio=novo;
        }
      }
      cursor=Math.max(cursor,fimPrev(x),x.iniReal?hm(x.iniReal)+total(x):0);
    });
}
function recomporTudo(){
  const hoje=ymd(new Date());
  const dias=[...new Set(ORDENS.filter(naGrade).map(x=>x.data))].filter(d=>d>=hoje).sort();
  MAQUINAS.forEach(m=>dias.forEach(d=>recomporDia(m,d)));
}

/* recompõe e devolve o que mudou de horário, para registrar no histórico */
function recomporERegistrar(){
  const antes=new Map(ORDENS.map(x=>[x.id,x.inicio]));
  recomporTudo();
  const mudou=[];
  ORDENS.forEach(x=>{
    const a=antes.get(x.id);
    if(a!=null&&a!==x.inicio)mudou.push({x,antes:a,novo:x.inicio});
  });
  return mudou;
}

/* OCs seguintes na mesma máquina e dia, que andam junto com o desvio */
function seguintes(o){
  return ORDENS.filter(x=>x.maq===o.maq&&x.data===o.data&&sit(x)==='programada'
    &&x.id!==o.id&&x.inicio>=o.inicio).sort((a,b)=>a.inicio-b.inicio);
}
/* aplica o desvio: empurra para frente ou puxa para trás, sem invadir o real nem o turno */

/* ---------- o que não coube no turno continua no próximo dia ---------- */
function continuar(o,sobraCx){
  const lcx=litrosCx(o),litros=sobraCx*lcx,pr=prodOf(o.codigo);
  const prox=proximoUtil(addD(new Date(o.data+'T00:00:00'),1),1);

  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Sobrou produto no tanque';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert">Faltaram <b>${nf(sobraCx)} caixas</b> — <b>${nf(litros)} L</b> de
      <b>${pr.tanque}</b> continuam no <b>${o.tanque||'tanque'}</b>.</div>
    <div class="opt" id="cnA" style="border:1px solid var(--line);border-radius:11px;
      padding:12px 14px;margin-bottom:11px;cursor:pointer">
      <b style="font-size:13.5px">Programar a continuação</b>
      <p style="font-size:12px;color:var(--ink2);line-height:1.55;margin-top:4px">
        Cria uma OC em <b>${dCurto(ymd(prox))}</b> às <b>${hhmm(ji)}</b>, na ${o.maq},
        com ${nf(sobraCx)} caixas e <b>sem setup</b> — a máquina não foi lavada.</p></div>
    <div class="opt" id="cnB" style="border:1px solid var(--line);border-radius:11px;
      padding:12px 14px;cursor:pointer">
      <b style="font-size:13.5px">Deixar como saldo no tanque</b>
      <p style="font-size:12px;color:var(--ink2);line-height:1.55;margin-top:4px">
        Os ${nf(litros)} L ficam disponíveis no ${o.tanque||'tanque'} para qualquer formato
        de ${pr.tanque}. Você programa quando decidir.</p></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div><button class="btn" id="cnX">Depois</button>`;
  const fecha=()=>{fecharModal();render();};
  M('cnX').onclick=fecha;
  M('cnA').onclick=()=>{
    const n=ordem({tanque:o.tanque,codigo:o.codigo,maq:o.maq,litros,data:ymd(prox),
      inicio:ji,setup:0,envase:Math.max(15,Math.round(o.envase*sobraCx/caixasPrev(o)/5)*5),
      lote:o.lote,origem:o.id});
    registrar(n,'Continuação de OC',null,`Vem de ${dCurto(o.data)} · ${nf(sobraCx)} cx`);
    registrar(o,'Continuação programada',null,`${nf(sobraCx)} cx em ${dCurto(ymd(prox))}`);
    S.sel=n.id;S.ref=prox;fecha();
    toast(`Continuação criada em ${dCurto(ymd(prox))} às ${hhmm(ji)}.`);
  };
  M('cnB').onclick=()=>{
    saldo({tanque:o.tanque,volume:litros,produto:pr.tanque,grupo:pr.grupo,data:o.data,
      obs:'Sobra ao fechar a OC',interrompidoEm:`${dCurto(o.data)} ${o.fimReal||relogio()}`,origem:o.id});
    registrar(o,'Saldo devolvido ao tanque',null,`${nf(litros)} L de ${pr.tanque} no ${o.tanque||'tanque'}`);
    S.page='tanques';S.refTq=new Date(o.data+'T00:00:00');fecha();
    toast(`${nf(litros)} L ficaram no ${o.tanque||'tanque'}.`);
  };
  M('mask').classList.add('on');
}

/* O botão de passo a passo saiu: os horários são lançados na mão, nos três
   campos da OC (início do setup, início do envase, fim do envase). */

/* ---------- pedir liberação para iniciar o envase com a anterior aberta ---------- */
function liberarInicio(o,pend,f){
  const p=prodOf(pend.codigo);
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('mTit').textContent='A ordem anterior não foi fechada';
  M('mSub').hidden=false;
  M('mSub').textContent=`${o.maq} · ${dLongo(o.data)}`;
  M('mB').innerHTML=`
    <div class="alert">Nesta máquina a OC das <b>${hhmm(pend.inicio)}</b> —
      ${p.descricao} — está em <b>${ST[sit(pend)]}</b> e ainda não teve as caixas
      conferidas. O envase da próxima só começa depois do fechamento.</div>
    <div class="hint" style="font-size:12px;color:var(--ink3);margin:10px 0 14px;line-height:1.5">
      O setup pode continuar normalmente — é ele que corre em paralelo com a contagem.
      Se precisar mesmo começar agora, o supervisor libera e o motivo fica registrado.</div>
    <div class="g2">
      <div class="fld"><label>Senha do supervisor <b>*</b></label>
        <input type="password" id="lbPin" placeholder="••••"></div>
      <div class="fld"><label>Motivo da liberação <b>*</b></label>
        <input type="text" id="lbMot" placeholder="Por que não deu para fechar antes"></div>
    </div>`;
  M('mF').innerHTML=`
    <div class="mfesq"><div class="mfrow">
      <button class="btn blue" id="lbIr">Ir fechar a anterior</button></div></div>
    <div class="mfdir">
      <button class="btn" id="lbC">Voltar</button>
      <button class="btn warn" id="lbK">Liberar assim mesmo</button></div>`;
  M('lbC').onclick=()=>abrirOrdem(o);
  M('lbIr').onclick=()=>concluir(pend);
  M('lbK').onclick=()=>{
    if(M('lbPin').value!==SENHA_MESTRA){toast('Senha do supervisor não confere.',true);
      M('lbPin').focus();return;}
    const mot=M('lbMot').value.trim();
    if(!mot){toast('Informe o motivo da liberação.',true);M('lbMot').focus();return;}
    LIBEROU[o.id]=mot;
    registrar(o,'Início liberado sem fechamento da anterior',null,
      `${hhmm(pend.inicio)} ${nomeCurto(pend.codigo)} em aberto · ${mot}`);
    toast('Liberado. O motivo ficou no histórico.');
    abrirOrdem(o);
    if(f&&M('fEnvI'))M('fEnvI').value=f.envIni;
  };
  M('mask').classList.add('on');
}

/* ---------- finalizar envase, sem informar quantidade ainda ---------- */
function finalizarEnvase(o){
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Finalizar envase';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert blue">Registra que a máquina terminou. A OC fica
      <b>aguardando conclusão</b> até você informar as caixas produzidas,
      e as OCs seguintes já se ajustam pelo fim real.</div>
    ${o.setup?`<div class="g2">
      <div class="fld"><label>Setup início <b>*</b></label>
        <input type="time" id="nIni" step="300" value="${o.iniReal||hhmm(o.inicio)}"></div>
      <div class="fld"><label>Setup fim <b>*</b></label>
        <input type="time" id="nSetF" step="300" value="${o.setupFim||hhmm(o.inicio+o.setup)}"></div>
    </div>`:''}
    <div class="g2">
      <div class="fld"><label>Envase início <b>*</b></label>
        <input type="time" id="nEnvI" step="300" value="${o.envIni||hhmm(o.inicio+o.setup)}"></div>
      <div class="fld"><label>Envase fim <b>*</b></label>
        <input type="time" id="nFim" step="300" value="${o.fimReal||relogio()}"></div>
    </div>
    <div class="calc" id="nCalc"></div>
    <div class="fld"><label>Observação</label>
      <textarea id="nObs" placeholder="Motivo do atraso, parada, o que aconteceu"></textarea></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="nC">Voltar</button>
    <button class="btn blue" id="nK">Finalizar envase</button>`;
  M('nC').onclick=()=>abrirOrdem(o);
  const seg=seguintes(o);
  const upd=()=>{
    const ei=M('nEnvI').value,f=M('nFim').value;
    const sf=(M('nSetF')&&M('nSetF').value)||ei,i=(M('nIni')&&M('nIni').value)||ei;
    const t=(i&&f)?Math.max(0,hm(f)-hm(i)):null,dur=total(o);
    const ts=(i&&sf)?Math.max(0,hm(sf)-hm(i)):null,te=(ei&&f)?Math.max(0,hm(f)-hm(ei)):null;
    const delta=f?hm(f)-fimPrev(o):0;
    let h='';
    if(o.setup&&ts!=null)h+=`Setup <b>${ts} min</b> · previsto ${o.setup} min${badge(ts-o.setup)}.<br>`;
    if(te!=null)h+=`Envase <b>${te} min</b> · previsto ${o.envase} min${badge(te-o.envase)}.<br>`;
    if(t!=null)h+=`Total <b>${t} min</b> · previsto ${dur} min · `+
      (t>dur?`<span class="w">${t-dur} min acima</span>`:t<dur?`<span style="color:var(--run)">${dur-t} min abaixo</span>`:'no previsto')+`.<br>`;
    if(seg.length&&delta!==0)
      h+=`<b>${seg.length}</b> OC seguinte${seg.length>1?'s':''} na ${o.maq}
          ${delta>0?`vai${seg.length>1?'o':''} <b>${delta} min para frente</b>`
                   :`volta${seg.length>1?'m':''} <b>${-delta} min para trás</b>`}.`;
    M('nCalc').innerHTML=h||'Informe início e fim reais.';
  };
  ['nIni','nSetF','nEnvI','nFim'].forEach(i=>M(i)&&M(i).addEventListener('input',upd));
  if(M('nSetF'))M('nSetF').addEventListener('change',()=>{M('nEnvI').value=M('nSetF').value;upd();});
  upd();
  M('nK').onclick=()=>{
    const ei=M('nEnvI').value,f=M('nFim').value;
    const sf=(M('nSetF')&&M('nSetF').value)||ei,i=(M('nIni')&&M('nIni').value)||ei;
    if(!ei||!f||(o.setup&&(!i||!sf))){toast('Preencha os horários.',true);return;}
    const delta=hm(f)-fimPrev(o),obs=M('nObs').value.trim();
    o.iniReal=i;o.setupFim=sf;o.envIni=ei;o.fimReal=f;o.status='finalizado';
    registrar(o,'Envase finalizado',null,
      `setup ${i}–${sf} (${setupReal(o)} min)${badge(dvSetup(o)).replace(/<[^>]+>/g,'')} · `+
      `envase ${ei}–${f} (${envaseReal(o)} min)${badge(dvEnvase(o)).replace(/<[^>]+>/g,'')}`+
      `${obs?` · ${obs}`:''}`);
    const mudou=recomporERegistrar();
    mudou.forEach(({x,antes,novo})=>registrar(x,'Reajustada pelo realizado',null,
      `${hhmm(antes)} → ${hhmm(novo)} na ${x.maq}`));
    fecharModal();render();
    toast(mudou.length?`Envase finalizado · ${mudou.length} OC reajustada${mudou.length>1?'s':''}.`
      :'Envase finalizado · informe as caixas para concluir.');
  };
  M('mask').classList.add('on');
}

/* ---------- reabrir OC concluída ---------- */
function reabrir(o){
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Reabrir OC';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq} · concluída ${o.fimReal||''}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert">A OC volta para <b>programada</b> e pode ser editada de novo.
      O realizado e as caixas ficam preenchidos como estão — corrija o que for preciso.
      ${batDe(o)&&batDe(o).concluidoEm?'O lote do tanque também volta a ficar aberto.':''}</div>
    <div class="fld"><label>Motivo da reabertura <b>*</b></label>
      <textarea id="rObs" placeholder="Ex.: concluída por engano, quantidade errada"></textarea></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="rC">Voltar</button>
    <button class="btn warn" id="rK">Reabrir OC</button>`;
  M('rC').onclick=()=>abrirOrdem(o);
  M('rK').onclick=()=>{
    const motivo=M('rObs').value.trim();
    if(!motivo){toast('Escreva o motivo da reabertura.',true);M('rObs').focus();return;}
    const b=batDe(o);
    o.status='programada';
    registrar(o,'OC reaberta',null,motivo);
    if(b&&APONTA[b.chave]&&APONTA[b.chave].concluidoEm){
      const a=APONTA[b.chave];
      APONTA[b.chave]={...a,concluidoEm:'',
        log:[...(a.log||[]),{t:relogio(),e:'Lote reaberto',op:null,m:motivo}]};
    }
    fecharModal();render();toast('OC reaberta.');
  };
  M('mask').classList.add('on');
}

/* ---------- repetir em seguida ---------- */
function repetir(o){
  let data=o.data,inicio=Math.ceil(fimPrev(o)/SNAP)*SNAP;
  if(inicio>=H1*60){data=ymd(addD(new Date(o.data+'T00:00:00'),1));inicio=H0*60;}
  fecharModal();
  abrirOrdem(null,{repetida:true,data,inicio,maq:o.maq,tanque:o.tanque,codigo:o.codigo,
    litros:o.litros,envase:o.envase,setup:0,lote:o.lote});
}

/* ---------- dividir: parte neste formato, o resto em outro ---------- */
function dividir(o){
  const prev=caixasPrev(o),lcx=litrosCx(o),pr=prodOf(o.codigo);
  const irmaos=PRODUTOS.filter(x=>x.tanque===pr.tanque);
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Dividir a OC';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq} · ${nf(o.litros)} L no ${o.tanque||'tanque'}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert blue">Parte do lote sai neste formato e o restante em outro,
      puxando do mesmo tanque. Útil quando falta embalagem ou muda a necessidade.</div>
    ${emAndamento(o)?`<div class="alert">Esta OC já começou. Os horários já lançados
      <b>ficam nela</b>; a parte que sai nasce sem realizado, para ser apontada à parte.</div>`:''}
    <div class="fld"><label>Caixas nesta OC <b>*</b></label>
      <input type="number" id="dCx" min="1" max="${prev-1}" step="1" value="${Math.floor(prev/2)}">
      <div class="hint" style="font-size:11px;color:var(--ink3);margin-top:4px">
        A OC tem ${nf(prev)} caixas de ${fmtLit(pr.litragem)} · ${nf(o.litros)} L.</div></div>
    <div class="fld"><label>O restante sai em <b>*</b></label>
      <select id="dPr">${irmaos.map(x=>`<option value="${x.codigo}" ${x.codigo===o.codigo?'selected':''}>
        ${x.codigo} · ${x.descricao}</option>`).join('')}</select></div>
    <div class="g3">
      <div class="fld"><label>Máquina</label>
        <select id="dMq">${MAQUINAS.map(m=>`<option ${o.maq===m?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="fld"><label>Data</label>
        <input type="date" id="dDt" value="${o.data}"></div>
      <div class="fld"><label>Início</label>
        <input type="time" id="dHr" step="900" value="${hhmm(Math.min(fimPrev(o),jorn(o.maq)[1]-SNAP))}"></div>
    </div>
    <div class="calc" id="dCalc"></div>
    <div class="fld" style="margin-top:13px"><label>Motivo <b>*</b></label>
      <textarea id="dObs" placeholder="Ex.: faltou frasco de 3L"></textarea></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="dC">Voltar</button>
    <button class="btn pri" id="dK">Dividir</button>`;
  M('dC').onclick=()=>abrirOrdem(o);
  const upd=()=>{
    const fica=+M('dCx').value||0;
    const litrosFica=fica*lcx,litrosResto=o.litros-litrosFica;
    const novoP=prodOf(M('dPr').value);
    const lcx2=novoP?novoP.un_cx*novoP.litragem:lcx;
    const cxResto=Math.floor(litrosResto/lcx2);
    const mesmoFormato=novoP&&novoP.codigo===o.codigo;
    M('dCalc').innerHTML= fica<=0||fica>=prev
      ? `<span class="w">Informe entre 1 e ${nf(prev-1)} caixas.</span>`
      : `Fica: <b>${nf(fica)} cx</b> de ${fmtLit(pr.litragem)} · ${nf(litrosFica)} L.<br>
         Sai: <b>${nf(cxResto)} cx</b> de ${novoP?fmtLit(novoP.litragem):'—'} ·
         ${nf(litrosResto)} L do mesmo ${o.tanque||'tanque'}.<br>
         ${mesmoFormato?'Mesmo formato — sem setup.':'<b>Troca de formato</b> — entra setup de '+SETUP_PADRAO+' min.'}`;
  };
  ['dCx','dPr'].forEach(i=>M(i).addEventListener('input',upd));upd();
  M('dK').onclick=()=>{
    const fica=+M('dCx').value||0;
    if(fica<=0||fica>=prev){toast('Informe quantas caixas ficam nesta OC.',true);return;}
    const obs=M('dObs').value.trim();
    if(!obs){toast('Escreva o motivo da divisão.',true);M('dObs').focus();return;}
    const novoP=prodOf(M('dPr').value);
    const litrosFica=fica*lcx,litrosResto=o.litros-litrosFica;
    const mesmoFormato=novoP.codigo===o.codigo;
    const cxResto=Math.floor(litrosResto/(novoP.un_cx*novoP.litragem));
    const envResto=Math.max(15,Math.round(o.envase*litrosResto/o.litros/5)*5);
    /* a OC atual encolhe para o que fica */
    o.litros=litrosFica;
    o.envase=Math.max(15,Math.round(o.envase*litrosFica/(litrosFica+litrosResto)/5)*5);
    registrar(o,'OC dividida',null,
      `${nf(fica)} cx aqui · ${nf(cxResto)} cx em ${nomeCurto(novoP.codigo)} · ${obs}`);
    const n=ordem({tanque:o.tanque,codigo:novoP.codigo,maq:M('dMq').value,litros:litrosResto,
      data:M('dDt').value,inicio:M('dHr').value?hm(M('dHr').value):o.inicio,
      setup:mesmoFormato?0:SETUP_PADRAO,envase:envResto,lote:o.lote,origem:o.id});
    registrar(n,'Vem de divisão',null,
      `${nf(litrosResto)} L do ${o.tanque||'tanque'} · vem de ${nomeCurto(o.codigo)} · ${obs}`);
    S.sel=n.id;fecharModal();render();
    toast(`Dividida · ${nf(fica)} cx aqui e ${nf(cxResto)} cx em ${nomeCurto(novoP.codigo)}.`);
  };
  M('mask').classList.add('on');
}

/* ---------- interromper: fecha o feito e deixa saldo ---------- */
function interromper(o){
  const prev=caixasPrev(o),lcx=litrosCx(o);
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Interromper OC';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert blue">Use quando a máquina precisa sair para outro produto.
      O que foi envasado fecha como produzido e <b>o restante fica no ${o.tanque||'tanque'}</b>,
      podendo ser envasado depois em qualquer formato deste produto — sem contar como perda.</div>
    <div class="g2">
      <div class="fld"><label>Início real <b>*</b></label>
        <input type="time" id="iIni" step="300" value="${o.iniReal||hhmm(o.inicio)}"></div>
      <div class="fld"><label>Fim real <b>*</b></label>
        <input type="time" id="iFim" step="300" value="${o.fimReal||relogio()}"></div>
    </div>
    <div class="fld"><label>Caixas envasadas <b>*</b></label>
      <input type="number" id="iCx" min="0" max="${prev-1}" step="1" value="${o.caixas??0}">
      <div class="hint" style="font-size:11px;color:var(--ink3);margin-top:4px">
        OC atual: ${nf(prev)} caixas · ${nf(o.litros)} L.</div></div>
    <div class="calc" id="iCalc"></div>
    <div class="fld"><label>Motivo <b>*</b></label>
      <textarea id="iObs" placeholder="Ex.: entrou pedido urgente, máquina lavada"></textarea></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="iC">Voltar</button>
    <button class="btn pri" id="iK">Interromper e gerar saldo</button>`;
  M('iC').onclick=()=>abrirOrdem(o);
  const upd=()=>{
    const feito=+M('iCx').value||0,resta=prev-feito;
    M('iCalc').innerHTML= resta<=0
      ? '<span style="color:var(--run);font-weight:600">Nada sobrou — use Concluir.</span>'
      : `Esta OC fecha com <b>${nf(feito)} caixas</b>.<br>
         Ficam <b>${nf(resta*lcx)} L</b> de ${prodOf(o.codigo).tanque} no ${o.tanque||'tanque'}
         — dá para ${nf(resta)} cx neste formato, ou outro formato do mesmo produto.`;
  };
  M('iCx').addEventListener('input',upd);upd();
  M('iK').onclick=()=>{
    const feito=+M('iCx').value||0,resta=prev-feito;
    const i=M('iIni').value,f=M('iFim').value;
    if(!i||!f){toast('Informe início e fim reais.',true);return;}
    if(resta<=0){toast('Nada sobrou — use Concluir.',true);return;}
    const motivo=M('iObs').value.trim();
    if(!motivo){toast('Escreva o motivo.',true);M('iObs').focus();return;}
    const envTotal=o.envase,fr=prev?feito/prev:0,litrosSobra=resta*lcx;
    o.litros=feito*lcx;o.caixas=feito;o.iniReal=i;o.fimReal=f;
    o.envase=Math.max(5,Math.round(envTotal*fr/5)*5);o.status='concluida';
    registrar(o,'OC interrompida',null,`${i}–${f} · ${nf(feito)} cx · ${motivo}`);
    if(o.tanque){
      /* o que sobrou volta ao tanque como litros do granel, não como caixas de um formato */
      const pr=prodOf(o.codigo);
      const sd=saldo({tanque:o.tanque,volume:litrosSobra,produto:pr.tanque,grupo:pr.grupo,
        data:o.data,obs:motivo,interrompidoEm:`${dCurto(o.data)} ${f}`,origem:o.id});
      registrar(o,'Saldo devolvido ao tanque',null,
        `${nf(litrosSobra)} L de ${pr.tanque} no ${o.tanque||'tanque'}`);
      fecharModal();S.page='tanques';S.refTq=new Date(o.data+'T00:00:00');render();
      toast(`${nf(litrosSobra)} L de ${pr.tanque} ficaram no ${o.tanque||'tanque'}.`);
    }else{
      const n=ordem({tanque:null,codigo:o.codigo,maq:o.maq,litros:litrosSobra,data:o.data,
        inicio:null,setup:SETUP_PADRAO,envase:Math.max(15,Math.round(envTotal*(1-fr)/5)*5),
        lote:o.lote,status:'pendente',origem:o.id});
      registrar(n,'Saldo criado por interrupção',null,`${nf(resta)} cx · ${nf(litrosSobra)} L`);
      S.sel=n.id;fecharModal();render();
      toast(`Saldo de ${nf(resta)} cx criado. Reprograme quando a máquina liberar.`);
    }
  };
  M('mask').classList.add('on');
}

/* ---------- fila de saldos ---------- */

  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Saldos a reprogramar';
  M('mSub').textContent='Produção interrompida que ainda precisa voltar para a máquina.';
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=l.length?l.map(x=>`
    <div data-sal="${x.id}" style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;
      margin-bottom:11px;cursor:pointer">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
        <b style="flex:1;font-size:13.5px">${nomeCurto(x.codigo)}</b>
        <span class="stq pendente">${nf(caixasPrev(x))} cx</span></div>
      <p style="font-size:12px;color:var(--ink2);line-height:1.55">${x.tanque||'Sem tanque'} · ${nf(x.litros)} L ·
        interrompida em ${dCurto(x.data)} na ${x.maq}</p></div>`).join('')

/* ---------- concluir ---------- */
function concluir(o){
  const prev=caixasPrev(o);
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Concluir envase';
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq} ${o.lote?` · lote ${o.lote}`:''}`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert blue">Ao concluir, a OC fica acinzentada no calendário e o
      <b>lote do ${o.tanque||'tanque'} é concluído junto</b>.</div>
    <div class="calc" style="margin-bottom:13px">
      ${o.setup?`Setup <b>${o.iniReal||'--:--'}–${o.setupFim||'--:--'}</b>${badge(dvSetup(o))}<br>`:''}
      Envase <b>${iniEnvase(o)||'--:--'}–${o.fimReal||'--:--'}</b>${badge(dvEnvase(o))}
    </div>

    ${!o.fimReal?`<div class="fld"><label>Fim do envase <b>*</b></label>
      <input type="time" id="cFim" step="300" value="${relogio()}">
      <div class="hint" style="font-size:11px;color:var(--ink3);margin-top:4px">
        Envase começou às ${iniEnvase(o)||'--:--'} · previsto terminar ${hhmm(fimPrev(o))}.</div></div>`:''}
    <div class="fld"><label>Caixas produzidas <b>*</b></label>
      <input type="number" id="cCx" min="0" step="1" value="${o.caixas!=null?o.caixas:prev}">
      <div class="hint" style="font-size:11px;color:var(--ink3);margin-top:4px">
        Projetado: ${nf(prev)} caixas · ${nf(o.litros)} L · ${litrosCx(o)} L por caixa.
        A diferença entra como quebra no relatório.</div></div>
    <div class="calc" id="cCalc"></div>
    <div class="fld"><label>Observação</label>
      <textarea id="cObs" placeholder="O que precisa ficar registrado"></textarea></div>`;
  M('mB').insertAdjacentHTML('beforeend','<div id="cMot"></div>');
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="cC">Voltar</button>
    <button class="btn blue" id="cK">Concluir OC</button>`;
  M('cC').onclick=()=>abrirOrdem(o);
  const seg=seguintes(o);
  const upd=()=>{
    const i=o.iniReal,f=o.fimReal||(M('cFim')?M('cFim').value:''),cx=+M('cCx').value||0;
    const t=(i&&f)?Math.max(0,hm(f)-hm(i)):null,dur=total(o),d=prev-cx;
    let h='';
    if(t!=null)h+=`Tempo de produção <b>${t} min</b> · previsto ${dur} min · `+
      (t>dur?`<span class="w">${t-dur} min acima</span>`:t<dur?`<span style="color:var(--run)">${dur-t} min abaixo</span>`:'no previsto')+`.<br>`;
    h+= d>0?`Faltaram <b>${nf(d)} caixas</b> — ${nf(d*litrosCx(o))} L (${nf1(d/prev*100)}%).<br>`
      : d<0?`<span style="color:var(--run)">Acima do previsto em <b>${nf(-d)} caixas</b>.</span><br>`
      : `<span style="color:var(--run)">Atendeu o previsto por completo.</span><br>`;
    const delta=f?hm(f)-fimPrev(o):0;
    if(seg.length&&delta!==0)
      h+=`<b>${seg.length}</b> OC${seg.length>1?'s':''} seguinte${seg.length>1?'s':''} na ${o.maq}
          ${delta>0?`vai${seg.length>1?'o':''} <b>${delta} min para frente</b>`
                   :`volta${seg.length>1?'m':''} <b>${-delta} min para trás</b>`}.`;
    else if(seg.length)h+=`As ${seg.length} OCs seguintes ficam no horário.`;
    M('cCalc').innerHTML=h;
  };
  /* motivos: só aparecem quando o desvio passa da tolerância */
  const escolha={};                       /* etapa -> {ids:Set, principal} */
  Object.entries(motivosOC(o)).forEach(([et,v])=>
    escolha[et]={ids:new Set(v.ids||[]),principal:v.principal||null});
  const desvios=()=>{
    const f=o.fimReal||(M('cFim')?M('cFim').value:'');
    const cx=M('cCx').value===''?null:+M('cCx').value;
    const l=[];
    const ds=dvSetup({...o,fimReal:f});
    if(ds!=null&&ds>TOLERANCIA)l.push({et:'setup',txt:`Setup passou <b>${ds} min</b> da meta`});
    const de=(iniEnvase(o)&&f)?Math.max(0,hm(f)-hm(iniEnvase(o)))-o.envase:null;
    if(de!=null&&de>TOLERANCIA)l.push({et:'envase',txt:`Envase passou <b>${de} min</b> da meta`});
    if(cx!=null){
      const perdidos=o.litros-cx*litrosCx(o);
      if(perdidos>0)l.push({et:'quebra',txt:`Quebra de <b>${nf(perdidos)} L</b> — não fechou o volume do tanque`});
    }
    return l;
  };
  const pintarMotivos=()=>{
    const cx=M('cMot');if(!cx)return;
    const l=desvios();
    if(!l.length){cx.innerHTML='';return;}
    cx.innerHTML=l.map(d=>{
      const e=escolha[d.et]||(escolha[d.et]={ids:new Set(),principal:null});
      const opc=motivosDe(d.et);
      return `<div class="mot ${d.et==='quebra'?'q':''}">
        <div class="motc">${d.txt}<span class="mott">tolerância ${TOLERANCIA} min</span></div>
        <div class="motl">${opc.map(m=>{
          const on=e.ids.has(m.id),pr=e.principal===m.id;
          return `<button type="button" class="motb ${on?'on':''} ${pr?'pr':''}"
            data-et="${d.et}" data-m="${m.id}">${m.nome}${pr?' ★':''}</button>`;}).join('')}</div>
        ${e.ids.size>1?`<div class="motp">★ é o motivo principal — é ele que carrega
          ${d.et==='quebra'?'os litros':'os minutos'} no relatório. Clique de novo para trocar.</div>`:''}
      </div>`;}).join('');
    cx.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
      const e=escolha[b.dataset.et],id=b.dataset.m;
      if(!e.ids.has(id)){e.ids.add(id);if(!e.principal)e.principal=id;}
      else if(e.principal!==id&&e.ids.size>1)e.principal=id;   /* já marcado: vira principal */
      else {e.ids.delete(id);if(e.principal===id)e.principal=[...e.ids][0]||null;}
      pintarMotivos();
    });
  };
  const atualizar=()=>{upd();pintarMotivos();};
  ['cCx','cFim'].forEach(i=>M(i)&&M(i).addEventListener('input',atualizar));atualizar();
  M('cK').onclick=()=>{
    const cx=M('cCx').value;
    const i=o.iniReal,sf=o.setupFim,ei=iniEnvase(o);
    const f=o.fimReal||(M('cFim')?M('cFim').value:'');
    if(!f){toast('Informe o fim do envase.',true);if(M('cFim'))M('cFim').focus();return;}
    if(ei&&hm(f)<hm(ei)){
      toast(`O envase começou às ${ei} — o fim não pode ser antes.`,true);
      if(M('cFim'))M('cFim').focus();return;}
    o.fimReal=f;
    if(cx===''){toast('Informe as caixas atendidas.',true);M('cCx').focus();return;}
    const obs=M('cObs').value.trim();
    /* exige motivo onde houve desvio: é o dado que sustenta o relatório */
    const pend=desvios().filter(d=>!escolha[d.et]||!escolha[d.et].ids.size);
    if(pend.length){
      toast(`Informe o motivo: ${pend.map(p=>p.et==='quebra'?'quebra':p.et).join(', ')}.`,true);
      return;
    }
    o.motivos={};
    const descr=[];
    Object.entries(escolha).forEach(([et,e])=>{
      if(!e.ids.size)return;
      o.motivos[et]={ids:[...e.ids],principal:e.principal};
      const nomes=[...e.ids].map(i=>motivoNome(i)+(i===e.principal?' ★':''));
      descr.push(`${(ETAPAS.find(x=>x[0]===et)||[,et])[1]}: ${nomes.join(', ')}`);
    });
    if(descr.length)registrar(o,'Motivos informados',null,descr.join(' · '));
    const delta=hm(f)-fimPrev(o);
    o.caixas=+cx;o.status='concluida';
    registrar(o,'OC concluída',null,
      `${i}–${f} · ${tempoReal(o)} min · ${nf(+cx)} cx${obs?` · ${obs}`:''}`);
    /* a fila da máquina acompanha o que realmente aconteceu */
    const mudou=recomporERegistrar();
    mudou.forEach(({x,antes,novo})=>registrar(x,'Reajustada pelo realizado',null,
      `${hhmm(antes)} → ${hhmm(novo)} na ${x.maq}`));
    /* o lote do tanque conclui junto quando todo o envase dele terminou */
    const b=batDe(o);
    if(b){
      const ap=APONTA[b.chave]||{};
      const faltam=b.ordens.filter(x=>sit(x)!=='concluida').length;
      APONTA[b.chave]={...ap,
        concluidoEm:faltam===0?relogio():(ap.concluidoEm||''),
        log:[...(ap.log||[]),{t:relogio(),
          e:faltam===0?'Lote concluído':'Envase concluído',
          op:null,m:faltam===0?`Todo o envase do ${b.tanque||'lote'} terminou`
            :`${nomeCurto(o.codigo)} · faltam ${faltam} OC`}]};
    }
    const sobra=prev-(+cx);
    if(sobra>0&&o.tanque){continuar(o,sobra);return;}
    fecharModal();render();
    toast(mudou.length
      ? `OC concluída · ${mudou.length} OC${mudou.length>1?'s':''} reajustada${mudou.length>1?'s':''} em ${delta>0?'+':''}${delta} min.`
      : `OC concluída · ${nf(+cx)} caixas · ${tempoReal(o)} min.`);
  };
  M('mask').classList.add('on');
}

function excluir(o){
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Excluir OC';
  M('mSub').textContent='A OC sai da programação e do lote do tanque.';M('mSub').hidden=false;
  M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="fld"><label>Motivo <b>*</b></label>
      <textarea id="xObs" placeholder="Escreva o motivo"></textarea></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="xC">Voltar</button>
    <button class="btn del" id="xK">Excluir OC</button>`;
  M('xC').onclick=()=>abrirOrdem(o);
  M('xK').onclick=()=>{
    const motivo=M('xObs').value.trim();
    if(!motivo){toast('Escreva o motivo.',true);M('xObs').focus();return;}
    o.status='cancelada';registrar(o,'OC excluída',null,motivo);
    S.sel=null;fecharModal();render();toast('OC excluída.');
  };
  M('mask').classList.add('on');
}

/* ---------- saldo existente no tanque ---------- */

  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent='Saldo no tanque';
  M('mSub').textContent='Produto que já está no tanque, sobra de produção anterior.';
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert blue">Depois de lançar, use <b>Envasar deste saldo</b> no card do tanque
      para criar as OCs que vão puxar dele.</div>
    <div class="g2">
      <div class="fld"><label>Tanque <b>*</b></label>
        <select id="sTq"><option value="">Selecione…</option>
        ${TANQUES.map(t=>`<option value="${t.id}">${t.id} · ${nf(t.cap)} L</option>`).join('')}</select></div>
      <div class="fld"><label>Litros no tanque <b>*</b></label>
        <input type="number" id="sVol" min="1" step="10" placeholder="6600"></div>
    </div>
    <div class="fld"><label>Produto <b>*</b></label>
      <select id="sPr"><option value="">Selecione o produto…</option>
      ${PROD_TANQUE.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
    <div class="g2">
      <div class="fld"><label>Data <b>*</b></label>
        <input type="date" id="sDt" value="${ymd(S.refTq)}"></div>
      <div class="fld"><label>Está no tanque desde</label>
        <input type="time" id="sHr" step="300" value="${relogio()}"></div>
    </div>
    <div class="fld"><label>Observação</label>
      <textarea id="sObs" placeholder="De onde veio esta sobra"></textarea></div>
    <div class="calc" id="sCalc"></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="sC">Cancelar</button>
    <button class="btn pri" id="sK">Lançar saldo</button>`;
  M('sC').onclick=fecharModal;
  const upd=()=>{
    const t=tqOf(M('sTq').value),v=+M('sVol').value||0;
    M('sCalc').innerHTML=!t||!v?'Informe tanque e litros.'
      : v>t.cap?`<span class="w">O ${t.id} comporta ${nf(t.cap)} L.</span>`
      : `${nf(v)} L no ${t.id} · ocupa ${nf1(v/t.cap*100)}% da capacidade.`;
  };
  ['sTq','sVol'].forEach(i=>M(i).addEventListener('input',upd));upd();
  M('sK').onclick=()=>{
    const tq=M('sTq').value,vol=+M('sVol').value||0,pr=M('sPr').value,dt=M('sDt').value;
    if(!tq||!vol||!pr||!dt){toast('Preencha tanque, litros, produto e data.',true);return;}
    if(vol>tqOf(tq).cap){toast(`O ${tq} comporta ${nf(tqOf(tq).cap)} L.`,true);return;}
    saldo({tanque:tq,volume:vol,produto:pr,grupo:grupoDoTanque(pr),data:dt,
      obs:M('sObs').value.trim(),interrompidoEm:`${dCurto(dt)} ${M('sHr').value||relogio()}`});
    S.page='tanques';S.refTq=new Date(dt+'T00:00:00');
    fecharModal();render();toast(`${nf(vol)} L de ${pr} lançados no ${tq}.`);
  };
  M('mask').classList.add('on');
}

      <span class="h">${p.de!=null?`${hhmm(p.de)}–${hhmm(p.ate)}`:'—'}</span>

      <span class="m">${p.min} min</span></div>`).join('')}
    ${lib!=null?`<div class="linf">Envase pode começar às <b>${hhmm(lib)}</b></div>`:''}

function certificadoHTML(b){
  const ens=ensaiosDe(b.produto);
  if(!ens.length)return `<div class="alert">Sem especificação de análise cadastrada para
    <b>${b.produto}</b>.</div>`;
  const esp=especDe(b.produto);
  const r=(b.analise&&b.analise.resultados)||{};
  const a=analiseOk(b);
  const trava=b.status==='concluido'?'disabled':'';
  return `<div class="cert">
    <div class="certh">Certificado de análise
      <span>${b.produto} · ${b.tanque||'sem tanque'}${b.lote?` · lote ${b.lote}`:''}</span></div>
    <table class="certt"><thead><tr>
      <th>Análise</th><th>Especificação</th><th>Resultado</th><th class="n">Situação</th>
    </tr></thead><tbody>
    ${ens.map(([k,rot])=>{
      const s=confereEnsaio(b.produto,k,r[k]);
      const espTxt=QUALI.includes(k)?esp[k]:esp[k].txt;
      return `<tr class="${s==='fora'?'fora':''}">
        <td>${rot}</td>
        <td class="k">${espTxt}</td>
        <td>${QUALI.includes(k)
          ? `<select data-ens="${k}" ${trava}>
              <option value="">—</option>
              <option value="ok" ${r[k]==='ok'?'selected':''}>Conforme</option>
              <option value="fora" ${r[k]==='fora'?'selected':''}>Não conforme</option></select>`
          : `<input type="text" inputmode="decimal" data-ens="${k}" ${trava}
              value="${r[k]!=null?r[k]:''}" placeholder="—">`}</td>
        <td class="n">${s==='ok'?'<span class="pill ok">conforme</span>'

      ?`<div class="certno"><b>Lote não pode ser liberado</b><br>

}

function ligarCertificado(b){
  const grava=()=>{
    const at=APONTA[b.chave]||{};
    const res={};
    M('mB').querySelectorAll('[data-ens]').forEach(e=>{
      if(e.value!=='')res[e.dataset.ens]=e.value;
    });
    const an={...(at.analise||{}),resultados:res,em:relogio(),por:(EU&&EU.nome)||''};
    APONTA[b.chave]={...at,analise:an};
    agendarSalvar();
    /* redesenha o modal para a situação de cada ensaio acompanhar */
    const nova=bateladas(b.data).find(x=>x.chave===b.chave);
    if(nova)abrirLote(nova);
  };
  M('mB').querySelectorAll('[data-ens]').forEach(e=>e.addEventListener('change',grava));
  if(M('certDv'))M('certDv').onclick=()=>modalDesvio(b);
}

/* =====================================================================
   PERDAS POR MOTIVO
   Litro e minuto não se somam num percentual só, então são duas contas.
   O peso vai para o motivo PRINCIPAL; os demais ficam registrados.
   ===================================================================== */
function perdasPorMotivo(l){
  const vazio=()=>({total:0,porMaq:{}});
  const litros=vazio(),minutos=vazio();
  const soma=(acc,maq,id,qt)=>{
    acc.total+=qt;
    const m=acc.porMaq[maq]||(acc.porMaq[maq]={total:0,motivos:{}});
    m.total+=qt; m.motivos[id]=(m.motivos[id]||0)+qt;
  };
  l.forEach(o=>{
    const mt=motivosOC(o);
    if(mt.quebra&&mt.quebra.principal){
      const q=quebraL(o);
      if(q&&q>0)soma(litros,o.maq,mt.quebra.principal,q);
    }
    ['setup','envase'].forEach(et=>{
      if(!mt[et]||!mt[et].principal)return;
      const d=et==='setup'?dvSetup(o):dvEnvase(o);
      if(d!=null&&d>0)soma(minutos,o.maq,mt[et].principal,d);
    });
  });
  return {litros,minutos};
}
function blocoPerdas(acc,titulo,unidade,cor){
  if(!acc.total)return `<div class="perdz">Nenhum motivo registrado no período para ${titulo.toLowerCase()}.</div>`;
  const un=v=>unidade==='L'?nf(v)+' L':(v>=60?`${Math.floor(v/60)}h${p2(Math.round(v%60))}`:Math.round(v)+' min');
  const maqs=Object.entries(acc.porMaq).sort((a,b)=>b[1].total-a[1].total);
  return `<div class="perdb ${cor}">
    <div class="perdh"><span>${titulo}</span><b>${un(acc.total)}</b></div>
    <div class="perdc">${maqs.map(([maq,d])=>`
      <div class="perdm">
        <div class="perdmh"><span>${maq}</span><b>${un(d.total)}</b>
          <i>${nf1(d.total/acc.total*100)}% do total</i></div>
        ${Object.entries(d.motivos).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`
          <div class="perdl"><span>${motivoNome(id)}</span>
            <div class="perdbar"><i style="width:${v/d.total*100}%"></i></div>
            <b>${nf1(v/d.total*100)}% · ${un(v)}</b></div>`).join('')}
      </div>`).join('')}</div></div>`;
}
function gradeRelatorio(){
  const data=ymd(S.refTq);

  const feitas=l.filter(o=>sit(o)==='concluida');
  /* volume manda: é o que o tanque entregou, independente do formato envasado */
  const volPrev=somaL(l,o=>o.litros);
  const volPrevFeitas=somaL(feitas,o=>o.litros);
  const volFeito=somaL(feitas,litrosFeitos);
  const volQuebra=Math.max(0,volPrevFeitas-volFeito);
  /* caixas seguem à vista, mas como detalhe de cada OC, não como total somado */
  const prev=l.reduce((s,o)=>s+caixasPrev(o),0);
  const feito=feitas.reduce((s,o)=>s+(o.caixas||0),0);
  const prevFeitas=feitas.reduce((s,o)=>s+caixasPrev(o),0);
  const formatos=new Set(feitas.map(o=>prodOf(o.codigo).litragem)).size;
  const tempoPrev=l.reduce((s,o)=>s+total(o),0);
  const tempoReal_=feitas.reduce((s,o)=>s+(tempoReal(o)||0),0);
  const tempoPrevFeitas=feitas.reduce((s,o)=>s+total(o),0);
  const dv=tempoReal_-tempoPrevFeitas;
  const comFim=l.filter(o=>o.fimReal);
  const atrasoFim=comFim.reduce((s,o)=>s+Math.max(0,hm(o.fimReal)-fimPrev(o)),0);
  const comAtraso=comFim.filter(o=>hm(o.fimReal)>fimPrev(o)).length;

  M('repgrid').innerHTML=`
    <div class="st">${dLongo(data)}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">OCs do dia</div><div class="v">${l.length}</div>
        <div class="s">${feitas.length} concluídas</div></div>

        <div class="v">${Math.floor(tempoPrev/60)}h ${p2(tempoPrev%60)}</div>
        <div class="s">setup + envase programados</div></div>
      <div class="kpi"><div class="k">Tempo de produção</div>
        <div class="v ok">${Math.floor(tempoReal_/60)}h ${p2(tempoReal_%60)}</div>
        <div class="s">realizado nas concluídas</div></div>
      <div class="kpi"><div class="k">Desvio</div>
        <div class="v ${dv>0?'ruim':dv<0?'ok':''}">${dv>0?'+':''}${dv} min</div>
        <div class="s">real contra previsto</div></div>
      <div class="kpi"><div class="k">Atraso de fim</div>
        <div class="v ${atrasoFim>0?'ruim':''}">${atrasoFim>0?'+':''}${atrasoFim} min</div>
        <div class="s">${comAtraso} OC terminaram depois</div></div>
      <div class="kpi"><div class="k">Volume projetado</div><div class="v">${nf(volPrevFeitas)} L</div>
        <div class="s">tanque nas OCs concluídas</div></div>
      <div class="kpi"><div class="k">Volume produzido</div><div class="v ok">${nf(volFeito)} L</div>
        <div class="s">${volPrevFeitas?nf1(volFeito/volPrevFeitas*100):0}% do projetado${
          formatos>1?` · ${formatos} formatos`:''}</div></div>
      <div class="kpi"><div class="k">Quebra</div>
        <div class="v ${volQuebra?'ruim':''}">${nf(volQuebra)} L</div>
        <div class="s">${volPrevFeitas?nf1(volQuebra/volPrevFeitas*100):0}% do volume projetado</div></div>
    </div>

    <div class="st">Por máquina</div>
    <table><thead><tr><th>Máquina</th><th class="n">OCs</th><th class="n">Concluídas</th>
      <th class="n">Tempo previsto</th><th class="n">Tempo de produção</th><th class="n">Desvio</th>
      <th class="n">Litros projet.</th><th class="n">Litros produz.</th><th class="n">Quebra</th>
      </tr></thead><tbody>
      ${MAQUINAS.map(m=>{
        const q=l.filter(o=>o.maq===m),c=q.filter(o=>sit(o)==='concluida');
        const tp=q.reduce((s,o)=>s+total(o),0);
        const tr=c.reduce((s,o)=>s+(tempoReal(o)||0),0);
        const tpc=c.reduce((s,o)=>s+total(o),0);
        const d=tr-tpc;
        const vp=somaL(c,o=>o.litros),vf=somaL(c,litrosFeitos),vq=Math.max(0,vp-vf);
        return `<tr><td><b>${m}</b></td><td class="n">${q.length}</td><td class="n">${c.length}</td>
          <td class="n">${tp} min</td><td class="n">${tr||'—'} ${tr?'min':''}</td>

    </tbody></table>

    <div class="st">Ordens</div>
    ${l.length?`<table><thead><tr><th>Produto</th><th>Máq</th><th>Lote</th>

          <td class="n">${o.iniReal||'--:--'}–${o.fimReal||'--:--'}</td>
          <td class="n">${t!=null?t+' min':'—'}</td>
          <td class="n">${d!=null?`<span class="pill ${d>15?'mau':d>0?'med':'ok'}">${d>0?'+':''}${d}</span>`:'—'}</td>
          <td class="n">${o.iniReal?(()=>{const x=hm(o.iniReal)-o.inicio;
            return `<span class="pill ${x>15?'mau':x>0?'med':'ok'}">${x>0?'+':''}${x}</span>`;})():'—'}</td>
          <td class="n">${o.fimReal?(()=>{const x=hm(o.fimReal)-fimPrev(o);

          <td class="n">${nf(o.litros)} L<div class="sub2">${nf(cp)} cx de ${fmtLit(prodOf(o.codigo).litragem)}</div></td>
          <td class="n">${vf!=null?`${nf(vf)} L<div class="sub2">${nf(o.caixas)} cx</div>`:'—'}</td>
          <td class="n">${vq!=null?(vq>0?`<span class="pill ${vq/o.litros>.05?'mau':'med'}">${nf(vq)} L</span>`

          <td class="n">${pc!=null?`<span class="pill ${pc>=100?'ok':pc>=95?'med':'mau'}">${nf1(pc)}%</span>`:'—'}</td>

        ${(()=>{const m=o.log.filter(e=>e.m&&/atras|parad|aguard|motivo|Interromp|reabert|Reajust/i.test(e.e+' '+e.m));
          return m.length?`<tr class="mot"><td colspan="14">${m.map(e=>

      <td class="n">${tempoReal_} min</td><td class="n">${dv>0?'+':''}${dv}</td>
      <td colspan="2"></td>
      <td class="n">${nf(volPrev)} L</td><td class="n">${nf(volFeito)} L</td>

    <h3 class="perdt">Por que não batemos a meta</h3>
    ${(()=>{const p=perdasPorMotivo(feitas);
      return blocoPerdas(p.litros,'Litros perdidos','L','vermelho')

}

/* =====================================================================
   PERSISTÊNCIA — guarda o que foi lançado e sobrevive a troca de versão
   ===================================================================== */
const CHAVE='pcp-atrius-v6';
/* espelhamento entre abas: a TV recebe o que a aba de edição grava */
let CANAL=null,RECEBENDO=false;
try{if(typeof BroadcastChannel!=='undefined')CANAL=new BroadcastChannel('pcp-atrius');}catch(e){}
function aplicarRemoto(dados){
  if(!dados)return;
  try{
    RECEBENDO=true;aplicarEstado(dados);ULTIMO=corpoDados();
    if(MODO_TV){S.ref=new Date();S.refTq=new Date();try{renderTV();}catch(e){}}
    render();
    const el=M('salvo');if(el)el.textContent=`atualizado ${relogio()}`;
  }catch(e){console.warn('estado remoto ilegível',e);}
  finally{RECEBENDO=false;}
}
if(CANAL)CANAL.onmessage=ev=>{if(ev.data&&ev.data.tipo==='estado')aplicarRemoto(ev.data.dados);};
try{window.addEventListener('storage',ev=>{
  if(ev.key===CHAVE&&ev.newValue)aplicarRemoto(ev.newValue);});}catch(e){}
let PRONTO=false,tSalvar,ULTIMO='',salvando=false;

function estadoAtual(){
  return JSON.stringify({versao:1,gravado:new Date().toISOString(),
    vendo:ymd(S.page==='envase'?S.ref:S.refTq),
    ordens:ORDENS,aponta:APONTA,saldos:SALDOS,sopro:SOPRO,
    cadastro:{motivos:MOTIVOS,tolerancia:TOLERANCIA,frascos:FRASCOS,sopradoras:SOPRADORAS,tanques:TANQUES,
      jornada:JORNADA,frascoProd:FRASCO_PROD,usuarios:USUARIOS}});
}
function aplicarEstado(txt){
  const d=JSON.parse(txt);
  if(!d||!Array.isArray(d.ordens))throw new Error('arquivo sem ordens');
  ORDENS.length=0;d.ordens.forEach(o=>ORDENS.push({setupFim:'',envIni:'',...o}));
  SALDOS.length=0;(d.saldos||[]).forEach(x=>SALDOS.push(x));
  Object.keys(SOPRO).forEach(k=>delete SOPRO[k]);Object.assign(SOPRO,d.sopro||{});
  const cad=d.cadastro||{};
  /* frascos: casa por id e respeita a ordem gravada (as colunas são reordenáveis) */
  if(cad.motivos&&cad.motivos.length){MOTIVOS.length=0;cad.motivos.forEach(m=>MOTIVOS.push(m));}
  if(cad.tolerancia!=null)TOLERANCIA=+cad.tolerancia||0;
  if(cad.frascos&&cad.frascos.length){
    const sobra=FRASCOS.slice(),ordenados=[];
    cad.frascos.forEach(f=>{
      const k=sobra.findIndex(x=>x.id===f.id);
      if(k>=0){Object.assign(sobra[k],f);ordenados.push(sobra.splice(k,1)[0]);}
    });
    FRASCOS.length=0;ordenados.concat(sobra).forEach(f=>FRASCOS.push(f));
  }
  if(cad.sopradoras)cad.sopradoras.forEach((m,i)=>{if(SOPRADORAS[i])Object.assign(SOPRADORAS[i],m);});
  if(cad.tanques)cad.tanques.forEach((t,i)=>{if(TANQUES[i])Object.assign(TANQUES[i],t);});
  if(cad.jornada)Object.assign(JORNADA,cad.jornada);
  if(cad.usuarios&&cad.usuarios.length){
    USUARIOS.length=0;cad.usuarios.forEach(u=>USUARIOS.push(u));
    if(EU)EU=USUARIOS.find(u=>u.id===EU.id)||USUARIOS[0];
  }
  if(cad.frascoProd){Object.keys(FRASCO_PROD).forEach(k=>delete FRASCO_PROD[k]);
    Object.assign(FRASCO_PROD,cad.frascoProd);}
  Object.keys(APONTA).forEach(k=>delete APONTA[k]);
  Object.assign(APONTA,d.aponta||{});
  return d;
}
function corpoDados(){
  /* só o que é dado; a data de gravação fica de fora para poder comparar */
  return JSON.stringify({ordens:ORDENS,aponta:APONTA,saldos:SALDOS,sopro:SOPRO,
    frascos:FRASCOS,sopradoras:SOPRADORAS,tanques:TANQUES,jornada:JORNADA,
    frascoProd:FRASCO_PROD,usuarios:USUARIOS});
}
async function persistir(forcar){
  if(!PRONTO||salvando||RECEBENDO||MODO_TV)return;
  const corpo=corpoDados();
  if(!forcar&&corpo===ULTIMO)return;          // nada mudou, não gasta gravação
  salvando=true;
  const dados=estadoAtual();
  let okLocal=false,okNuvem=false,erro='',conflito=false;
  /* cópia local sempre, para não perder nada se a internet cair */
  try{if(typeof localStorage!=='undefined'){localStorage.setItem(CHAVE,dados);okLocal=true;}}catch(e){}
  const queriaNuvem=ONLINE;
  if(ONLINE){
    try{
      const r=await nuvemGravar(dados);
      if(r.conflito)conflito=true; else okNuvem=true;
    }catch(e){erro=e.message||'banco';ONLINE=false;}
  }
  const ok=okNuvem||(!queriaNuvem&&okLocal);
  salvando=false;
  if(ok){ULTIMO=corpo;try{if(CANAL)CANAL.postMessage({tipo:'estado',dados});}catch(e){}}
  if(conflito){
    /* ninguém perde trabalho em silêncio: avisa e recarrega o que está no banco */
    toast('Outra pessoa gravou antes de você. Recarregando o que está no banco.',true);
    await conferirNuvem();
    marcarEstado('recarregado do banco — confira e lance de novo',true);
    return;
  }
  const el=M('salvo');
  if(!el)return;
  /* três situações diferentes, três avisos diferentes:
     gravou no banco · o banco caiu mas o navegador guardou · não gravou em lugar nenhum */
  if(okNuvem){
    el.textContent=`salvo no banco ${relogio()} · ${ORDENS.length} OC`;
    el.style.color='';el.style.background='';
    el.title='Gravado no banco';
  }else if(okLocal){
    el.textContent=queriaNuvem
      ?`sem conexão · guardado neste navegador ${relogio()}`
      :`salvo neste navegador ${relogio()} · ${ORDENS.length} OC`;
    el.style.color=queriaNuvem?'#7A4A00':'';
    el.style.background=queriaNuvem?'#FDF1E3':'';
    el.title=queriaNuvem
      ?'O banco não respondeu ('+erro+'). Nada foi perdido: assim que voltar, sincroniza.'
      :'Gravado neste navegador';
  }else{
    el.textContent='NÃO SALVOU — baixe os dados';
    el.style.color='#fff';el.style.background='var(--danger)';
    el.title='Falha: '+erro;
  }
}
const agendarSalvar=()=>{clearTimeout(tSalvar);tSalvar=setTimeout(()=>persistir(),600);};

const SUPA={

/* ---------- login ---------- */
async function autenticar(email,senha){
  const r=await fetch(`${SUPA.url}/auth/v1/token?grant_type=password`,{
    method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:senha})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'e-mail ou senha inválidos');
  SESSAO=d;
  try{localStorage.setItem(SUPA_SESSAO,JSON.stringify(d));}catch(e){}
  return d;
}
async function renovarSessao(){
  if(!SESSAO||!SESSAO.refresh_token)return false;
  try{
    const r=await fetch(`${SUPA.url}/auth/v1/token?grant_type=refresh_token`,{
      method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:SESSAO.refresh_token})});
    if(!r.ok)return false;
    SESSAO=await r.json();
    try{localStorage.setItem(SUPA_SESSAO,JSON.stringify(SESSAO));}catch(e){}
    return true;
  }catch(e){return false;}
}
function sair(){
  SESSAO=null;
  try{localStorage.removeItem(SUPA_SESSAO);}catch(e){}
  location.reload();
}
const emailDaSessao=()=>(SESSAO&&SESSAO.user&&SESSAO.user.email)||'';

/* ---------- leitura e gravação ---------- */
async function nuvemLer(){
  const r=await fetch(
    `${SUPA.url}/rest/v1/pcp_estado?id=eq.${SUPA.linha}&select=dados,versao,atualizado_em,atualizado_por`,
    {headers:cabecalhos()});
  if(r.status===401){ if(await renovarSessao())return nuvemLer(); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('leitura falhou ('+r.status+')');
  const l=await r.json();
  return l[0]||null;
}
async function nuvemVersao(){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_estado?id=eq.${SUPA.linha}&select=versao`,
    {headers:cabecalhos()});
  if(!r.ok)return null;
  const l=await r.json();
  return l[0]?l[0].versao:null;
}
/* Grava só se a versão ainda for a que lemos. Se outra pessoa gravou
   nesse meio tempo, o banco não altera nada e devolve lista vazia. */
async function nuvemGravar(texto){
  const corpo={dados:JSON.parse(texto),versao:VERSAO_NUVEM+1,
    atualizado_em:new Date().toISOString(),atualizado_por:emailDaSessao()};
  const r=await fetch(
    `${SUPA.url}/rest/v1/pcp_estado?id=eq.${SUPA.linha}&versao=eq.${VERSAO_NUVEM}`,
    {method:'PATCH',headers:cabecalhos({'Prefer':'return=representation'}),
     body:JSON.stringify(corpo)});
  if(r.status===401){ if(await renovarSessao())return nuvemGravar(texto); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('gravação falhou ('+r.status+')');
  const l=await r.json();
  if(!l.length)return {conflito:true};
  VERSAO_NUVEM=l[0].versao;
  return {conflito:false,versao:l[0].versao};
}

/* ---------- alguém mexeu? ---------- */
async function conferirNuvem(){
  if(!ONLINE)return;
  try{
    const v=await nuvemVersao();
    if(v==null||v===VERSAO_NUVEM)return;
    const linha=await nuvemLer();
    if(!linha)return;
    VERSAO_NUVEM=linha.versao;
    aplicarRemoto(JSON.stringify(linha.dados));
    const el=M('salvo');
    if(el&&!MODO_TV)el.textContent=`atualizado por ${(linha.atualizado_por||'outro usuário').split('@')[0]} · ${relogio()}`;
  }catch(e){}
}

/* =====================================================================
   ACESSOS — cadastro das pessoas dentro do sistema
   Ter conta e ter acesso são coisas diferentes: a conta é criada aqui,
   mas quem libera é a lista no banco, conferida pelo servidor.
   ===================================================================== */
let ACESSOS=[], MEU_ACESSO=null;
const souMaster=()=>!!(MEU_ACESSO&&MEU_ACESSO.master);

/* senha legível, sem caracteres que se confundem (0/O, 1/l/I) */
function gerarSenha(){
  const letras='abcdefghjkmnpqrstuvwxyz',num='23456789';
  let s='';
  for(let i=0;i<6;i++)s+=letras[Math.floor(Math.random()*letras.length)];
  for(let i=0;i<3;i++)s+=num[Math.floor(Math.random()*num.length)];
  return s;
}

async function lerAcessos(){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso?select=*&order=nome`,{headers:cabecalhos()});
  if(r.status===401){ if(await renovarSessao())return lerAcessos(); throw new Error('sessão expirada'); }
  if(!r.ok)throw new Error('não consegui ler os acessos ('+r.status+')');
  ACESSOS=await r.json();
  const meu=emailDaSessao().toLowerCase();
  MEU_ACESSO=ACESSOS.find(a=>a.email===meu)||null;
  return ACESSOS;
}
async function gravarAcesso(linha,novo,email){
  const alvo=email||linha.email;
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso`+(novo?'':`?email=eq.${encodeURIComponent(alvo)}`),{
    method:novo?'POST':'PATCH',
    headers:cabecalhos({'Prefer':'return=representation'}),
    body:JSON.stringify(novo?[linha]:linha)});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&(d.message||d.hint))||'falha ao gravar ('+r.status+')');
  return d;
}
async function apagarAcesso(email){
  const r=await fetch(`${SUPA.url}/rest/v1/pcp_acesso?email=eq.${encodeURIComponent(email)}`,
    {method:'DELETE',headers:cabecalhos()});
  if(!r.ok)throw new Error('falha ao excluir ('+r.status+')');
}

/* cria a conta no banco sem derrubar a sessão de quem está cadastrando */
async function criarConta(email,senha){
  const guardada=SESSAO;
  const r=await fetch(`${SUPA.url}/auth/v1/signup`,{
    method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:senha})});
  const d=await r.json().catch(()=>({}));
  SESSAO=guardada;                       /* o signup devolve sessão nova: descarta */
  try{localStorage.setItem(SUPA_SESSAO,JSON.stringify(guardada));}catch(e){}
  if(!r.ok){
    const m=(d.msg||d.message||d.error_description||'').toLowerCase();
    if(m.indexOf('already')>=0||m.indexOf('registered')>=0)
      return {jaExistia:true};
    throw new Error(d.msg||d.message||d.error_description||'não consegui criar a conta');
  }
  return {jaExistia:false};
}

    <button class="btn" id="axC">Voltar</button>

  M('mask').classList.add('on');
}

/* ---------- arranque ---------- */
async function iniciarComNuvem(){
  let linha=null;
  try{ linha=await nuvemLer(); }
  catch(e){
    if(String(e.message).indexOf('sessão')>=0){telaLogin('Sua sessão expirou. Entre de novo.');return;}
    ONLINE=false;
    await restaurarLocal();
    marcarEstado('sem conexão com o banco — trabalhando neste navegador',true);
    return;
  }
  ONLINE=true;
  VERSAO_NUVEM=linha?linha.versao:0;
  const vazio=!linha||!linha.dados||!linha.dados.ordens;
  if(vazio){
    /* primeira vez: sobe o que já existe neste navegador */
    await restaurarLocal();
    PRONTO=true;
    try{ await nuvemGravar(estadoAtual()); marcarEstado(`primeira carga enviada · ${ORDENS.length} OC`); }
    catch(e){ marcarEstado('não consegui enviar a primeira carga',true); }
  }else{
    try{
      const d=aplicarEstado(JSON.stringify(linha.dados));
      if(d.vendo){S.ref=new Date(d.vendo+'T00:00:00');S.refTq=new Date(d.vendo+'T00:00:00');}
    }catch(e){}
    PRONTO=true;ULTIMO=corpoDados();
    marcarEstado(`${ORDENS.length} OC · ${SALDOS.length} saldo · online`);
  }
  render();
  if(MODO_TV){try{renderTV();}catch(e){}}else{irParaAgora();}
  ligarPolling();
  const q=M('quem');
  if(q&&emailDaSessao()){const b=q.querySelector('b');if(b)b.textContent=emailDaSessao().split('@')[0];}
}
function marcarEstado(txt,ruim){
  const el=M('salvo');if(!el)return;
  el.textContent=txt;
  el.style.color=ruim?'#fff':'';
  el.style.background=ruim?'var(--danger)':'';
}


async function restaurarLocal(){
  let dados=null;
  try{if(typeof window!=='undefined'&&window.storage){const r=await window.storage.get(CHAVE);if(r&&r.value)dados=r.value;}}catch(e){}
  if(!dados){try{if(typeof localStorage!=='undefined')dados=localStorage.getItem(CHAVE);}catch(e){}}
  if(dados){try{
    const d=aplicarEstado(dados);
    if(d.vendo){S.ref=new Date(d.vendo+'T00:00:00');S.refTq=new Date(d.vendo+'T00:00:00');}
  }catch(e){console.warn('dados anteriores ilegíveis',e);}}
  PRONTO=true;ULTIMO=corpoDados();
}
async function restaurar(){
  if(temNuvem()){
    if(!SESSAO){telaLogin('');return;}
    await iniciarComNuvem();
    return;
  }
  await restaurarLocal();
  render();irParaAgora();
  marcarEstado(ORDENS.length||SALDOS.length
    ?`${ORDENS.length} OC · ${SALDOS.length} saldo carregados`:'pronto para lançar');
}

function baixarDados(){
  const nome=`pcp-atrius-dados-${ymd(new Date())}.json`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([estadoAtual()],{type:'application/json'}));
  a.download=nome;a.click();URL.revokeObjectURL(a.href);
  toast(`${nome} baixado · ${ORDENS.length} OC.`);
}
function abrirDados(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=aplicarEstado(r.result);
      persistir(true);render();
      toast(`${ORDENS.length} OC carregadas${d.gravado?` · arquivo de ${dCurto(d.gravado.slice(0,10))}`:''}.`);
    }catch(e){toast('Arquivo inválido: '+e.message,true);}
  };
  r.readAsText(file);
}
