/* =====================================================================
   PAINEL DA TV — tela própria, não a grade de edição aumentada.
   Regras: o card grande só nasce quando o operador iniciou a produção;
   atrasada é passar do fim previsto, não da hora de começar;
   concluídas descem para o fim da fila; nada de sopro aqui.
   ===================================================================== */
const SIT_TV={
  producao:{cor:'#127A41',rot:'Em produção'},
  atrasada:{cor:'#C62230',rot:'Atrasada'},
  parada:{cor:'#98A1AE',rot:'Sem ordem iniciada'}
};
/* data de fabricação leva o ano: é o que vai no rótulo do frasco */
const dFab=s=>new Date(s+'T00:00:00')
  .toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const escTV=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const celTV=(cls,lb,vl)=>`<div class="dcel ${cls}"><div class="lb">${lb}</div><div class="vl">${vl}</div></div>`;

/* diferença em h:mm, para a faixa colorida */
function hmm(min){
  const m=Math.max(0,Math.round(min));
  return m>=60?`${Math.floor(m/60)}h${p2(m%60)}`:`${m}min`;
}

/* o que a máquina está fazendo agora, do ponto de vista da TV */
function estadoMaquina(maq,data){
  const doDia=ORDENS.filter(o=>o.maq===maq&&o.data===data&&naGrade(o))
    .sort((a,b)=>a.inicio-b.inicio);
  /* em produção = envase iniciado e ainda não encerrado */
  const rodando=doDia.find(o=>sit(o)==='producao');
  const agora=agoraMin();
  if(rodando){
    const fim=fimPrev(rodando);
    return {sit:agora>fim?'atrasada':'producao',oc:rodando,
      delta:agora>fim?`+${hmm(agora-fim)}`:`faltam ${hmm(fim-agora)}`,
      fila:doDia.filter(o=>o.id!==rodando.id)};
  }
  const prox=doDia.find(o=>sit(o)!=='concluida'&&sit(o)!=='finalizado');
  return {sit:'parada',proxima:prox?hhmm(prox.inicio):null,fila:doDia};
}

function blocoAgoraTV(m){
  const s=SIT_TV[m.sit],o=m.oc,p=prodOf(o.codigo);
  return `<div class="tvagora">
    <div class="tvabar"><span class="t">${escTV(s.rot)}</span><span class="d">${escTV(m.delta)}</span></div>
    <div class="tvabody">
      <div class="tvprod">${escTV(p.descricao)}</div>
      <div class="dest">
        ${celTV('d2','Máquina',escTV(o.maq))}
        ${celTV('d2','Lote',`<span class="num">${escTV(o.lote||'—')}</span>`)}
        ${celTV('d2','Fabricação',`<span class="num">${escTV(dFab(o.data))}</span>`)}
        ${celTV('d3','Puxar do tanque',
          `${escTV(o.tanque||'—')} <span class="lt">· ${nf(o.litros)} L</span>`)}
        ${celTV('d3','Qtde prevista',`<span class="num">${nf(caixasPrev(o))} cx</span>`)}
      </div>
      <div class="tempos">
        <div class="tcx prev"><div class="lb">Previsto</div>
          <div class="vl">${hhmm(o.inicio)} – ${hhmm(fimPrev(o))}</div></div>
        <div class="tcx real"><div class="lb">Realizado</div>
          <div class="vl">${escTV(iniEnvase(o)||o.iniReal)} – ${
            o.fimReal?escTV(o.fimReal):'<span class="curso">em curso</span>'}</div></div>
      </div>
    </div>
  </div>`;
}

const blocoParadaTV=m=>`<div class="tvparada">
  <div class="t">Nenhuma ordem iniciada</div>
  <div class="s">${m.proxima?`A próxima começa às <b>${escTV(m.proxima)}</b>`
    :'Sem programação para hoje'}</div></div>`;

function colunaTV(maq,data){
  const m=estadoMaquina(maq,data),s=SIT_TV[m.sit];
  const fechadas=m.fila.filter(o=>sit(o)==='concluida');
  const abertas=m.fila.filter(o=>sit(o)!=='concluida');
  const cont=[`${abertas.length} próximo${abertas.length===1?'':'s'} na fila`];
  if(fechadas.length)cont.push(`${fechadas.length} concluída${fechadas.length>1?'s':''}`);
  const linha=o=>{
    const p=prodOf(o.codigo),fim=sit(o)==='concluida';
    return `<div class="tvoc ${fim?'fim':''}" style="--fam:${fim?'#98A1AE':CORES[p.grupo]}">
      <div class="n">${escTV(p.descricao)}${fim?'<span class="selo">Concluída</span>':''}</div>
      <div class="m">Lote ${escTV(o.lote||'—')} · <b>${escTV(o.tanque||'—')}</b> ·
        <b>${nf(o.litros)} L</b> · ${nf(caixasPrev(o))} cx ·
        previsto <span class="hr">${hhmm(o.inicio)}–${hhmm(fimPrev(o))}</span></div>
    </div>`;
  };
  return `<section class="tvmaq" style="--sit:${s.cor}">
    <div class="tvmh"><b>${escTV(maq)}</b><span class="tvtag">${escTV(s.rot)}</span></div>
    ${m.sit==='parada'?blocoParadaTV(m):blocoAgoraTV(m)}
    <div class="tvfilah"><span>${escTV(cont.join(' · '))}</span><hr></div>
    <div class="tvfila">
      ${abertas.concat(fechadas).map(linha).join('')
        ||'<div class="tvvazio">Sem ordens para hoje.</div>'}
      <div class="mais" hidden></div>
    </div>
  </section>`;
}

/* Na TV ninguém rola a tela: o que não couber sai do fim e vira contagem.
   Como as concluídas já estão no fim, são as primeiras a sair. */
function coubeNaTela(){
  document.querySelectorAll('.tvmaq').forEach(sec=>{
    const fila=sec.querySelector('.tvfila');if(!fila)return;
    const mais=fila.querySelector('.mais');if(!mais)return;
    const itens=[].slice.call(fila.querySelectorAll('.tvoc'));
    itens.forEach(o=>{o.hidden=false});
    mais.hidden=true;
    let fora=0;
    for(let k=itens.length-1;k>=0;k--){
      if(fila.scrollHeight<=fila.clientHeight+1)break;
      itens[k].hidden=true;fora++;
      mais.hidden=false;
      mais.textContent=fora>1?`mais ${fora} ordens abaixo`:'mais 1 ordem abaixo';
    }
  });
}

function renderTV(){
  const d=new Date(),data=ymd(d);

  M('tvhoje').textContent=dLongo(data);
  M('tvgrid').innerHTML=MAQUINAS.map(m=>colunaTV(m,data)).join('');
  coubeNaTela();
}

/* =====================================================================
   ERRO À VISTA — sem isto, uma falha some no console e a tela só "não faz nada"
   ===================================================================== */
const ERROS=[];
function mostrarErro(msg,onde){
  const txt=`${msg}${onde?`  (${onde})`:''}`;
  if(ERROS.includes(txt))return;                 /* não repete o mesmo */
  ERROS.push(txt);
  let cx=M('errbox');
  if(!cx){
    cx=document.createElement('div');cx.id='errbox';
    cx.innerHTML=`<div class="errh"><b>Falha no sistema</b>
      <button id="errX" title="Fechar">✕</button></div><div id="errL"></div>
      <div class="errp">Baixe os dados antes de recarregar. Mande este texto para o desenvolvedor.</div>`;
    document.body.appendChild(cx);
    const x=M('errX');if(x)x.onclick=()=>{cx.remove();ERROS.length=0;};
  }
  const l=M('errL');
  if(l)l.innerHTML=ERROS.map(e=>`<div class="erri">${e.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>`).join('');
}
try{
  window.addEventListener('error',ev=>{
    mostrarErro(ev.message||'erro desconhecido',
      ev.filename?`linha ${ev.lineno}, coluna ${ev.colno}`:'');
  });
  window.addEventListener('unhandledrejection',ev=>{
    const r=ev.reason;
    mostrarErro((r&&r.message)||String(r)||'promessa rejeitada','assíncrono');
  });
}catch(e){}
