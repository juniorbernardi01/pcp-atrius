    alvo.nome=M('mqNome').value.trim();
    alvo.ativo=M('mqAtivo').value==='1';
    if(g.jornada){alvo.ini=M('mqIni').value||'05:00';alvo.fim=M('mqFim').value||'20:00';
      alvo.pausas=pausas.filter(p=>p.de&&p.ate&&hm(p.ate)>hm(p.de));}
    if(g.cadencia)alvo.cad=Math.max(0,+M('mqCad').value||0);
    if(g.capacidade){alvo.cap=Math.max(0,+M('mqCap').value||0);
      alvo.ench=Math.max(0,+M('mqEnch').value||0);}
    if(novo)RECURSOS.push(alvo);
    sincronizarRecursos();agendarSalvar();fecharModal();recomporTudo();render();
    toast(novo?`${id} cadastrada.`:`${id} atualizada.`);
  };
  abrirMask();
}

function excluirMaquina(id){
  const r=RECURSOS.find(x=>x.id===id);if(!r)return;
  const g=grupoDe(r.grupo);
  /* o que já foi programado nesta máquina não pode virar órfão */
  const usos=g.id==='tanque'?ORDENS.filter(o=>o.tanque===id&&naGrade(o)).length
    :g.id==='envase'?ORDENS.filter(o=>o.maq===id&&naGrade(o)).length:0;
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('mTit').textContent='Excluir máquina';M('mSub').hidden=true;
  M('mB').innerHTML=`<div class="alert">
    <b>${r.id}${r.nome?` · ${r.nome}`:''}</b> sai do cadastro.
    ${usos?`<br><br><b>${usos} OP${usos>1?'s usam':' usa'}</b> esta máquina. Excluir deixaria
      essas ordens sem destino — marque como <b>inativa</b>, que ela some da programação
      sem apagar o que já existe.`:''}</div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="mdC">Voltar</button>
    ${usos?'':'<button class="btn del" id="mdK">Excluir</button>'}</div>`;
  M('mdC').onclick=fecharModal;
  if(M('mdK'))M('mdK').onclick=()=>{
    const i=RECURSOS.findIndex(x=>x.id===id);if(i>=0)RECURSOS.splice(i,1);
    sincronizarRecursos();agendarSalvar();fecharModal();recomporTudo();render();
    toast(`${id} excluída.`);
  };
  abrirMask();
}

function modalGrupo(){
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('modal').classList.remove('wide');

      <div class="motl">
        <button type="button" class="motb on" data-cp="jornada">Turno</button>
        <button type="button" class="motb" data-cp="cadencia">Produtividade</button>
        <button type="button" class="motb" data-cp="capacidade">Capacidade</button>
      </div></div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="grC">Fechar</button>
    <button class="btn pri" id="grK">Cadastrar</button></div>`;
  const sel=new Set(['jornada']);
  M('mB').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{
    const c=b.dataset.cp;
    if(sel.has(c)){sel.delete(c);b.classList.remove('on');}

    if(M('grUnf'))M('grUnf').hidden=!sel.has('cadencia');});
  M('grC').onclick=fecharModal;
  M('grK').onclick=()=>{
    const nome=M('grNome').value.trim();
    if(!nome){toast('Informe o nome do grupo.',true);return;}
    const id='g'+Date.now().toString(36);
    GRUPOS_MAQ.push({id:id,nome:nome,jornada:sel.has('jornada'),
      cadencia:sel.has('cadencia'),un:(M('grUn')&&M('grUn').value.trim())||'un/h',
      capacidade:sel.has('capacidade')});
    agendarSalvar();fecharModal();gradeAdmin();toast(`Grupo ${nome} criado.`);
  };
  abrirMask();
}

function excluirGrupo(id){
  const g=grupoDe(id);
  if(g.fixo){toast('Este grupo é usado pela programação e não pode sair.',true);return;}
  const n=recursosDe(id).length;
  if(n){toast(`${g.nome} tem ${n} máquina${n>1?'s':''}. Exclua as máquinas antes.`,true);return;}
  const i=GRUPOS_MAQ.findIndex(x=>x.id===id);
  if(i>=0)GRUPOS_MAQ.splice(i,1);
  agendarSalvar();gradeAdmin();toast(`Grupo ${g.nome} excluído.`);
}



/* =====================================================================
   ASSINATURA POR PIN
   Toda ação que fecha ou reabre um registro pede o PIN. É o que
   responde "quem liberou este lote" seis meses depois.
   ===================================================================== */
function pedirPin(titulo,texto,cb){
  const ativos=OPERADORES.filter(o=>o.ativo!==false);
  const anterior={tit:M('mTit').textContent,sub:M('mSub').innerHTML,
    subH:M('mSub').hidden,b:M('mB').innerHTML,f:M('mF').innerHTML};
  M('mTit').textContent=titulo;M('mSub').hidden=true;
  M('mB').innerHTML=`
    <div class="alert blue">${texto}</div>
    <div class="fld"><label>PIN ou senha de quem está fazendo <b>*</b></label>
      <input id="pnIn" placeholder="••••" autocomplete="off">
      <div class="hint" id="pnDica" style="font-size:12px;color:var(--ink3);margin-top:6px">
        ${ativos.length?'PIN do operador ou senha da conta — cadastrados em Administração, aba Pessoas.'
          :'<b style="color:var(--danger)">Nenhum operador cadastrado.</b>'}</div></div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="pnC">Voltar</button>
    <button class="btn pri" id="pnK">Confirmar</button></div>`;
  const volta=()=>{
    M('mTit').textContent=anterior.tit;M('mSub').innerHTML=anterior.sub;
    M('mSub').hidden=anterior.subH;M('mB').innerHTML=anterior.b;M('mF').innerHTML=anterior.f;
  };
  M('pnC').onclick=volta;
  const ok=()=>{
    const o=quemPorCredencial(M('pnIn').value.trim());
    if(!o){M('pnDica').innerHTML='<b style="color:var(--danger)">PIN ou senha não encontrados.</b>';return;}
    OPERADOR=o;
    cb(o);
  };
  M('pnK').onclick=ok;
  M('pnIn').onkeydown=ev=>{if(ev.key==='Enter')ok();};
  M('pnIn').focus();
}

/* =====================================================================
   CERTIFICADO EM PDF
   Abre uma janela pronta para imprimir. No diálogo do navegador,
   "Salvar como PDF" gera o arquivo — sem depender de nada instalado.
   ===================================================================== */
function imprimirCertificado(b){
  const ens=ensaiosDe(b.produto);
  if(!ens.length){toast('Este produto não tem ensaios cadastrados.',true);return;}
  const esp=especDe(b.produto)||{};
  const r=(b.analise&&b.analise.resultados)||{};
  const ap=APONTA[b.chave]||{};
  const a=analiseOk(b);
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const dataFab=b.ordens[0]?dFab(b.ordens[0].data):'—';
  const linhas=ens.map(([k,rot])=>{
    const s=confereEnsaio(b.produto,k,r[k]);
    const espTxt=QUALI.includes(k)?esp[k]:(esp[k]&&esp[k].txt)||'—';
    const res=r[k]==null||r[k]===''?'—'
      :(QUALI.includes(k)?(r[k]==='ok'?'Conforme':'Não conforme'):r[k]);
    return `<tr><td>${esc(rot)}</td><td>${esc(espTxt)}</td><td>${esc(res)}</td>
      <td class="${s==='fora'?'fora':'ok'}">${s==='ok'?'Conforme':s==='fora'?'Não conforme':'—'}</td></tr>`;
  }).join('');
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">

  header{display:flex;align-items:flex-start;gap:16px;border-bottom:2px solid #12151A;
    padding-bottom:12px;margin-bottom:18px}

  header .t{flex:1}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.02em;text-transform:uppercase}
  header .s{font-size:12px;color:#5A6472}
  .campos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .c{border:1px solid #DDE1E7;border-radius:6px;padding:8px 10px}
  .c .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#77808E;margin-bottom:2px}
  .c .v{font-size:14px;font-weight:600}

  td{padding:7px 9px;border:1px solid #DDE1E7;font-size:12.5px}

  td.fora{color:#B02A37;font-weight:700}

/* ---------- funções dos operadores ---------- */
function gradeFuncoes(){
  const el=M('fngrid');if(!el)return;
  const uso=f=>OPERADORES.filter(o=>(o.funcao||o.papel)===f).length;
  el.innerHTML=`
    <div class="fnl">
      ${FUNCOES.map((f,i)=>{
        const n=uso(f);
        return `<span class="fnc">
          <b>${f}</b>
          <i>${n?`${n} ${n>1?'pessoas':'pessoa'}`:'ninguém'}</i>
          <button class="fnx" data-fndel="${i}" title="Excluir">&#10005;</button>
        </span>`;}).join('')}
    </div>
    <div class="fnadd">
      <input type="text" id="fnNova" placeholder="Operador de empacotadora">
      <button class="btn pri sm" id="fnK">+ Acrescentar</button>
    </div>`;
  const criar=()=>{
    const f=M('fnNova').value.trim();
    if(!f){toast('Escreva o nome da função.',true);return;}
    if(FUNCOES.some(x=>x.toLowerCase()===f.toLowerCase())){
      toast('Essa função já existe.',true);return;}
    FUNCOES.push(f);agendarSalvar();gradeAdmin();toast(`Função ${f} cadastrada.`);
  };
  if(M('fnK'))M('fnK').onclick=criar;
  if(M('fnNova'))M('fnNova').onkeydown=ev=>{if(ev.key==='Enter')criar();};
  el.querySelectorAll('[data-fndel]').forEach(b=>b.onclick=()=>{
    const f=FUNCOES[+b.dataset.fndel];
    const n=uso(f);
    if(n){toast(`${f} está em ${n} operador${n>1?'es':''}. Troque a função deles antes.`,true);return;}
    FUNCOES.splice(+b.dataset.fndel,1);agendarSalvar();gradeAdmin();
    toast(`Função ${f} excluída.`);
  });
}



/* =====================================================================
   TELA DE FORMULAÇÕES
   Um granel de cada vez, em quatro abas: o que vai no tanque, o que vai
   na embalagem, o que o laboratório mede e como se faz.
   ===================================================================== */
let FGRAN=null, FABA='mp', FVOL=1000;
const ABAS_FORM=[['mp','Tanque — matéria-prima'],['emb','Envase — embalagem'],
  ['cert','Certificado de análise'],['proc','Processo']];

function gradeFormulas(){
  const el=M('fmgrid');if(!el)return;
  if(!FGRAN||!PROD_TANQUE.includes(FGRAN))FGRAN=PROD_TANQUE[0];
  const f=formulaDe(FGRAN);
  const skus=PRODUTOS.filter(p=>p.tanque===FGRAN&&ativoProd(p));
  el.innerHTML=`
    <div class="fmtopo">
      <div class="fld"><label>Lote no tanque</label>
        <select id="fmG">${PROD_TANQUE.map(g=>
          `<option ${g===FGRAN?'selected':''}>${g}</option>`).join('')}</select></div>
      <div class="fld"><label>Próximo lote</label>
        <input type="number" id="fmLote" min="1" step="1" value="${proxLote(FGRAN)??''}"
          placeholder="do Tiny"></div>
      <div class="fmres">
        <span>${skus.length} produto${skus.length===1?'':'s'}</span>
        <span>${[...new Set(skus.map(p=>fmtLit(p.litragem)))].join(' · ')||'—'}</span>
      </div>
    </div>
    <div class="adabas fmabas">${ABAS_FORM.map(([c,r])=>
      `<button class="adaba ${c===FABA?'on':''}" data-fab="${c}">${r}</button>`).join('')}</div>
    <div id="fmcorpo"></div>`;
  M('fmG').addEventListener('change',e=>{FGRAN=e.target.value;gradeFormulas();});
  M('fmLote').addEventListener('change',e=>{
    const v=e.target.value.trim();
    if(v==='')delete PROX_LOTE[FGRAN]; else PROX_LOTE[FGRAN]=Math.max(1,+v||1);
    agendarSalvar();
    toast(v===''?`${FGRAN} sem numeração — as OPs sairão sem lote.`
      :`${FGRAN}: próximo lote ${PROX_LOTE[FGRAN]}.`);});
  el.querySelectorAll('[data-fab]').forEach(b=>b.onclick=()=>{FABA=b.dataset.fab;gradeFormulas();});
  ({mp:fmMP,emb:fmEmb,cert:fmCert,proc:fmProc}[FABA]||fmMP)(f);
}

/* ---------- matéria-prima ---------- */
function fmMP(f){
  const soma=somaMP(FGRAN), agua=Math.max(0,100-soma);
  const l=consumoMP(FGRAN,FVOL);
  const custo=l.reduce((s,x)=>s+x.total,0);
  M('fmcorpo').innerHTML=`
    <div class="fmvol">
      <div class="fld"><label>Volume do tanque</label>
        <select id="fmV">${[1000,1900,3800,4600,10000].map(v=>
          `<option value="${v}" ${v===FVOL?'selected':''}>${nf(v)} L</option>`).join('')}</select></div>
      <div class="fmbal ${soma>100?'ruim':''}">
        <b>MP ${nf1(soma)}%</b> · água e complemento <b>${nf1(agua)}%</b>
        ${soma>100?'<span class="w"> — a soma passou de 100%</span>':''}
      </div>
    </div>
    <table><thead><tr>
      <th>Insumo</th><th class="n">% da fórmula</th><th>Un</th>
      <th class="n">Consumo</th><th class="n">Custo un</th><th class="n">Custo total</th><th></th>
    </tr></thead><tbody>
    ${l.map((x,i)=>`<tr>
      <td><select class="fi" data-mpn="${i}">
        <option value="">Selecione…</option>
        ${insAtivos().filter(y=>['Matéria Prima','Corantes','Fragrâncias'].includes(y.tipo))
          .map(y=>`<option value="${escAttr(y.sku)}" ${
            (x.sku===y.sku||x.nome===y.nome)?'selected':''}>${y.nome}</option>`).join('')}
      </select>${(x.nome&&!insPorSku(x.sku)&&!insPorNome(x.nome))
        ? `<div class="sub2 w">${x.nome} não está no cadastro de insumos</div>`:''}</td>
      <td class="n"><input class="fi num" type="number" step="0.001" data-mpp="${i}" value="${x.pct}"></td>
      <td class="k">${x.un}</td>
      <td class="n mono"><b>${nf1(x.kg)}</b> kg</td>
      <td class="n mono">${x.custo?'R$ '+nf1(x.custo):'—'}</td>
      <td class="n mono">${x.total?'R$ '+nf1(x.total):'—'}</td>
      <td class="n"><button class="ordb del" data-mpx="${i}" title="Remover">&#10005;</button></td>
    </tr>`).join('')}
    ${l.length?`<tr class="fmagua"><td>Água / complemento</td>
      <td class="n mono">${nf1(agua)}</td><td class="k">kg</td>
      <td class="n mono"><b>${nf1(agua/100*FVOL)}</b> kg</td><td colspan="3"></td></tr>`:''}
    </tbody>${l.length?`<tfoot><tr><td colspan="5">Custo da batelada de ${nf(FVOL)} L</td>
      <td class="n mono"><b>R$ ${nf1(custo)}</b></td><td></td></tr></tfoot>`:''}</table>
    ${l.length?'':'<div class="vazioc">Nenhum insumo nesta fórmula.</div>'}

    <button class="btn pri sm" id="fmAdd" style="margin-top:12px">+ Insumo</button>`;
  M('fmV').addEventListener('change',e=>{FVOL=+e.target.value||1000;gradeFormulas();});
  M('fmAdd').onclick=()=>{formulaDe(FGRAN).mp.push({nome:'',sku:'',pct:0,un:'kg',custo:0});
    agendarSalvar();gradeFormulas();};
  const salvar=()=>{agendarSalvar();gradeFormulas();};
  M('fmcorpo').querySelectorAll('[data-mpn]').forEach(i=>i.addEventListener('change',()=>{
    const ins=insPorSku(i.value);
    const linha=formulaDe(FGRAN).mp[+i.dataset.mpn];
    if(ins){linha.sku=ins.sku;linha.nome=ins.nome;}
    else{linha.sku='';linha.nome='';}
    salvar();}));
  M('fmcorpo').querySelectorAll('[data-mpp]').forEach(i=>i.addEventListener('change',()=>{
    formulaDe(FGRAN).mp[+i.dataset.mpp].pct=Math.max(0,+i.value||0);salvar();}));
  M('fmcorpo').querySelectorAll('[data-mpx]').forEach(b=>b.onclick=()=>{
    formulaDe(FGRAN).mp.splice(+b.dataset.mpx,1);salvar();});
}

/* ---------- embalagem ---------- */
function fmEmb(f){
  const lits=[...new Set(PRODUTOS.filter(p=>p.tanque===FGRAN&&ativoProd(p))
    .map(p=>fmtLit(p.litragem)))];
  const todas=[...new Set([...lits,...Object.keys(f.emb||{})])];
  M('fmcorpo').innerHTML=todas.length?todas.map(lit=>{
    const itens=(f.emb||{})[lit]||[];
    const custo=itens.reduce((s,x)=>s+(+x.qtd||0)*(+x.custo||0),0);
    return `<div class="fmlit">
      <div class="fmlith"><b>${lit}</b>
        <span>${itens.length} componente${itens.length===1?'':'s'}</span>
        ${custo?`<i>R$ ${nf1(custo)} por unidade envasada</i>`:''}</div>
      ${itens.length?`<table><thead><tr>
        <th>Componente</th><th>Insumo</th><th class="n">Por unidade</th>
        <th class="n">Custo un</th><th></th></tr></thead><tbody>
        ${itens.map((x,i)=>`<tr>
          <td><b>${x.comp}</b></td>
          <td>${x.nome}${x.sku&&x.sku.indexOf('SEMSKU')<0?` <span class="k">${x.sku}</span>`:''}</td>
          <td class="n"><input class="fi num" type="number" step="0.0001"
            data-eq="${lit}|${i}" value="${x.qtd}"></td>
          <td class="n mono">${x.custo?'R$ '+nf1(x.custo):'—'}</td>
          <td class="n"><button class="ordb del" data-ex="${lit}|${i}">&#10005;</button></td>
        </tr>`).join('')}</tbody></table>`
        :'<div class="vazioc">Sem componentes cadastrados.</div>'}
      <button class="btn sm" data-eadd="${lit}" style="margin:10px 0 4px">+ Componente</button>
    </div>`;}).join('')
    :'<div class="vazioc">Nenhuma litragem ativa neste granel.</div>';
  const pega=k=>{const [lit,i]=k.split('|');return {lit,i:+i};};
  M('fmcorpo').querySelectorAll('[data-eq]').forEach(inp=>inp.addEventListener('change',()=>{
    const {lit,i}=pega(inp.dataset.eq);
    formulaDe(FGRAN).emb[lit][i].qtd=Math.max(0,+inp.value||0);agendarSalvar();gradeFormulas();}));
  M('fmcorpo').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
    const {lit,i}=pega(b.dataset.ex);
    formulaDe(FGRAN).emb[lit].splice(i,1);agendarSalvar();gradeFormulas();});
  M('fmcorpo').querySelectorAll('[data-eadd]').forEach(b=>b.onclick=()=>{
    const lit=b.dataset.eadd;const f=formulaDe(FGRAN);
    (f.emb[lit]=f.emb[lit]||[]).push({comp:'Componente',nome:'',sku:'',qtd:1,custo:0});
    agendarSalvar();gradeFormulas();});
}

/* ---------- certificado ---------- */
function fmCert(){
  const e=ESPEC[FGRAN]||{};
  const v=validadeDe(FGRAN);
  M('fmcorpo').innerHTML=`
    <p class="adp">O que o laboratório mede neste granel. Ensaio em branco não aparece
      no certificado. Vale para todos os formatos.</p>
    <div class="g2" style="max-width:420px">
      <div class="fld"><label>Validade</label>
        <input type="number" id="fcVal" min="1" value="${v.n}"></div>
      <div class="fld"><label>Contada em</label>
        <select id="fcUn"><option value="meses" ${v.un==='meses'?'selected':''}>meses</option>
          <option value="dias" ${v.un==='dias'?'selected':''}>dias</option></select></div>
    </div>
    <div class="espg" style="margin-top:8px">${ENSAIOS.map(([k,r])=>{
      const x=e[k], q=QUALI.includes(k);
      return `<div class="espl"><span class="r">${r}</span>
        ${q?`<input type="text" data-fce="${k}" value="${x||''}" placeholder="—">`
           :`<input type="number" step="0.01" data-fcmin="${k}" value="${x&&x.min!=null?x.min:''}" placeholder="mín">
             <input type="number" step="0.01" data-fcmax="${k}" value="${x&&x.max!=null?x.max:''}" placeholder="máx">`}
      </div>`;}).join('')}</div>`;
  const grava=()=>{
    const esp={};
    M('fmcorpo').querySelectorAll('[data-fce]').forEach(i=>{
      if(i.value.trim())esp[i.dataset.fce]=i.value.trim();});
    ENSAIOS.filter(([k])=>!QUALI.includes(k)).forEach(([k])=>{
      const a=M('fmcorpo').querySelector(`[data-fcmin="${k}"]`);
      const b=M('fmcorpo').querySelector(`[data-fcmax="${k}"]`);
      const mn=a&&a.value!==''?+a.value:null, mx=b&&b.value!==''?+b.value:null;
      if(mn==null&&mx==null)return;
      esp[k]={min:mn,max:mx,txt:mn!=null&&mx!=null?`Entre ${mn} e ${mx}`
        :(mn!=null?`Acima de ${mn}`:`Até ${mx}`)};});
    if(Object.keys(esp).length)ESPEC[FGRAN]=esp; else delete ESPEC[FGRAN];
    VALIDADE[FGRAN]={n:Math.max(1,+M('fcVal').value||12),un:M('fcUn').value};
    agendarSalvar();
  };
  M('fmcorpo').querySelectorAll('input,select').forEach(i=>i.addEventListener('change',grava));
}

/* ---------- processo ---------- */
function fmProc(f){
  const p=f.proc||[];
  M('fmcorpo').innerHTML=`
    <p class="adp">O passo a passo de como se faz este produto. Aparece na ordem do tanque,
      para quem está na mistura seguir.</p>
    ${p.length?`<ol class="proc">${p.map((x,i)=>`
      <li><textarea data-pt="${i}" rows="2">${x}</textarea>
        <div class="procb">
          <button class="ordb" data-pup="${i}" ${i===0?'disabled':''} title="Subir">&#8593;</button>
          <button class="ordb" data-pdn="${i}" ${i===p.length-1?'disabled':''} title="Descer">&#8595;</button>
          <button class="ordb del" data-prx="${i}" title="Remover">&#10005;</button>
        </div></li>`).join('')}</ol>`
      :'<div class="vazioc">Nenhum passo escrito ainda.</div>'}
    <button class="btn pri sm" id="fmPAdd" style="margin-top:12px">+ Passo</button>`;
  const f2=formulaDe(FGRAN); f2.proc=f2.proc||[];
  M('fmPAdd').onclick=()=>{f2.proc.push('');agendarSalvar();gradeFormulas();};
  M('fmcorpo').querySelectorAll('[data-pt]').forEach(i=>i.addEventListener('change',()=>{
    f2.proc[+i.dataset.pt]=i.value.trim();agendarSalvar();}));
  const mexe=(de,para)=>{const x=f2.proc.splice(de,1)[0];f2.proc.splice(para,0,x);
    agendarSalvar();gradeFormulas();};
  M('fmcorpo').querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>mexe(+b.dataset.pup,+b.dataset.pup-1));
  M('fmcorpo').querySelectorAll('[data-pdn]').forEach(b=>b.onclick=()=>mexe(+b.dataset.pdn,+b.dataset.pdn+1));
  M('fmcorpo').querySelectorAll('[data-prx]').forEach(b=>b.onclick=()=>{
    f2.proc.splice(+b.dataset.prx,1);agendarSalvar();gradeFormulas();});
}


/* =====================================================================

const campo=(k,v,forte)=>`<div class="c ${forte?'forte':''}"><div class="k">${k}</div>

/* ---------- cadastro de insumos ---------- */
let FINS={q:'',tipo:''};
function insFiltrados(){
  const q=FINS.q.trim().toLowerCase();
  return INSUMOS.filter(x=>{
    if(FINS.tipo&&x.tipo!==FINS.tipo)return false;
    if(!q)return true;
    return [x.nome,x.sku,x.tiny,x.mat].filter(Boolean)
      .some(v=>String(v).toLowerCase().includes(q));
  }).sort((a,b)=>a.tipo===b.tipo?a.nome.localeCompare(b.nome):a.tipo.localeCompare(b.tipo));
}
/* onde cada insumo é usado — impede excluir algo que está numa fórmula */
function usosDoInsumo(x){
  const l=[];
  Object.entries(FORMULAS).forEach(([g,f])=>{
    (f.mp||[]).forEach(i=>{if(i.sku===x.sku||i.nome===x.nome)l.push(g);});
    Object.entries(f.emb||{}).forEach(([lit,itens])=>
      itens.forEach(i=>{if(i.sku===x.sku||i.nome===x.nome)l.push(`${g} ${lit}`);}));
  });
  return [...new Set(l)];
}

/* =====================================================================
   INTEGRAÇÃO COM O TINY
   O token nunca fica no navegador: ele vive como segredo no Supabase e
   só a função no servidor o enxerga. Daqui só se chama a função.
   ===================================================================== */
const TINY={ligado:false,ultima:null,itens:0,erro:''};
const urlFn=n=>`${SUPA.url}/functions/v1/${n}`;

/* traduz a falha para o que a pessoa precisa fazer */
function diagnosticoTiny(msg){
  const m=String(msg||'');
  if(/Failed to fetch|NetworkError|Load failed|CORS/i.test(m))
    return 'A chamada não chegou ao servidor. Quase sempre é a função "tiny" '
      +'ainda não criada no Supabase — siga os quatro passos abaixo. '
      +'Se ela já existe, confira se o deploy terminou e se você está com internet.';
  if(/404|Not Found/i.test(m))
    return 'A função "tiny" ainda não foi criada no Supabase.';
  if(/TINY_TOKEN/i.test(m))
    return 'A função existe, mas o segredo TINY_TOKEN não foi cadastrado nos Secrets.';
  if(/401|sess/i.test(m))
    return 'Sua sessão expirou. Saia e entre de novo.';
  if(/403|acesso/i.test(m))
    return 'Você está logado, mas não consta como ativo no cadastro de acessos.';
  if(/token|invalid/i.test(m))
    return 'O Tiny recusou o token. Gere outro no Tiny e atualize o segredo TINY_TOKEN.';
  return m;
}

async function chamarTiny(acao,corpo){
  if(!temNuvem()||!SESSAO)throw new Error('Precisa estar logado no banco.');
  const r=await fetch(urlFn('tiny'),{method:'POST',headers:cabecalhos(),
    body:JSON.stringify({acao:acao,...(corpo||{})})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.erro||d.message||`falha ${r.status}`);
  return d;
}

/* ---------- página Sopro ---------- */
/* =====================================================================
   PLANO SEMANAL DO SOPRO
   Meta vem do consumo médio mais a margem de segurança.
   Atendido é o que já foi soprado; demanda é o que as OPs de envase
   daquela semana pedem. Os dois juntos dizem se falta ou sobra.
   ===================================================================== */
function semanaDe(d){
  const x=new Date(d);x.setHours(0,0,0,0);
  const dia=(x.getDay()+6)%7;            /* segunda = 0 */
  const ini=new Date(x);ini.setDate(x.getDate()-dia);
  const fim=new Date(ini);fim.setDate(ini.getDate()+6);
  return {ini:ymd(ini),fim:ymd(fim)};
}
function planoSemana(ref){
  const s=semanaDe(ref);
  const dentro=d=>d>=s.ini&&d<=s.fim;
  const linhas=PREFORMAS.map(f=>({frasco:f.id,meta:metaPref(f.id),demanda:0,soprado:0,quebras:0}));
  const ache=id=>linhas.find(l=>l.frasco===id);
  ORDENS.filter(o=>dentro(o.data)&&naGrade(o)).forEach(o=>{
    const p=prodOf(o.codigo);if(!p||!sopraFrasco(p))return;
    const l=ache(preformaDe(p));if(!l)return;
    l.demanda+=caixasPrev(o)*p.un_cx;
    const a=SOPRO[o.id]||{};
    l.soprado+=Math.max(0,(a.produzidas??0)-(a.quebras??0));
    l.quebras+=a.quebras??0;
  });
  linhas.forEach(l=>{
    l.alvo=Math.max(l.meta,l.demanda);          /* manda o maior dos dois */
    l.falta=Math.max(0,l.alvo-l.soprado);
    l.pc=l.alvo?Math.min(100,l.soprado/l.alvo*100):0;
  });
  return {semana:s,linhas:linhas.filter(l=>l.alvo>0||l.soprado>0)};
}
function painelSemana(){
  const el=M('spsem');if(!el)return;
  const p=planoSemana(S.refTq);
  if(!p.linhas.length){el.innerHTML='';return;}
  const tot=k=>p.linhas.reduce((s,l)=>s+l[k],0);
  el.innerHTML=`
    <div class="semh">
      <span>Semana de ${dCurto(p.semana.ini)} a ${dCurto(p.semana.fim)}</span>
      <b>${nf(tot('soprado'))} de ${nf(tot('alvo'))} un</b>
    </div>
    <div class="semc">${p.linhas.map(l=>`
      <div class="seml">
        <span class="f">${l.frasco}</span>
        <div class="sembar"><i style="width:${l.pc}%" class="${l.falta?'':'ok'}"></i></div>
        <span class="v">${nf(l.soprado)} / ${nf(l.alvo)}</span>
        <span class="s ${l.falta?'falta':'ok'}">${l.falta?`faltam ${nf(l.falta)}`:'atendido'}</span>
        <span class="d" title="Meta pelo consumo médio · o que as OPs da semana pedem">${
          l.demanda>l.meta?`OPs pedem ${nf(l.demanda)}, acima da meta de ${nf(l.meta)}`
          :`meta ${nf(l.meta)} · OPs pedem ${nf(l.demanda)}`}</span>
      </div>`).join('')}</div>`;
}

/* a rotuladora e a ordem na fila ficam no apontamento da OP */
const rotuladoraDe=oc=>(SOPRO[oc.id]||{}).rotMaq||null;
const filaRotDe=oc=>(SOPRO[oc.id]||{}).rotFila??null;

function gradeRotulagem(){
  const data=ymd(S.refTq);
  const lista=sopros(data).filter(x=>x.status==='pronto');
  const maqs=recursosDe('rotulo').filter(r=>r.ativo!==false);
  M('rtgrid').innerHTML=maqs.map(r=>{
    const seq=lista.filter(x=>rotuladoraDe(x.oc)===r.id)
      .sort((a,b)=>(filaRotDe(a.oc)??0)-(filaRotDe(b.oc)??0));
    const un=seq.reduce((s,x)=>s+(x.boas||x.un),0);
    const falta=seq.filter(x=>x.rot!=='pronto').length;
    const horas=r.cad?un/r.cad:0;
    return `<div class="tqcol" style="width:300px" data-rmaq="${r.id}">
      <div class="tqh">
        <div class="n"><b>${r.nome||r.id}</b>
          <span>${r.cad?nf(r.cad)+' un/h':''}</span></div>
        <div class="s">${seq.length

/* modal só da rotulagem — o do sopro cuida do sopro */
function abrirRotulo(x){

  M('mB').innerHTML=`
    <div class="alert blue">Frasco soprado${x.fimReal?` até ${x.fimReal}`:''} ·
      <b>${nf(x.boas)} un boas</b>. O envase deste lote começa às
      <b>${hhmm(x.envaseEm)}</b> e só libera com o rótulo pronto.</div>

      <div class="fld"><label>Início da rotulagem</label>
        <input type="time" id="rIni" step="300" value="${x.rotIni}" ${trava}></div>
      <div class="fld"><label>Fim da rotulagem</label>
        <input type="time" id="rFim" step="300" value="${x.rotFim}" ${trava}></div>
    </div>
    <div class="g2">
      <div class="fld"><label>Rotuladas (un)</label>
        <input type="number" id="rUn" min="0" step="1" value="${x.rotUn??''}" ${trava}></div>
      <div class="fld"><label>Quem rotulou</label>
        <select id="rQuem" ${trava}><option value="">Selecione…</option>
        ${USUARIOS.map(u=>`<option ${x.rotQuem===u.nome?'selected':''}>${u.nome}</option>`).join('')}</select></div>
    </div>
    <div class="calc" id="rCalc"></div>
    <div class="fld" style="margin-top:13px"><label>Observação</label>
      <textarea id="rObs" ${trava} placeholder="Rótulo trocado, parada, o que aconteceu">${x.rotObs||''}</textarea></div>`;
  M('mF').innerHTML=`<div class="mfesq">
      ${x.rot==='aguardando'&&ed?`<button class="btn cyan" id="rS">Iniciar rotulagem</button>`:''}
      ${x.rot==='rotulando'&&ed?`<button class="btn pri" id="rE">OK da rotulagem</button>`:''}
      ${x.rot==='pronto'&&ed?`<button class="btn warn sm" id="rR">Reabrir</button>`:''}
    </div><div class="mfdir">
      <button class="btn sm" id="rOP">OP em PDF</button>
      <button class="btn" id="rC">Fechar</button>
      ${ed?`<button class="btn blue" id="rK">Salvar</button>`:''}</div>`;

  const upd=()=>{
    const i=M('rIni').value,f=M('rFim').value,u=M('rUn').value===''?null:+M('rUn').value;
    let t='';
    if(i&&f)t+=`Levou <b>${Math.max(0,hm(f)-hm(i))} min</b>.<br>`;
    if(u!=null)t+= u>=alvo
      ? `<span style="color:var(--run);font-weight:600">${nf(u)} rotuladas — cobre as ${nf(alvo)} un.</span>`
      : `<span class="w">${nf(u)} rotuladas · faltam ${nf(alvo-u)} un para o envase.</span>`;
    M('rCalc').innerHTML=t||'Informe o realizado ao dar o OK.';
  };
  ['rIni','rFim','rUn'].forEach(i=>M(i)&&M(i).addEventListener('input',upd));upd();

  const grava=extra=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),
      rotIni:M('rIni').value,rotFim:M('rFim').value,
      rotUn:M('rUn').value===''?null:+M('rUn').value,
      rotQuem:M('rQuem').value||'',rotObs:M('rObs').value.trim(),...extra};
  };
  if(M('rOP'))M('rOP').onclick=()=>imprimirOPRotulo(x);
  if(M('rC'))M('rC').onclick=fecharModal;
  if(M('rK'))M('rK').onclick=()=>{grava({});agendarSalvar();fecharModal();render();toast('Rotulagem salva.');};
  if(M('rS'))M('rS').onclick=()=>{
    grava({rotulo:'rotulando',rotIni:M('rIni').value||relogio()});
    registrar(x.oc,'Rotulagem iniciada',null,x.frasco);
    agendarSalvar();fecharModal();render();toast('Rotulagem iniciada.');};
  if(M('rE'))M('rE').onclick=()=>{
    if(M('rUn').value===''){toast('Informe quantas foram rotuladas.',true);M('rUn').focus();return;}
    if(!M('rQuem').value){toast('Informe quem rotulou.',true);M('rQuem').focus();return;}
    const u=+M('rUn').value;
    grava({rotulo:'pronto',rotFim:M('rFim').value||relogio()});
    registrar(x.oc,'Rotulagem finalizada',null,`${x.frasco} · ${nf(u)} rotuladas · ${M('rQuem').value}`);
    agendarSalvar();fecharModal();render();
    toast(u>=alvo?`Frasco liberado para o envase · ${nf(u)} un.`
      :`Rotulado · faltam ${nf(alvo-u)} un para cobrir o envase.`);};
  if(M('rR'))M('rR').onclick=()=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),rotulo:'rotulando'};
    registrar(x.oc,'Rótulo reaberto',null,x.frasco);
    agendarSalvar();fecharModal();render();toast('Rótulo reaberto — o envase volta a travar.');};
  abrirMask();
}

function gradeSopro(){
  const data=ymd(S.refTq),lista=sopros(data);
  painelSemana();
  M('spgrid').innerHTML=FRASCOS.map((f,i)=>{
    const seq=lista.filter(x=>x.frasco===f.id&&x.naFila!=null)
      .sort((a,b)=>a.naFila-b.naFila);
    const un=seq.reduce((s,x)=>s+x.un,0);
    const feito=seq.reduce((s,x)=>s+Math.max(0,x.boas),0);
    return `<div class="tqcol" style="width:286px" data-fr="${f.id}">
      <div class="tqh" data-col="${f.id}" draggable="true" title="Arraste o cabeçalho ou use as setas para reordenar">
        <div class="ord">
          <button class="ordb" data-esq="${f.id}" ${i===0?'disabled':''} title="Mover para a esquerda">‹</button>
          <button class="ordb" data-dir="${f.id}" ${i===FRASCOS.length-1?'disabled':''} title="Mover para a direita">›</button>
        </div>
        <div class="n"><b>${f.id}</b>
        <span>${String(f.gramatura).replace('.',',')}g${f.pescoco?' · '+f.pescoco:''}</span></div>
        <div class="s">${seq.length?`${seq.length} ${seq.length>1?'ordens':'ordem'} · ${nf(un)} un no dia`
          :'Sem necessidade'}${feito?` · ${nf(feito)} boas`:''}</div></div>
      <div class="tqb">${seq.length?seq.map(cardSopro).join('')
        :`<div class="tqvazio">Solte aqui as ordens deste frasco.<br>Elas ficam à direita, por urgência.</div>`}</div>
    </div>`;
  }).join('');
  M('spgrid').querySelectorAll('[data-sp]').forEach(e=>{
    e.addEventListener('click',()=>{if(!SDRAG)abrirSopro(sopros(ymd(S.refTq)).find(x=>x.oc.id===e.dataset.sp));});
    e.setAttribute('draggable','true');
    e.addEventListener('dragstart',ev=>{SDRAG=e.dataset.sp;
      ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',e.dataset.sp);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>SDRAG=null,80);});
  });
  /* setas: caminho garantido, funciona em tela sensível ao toque e sem arrastar */
  M('spgrid').querySelectorAll('[data-esq]').forEach(b=>{
    b.addEventListener('click',ev=>{ev.stopPropagation();
      const id=b.dataset.esq,k=FRASCOS.findIndex(f=>f.id===id);
      if(k>0)moverFrasco(id,FRASCOS[k-1].id);});
  });
  M('spgrid').querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click',ev=>{ev.stopPropagation();
      const id=b.dataset.dir,k=FRASCOS.findIndex(f=>f.id===id);
      if(k>=0&&k<FRASCOS.length-1)moverFrasco(id,FRASCOS[k+1].id);});
  });
  /* o cabeçalho arrasta a coluna inteira: define a ordem em que os frascos aparecem */
  M('spgrid').querySelectorAll('.tqh[data-col]').forEach(h=>{
    h.addEventListener('dragstart',ev=>{
      CDRAG=h.dataset.col;SDRAG=null;
      ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain','col:'+h.dataset.col);
      const c=h.parentNode;if(c&&c.style)c.style.opacity='.45';
      document.body.classList.add('arrastando-col');});
    h.addEventListener('dragend',()=>{
      const c=h.parentNode;if(c&&c.style)c.style.opacity='';
      document.body.classList.remove('arrastando-col');
      setTimeout(()=>CDRAG=null,80);});
  });
  /* colunas recebem a ordem e definem a sequência de produção */
  M('spgrid').querySelectorAll('.tqcol').forEach(z=>{
    const marca=v=>z.classList.toggle('alvo',v);
    const marcaCol=v=>z.classList.toggle('alvocol',v);
    const limpa=()=>{marca(false);marcaCol(false);};
    z.addEventListener('dragenter',ev=>{ev.preventDefault();
      if(CDRAG)marcaCol(CDRAG!==z.dataset.fr);else if(SDRAG)marca(true);});
    z.addEventListener('dragover',ev=>{ev.preventDefault();
      ev.dataTransfer.dropEffect='move';
      if(CDRAG)marcaCol(CDRAG!==z.dataset.fr);else if(SDRAG)marca(true);});
    z.addEventListener('dragleave',ev=>{if(!z.contains(ev.relatedTarget))limpa();});
    z.addEventListener('drop',ev=>{
      ev.preventDefault();limpa();
      /* arrastou o cabeçalho: é reordenação de coluna, não movimento de ordem */
      const bruto=ev.dataTransfer.getData('text/plain')||'';
      const col=CDRAG||(bruto.startsWith('col:')?bruto.slice(4):null);
      if(col){CDRAG=null;moverFrasco(col,z.dataset.fr);return;}
      const id=SDRAG||bruto;SDRAG=null;
      const x=sopros(ymd(S.refTq)).find(y=>y.oc.id===id);
      if(!x)return;
      if(x.frasco!==z.dataset.fr){
        toast(`Esta ordem é de ${x.frasco}, não cabe na coluna ${z.dataset.fr}.`,true);return;}
      const usados=sopros(ymd(S.refTq)).filter(y=>y.frasco===x.frasco&&y.naFila!=null)
        .map(y=>y.naFila);
      SOPRO[id]={...(SOPRO[id]||{}),fila:(usados.length?Math.max(...usados):0)+1};
      render();toast(`${x.frasco} na fila de produção.`);
    });
  });
}

/* reordena as colunas de frasco: a arrastada passa por cima da coluna alvo */
function moverFrasco(de,para){
  if(!de||!para||de===para)return;
  const i=FRASCOS.findIndex(f=>f.id===de),j0=FRASCOS.findIndex(f=>f.id===para);
  if(i<0||j0<0)return;
  const [f]=FRASCOS.splice(i,1);
  let j=FRASCOS.findIndex(x=>x.id===para);
  if(i<j0)j+=1;                 /* veio da esquerda: entra depois do alvo */
  FRASCOS.splice(j,0,f);
  agendarSalvar();render();
  toast(`${de} agora é a ${j+1}ª coluna.`);
}

    <button class="btn" id="pC">Fechar</button>
    ${(trava||!edS)?'':`<button class="btn blue" id="pS">Salvar</button>`}`;
  if(M('pOP'))M('pOP').onclick=()=>imprimirOPSopro(x);
  M('pC').onclick=fecharModal;

  const upd=()=>{
    const m=sopOf(M('pSop').value);
    const dur=m?Math.max(15,Math.ceil(x.un/m.cad*60/5)*5):null;
    M('pDur').textContent=m?`${nf(x.un)} un a ${nf(m.cad)} un/h ≈ ${dur} min de sopro.`
      :'Escolha a sopradora para estimar o tempo.';
    const pr=+M('pProd').value||0,qb=+M('pQue').value||0,boas=pr-qb;
    const iR=M('pIniR').value,fR=M('pFimR').value;
    let h='';
    if(iR&&fR)h+=`Sopro real <b>${Math.max(0,hm(fR)-hm(iR))} min</b>.<br>`;
    if(pr)h+=boas>=x.un
      ? `<span style="color:var(--run);font-weight:600">${nf(boas)} boas — atende as ${nf(x.un)} un.</span>`
      : `<span class="w">${nf(boas)} boas · faltam ${nf(x.un-boas)} un.</span>`;
    if(qb&&pr)h+=`<br>Quebra de <b>${nf1(qb/pr*100)}%</b>.`;
    M('pCalc').innerHTML=h||'Informe o realizado ao finalizar.';
  };
  ['pSop','pProd','pQue','pIniR','pFimR'].forEach(i=>M(i)&&M(i).addEventListener('input',upd));
  if(M('pSop'))M('pSop').addEventListener('change',()=>{
    const m=sopOf(M('pSop').value);
    if(m){const dur=Math.max(15,Math.ceil(x.un/m.cad*60/5)*5);
      M('pFimP').value=hhmm(x.envaseEm);
      M('pIniP').value=hhmm(Math.max(H0*60,x.envaseEm-dur));}
    upd();
  });
  upd();

  const grava=extra=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),
      sopradora:M('pSop').value||null,
      iniPrev:M('pIniP').value,fimPrev:M('pFimP').value,
      iniReal:M('pIniR').value,fimReal:M('pFimR').value,
      produzidas:M('pProd').value===''?null:+M('pProd').value,
      quebras:M('pQue').value===''?null:+M('pQue').value,
      obs:M('pObs').value.trim(),...extra};
  };
  if(M('pS'))M('pS').onclick=()=>{grava({});fecharModal();render();toast('Sopro salvo.');};
  if(M('pStart'))M('pStart').onclick=()=>{
    if(!M('pSop').value){toast('Selecione a sopradora.',true);return;}
    grava({status:'soprando',iniReal:M('pIniR').value||relogio()});
    registrar(x.oc,'Sopro iniciado',null,`${x.frasco} · ${M('pSop').value}`);
    fecharModal();render();toast('Sopro iniciado.');
  };
  if(M('pEnd'))M('pEnd').onclick=()=>{
    const pr=M('pProd').value;
    if(pr===''){toast('Informe as unidades produzidas.',true);M('pProd').focus();return;}
    grava({status:'pronto',fimReal:M('pFimR').value||relogio()});
    const b=(+pr)-(+M('pQue').value||0);
    registrar(x.oc,'Sopro finalizado',null,
      `${x.frasco} · ${nf(b)} boas de ${nf(x.un)} un${+M('pQue').value?` · ${nf(+M('pQue').value)} quebras`:''}`);
    fecharModal();render();
    toast(b>=x.un?`Sopro pronto · ${nf(b)} un boas.`:`Sopro finalizado · faltam ${nf(x.un-b)} un.`);
  };
  if(M('pReab'))M('pReab').onclick=()=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),status:'soprando'};
    registrar(x.oc,'Sopro reaberto',null,x.frasco);
    fecharModal();render();toast('Sopro reaberto.');
  };
  abrirMask();
}

/* =====================================================================
   TURNOS DA OP
   A OP é uma só e pode atravessar dias. Cada pessoa que assume registra
   o que fez no turno dela. O que já foi fechado não se edita sem
   autorização — e a autorização fica no histórico com nome.
   ===================================================================== */
const turnosDe=o=>o.turnos||(o.turnos=[]);
const cxFeitas=o=>turnosDe(o).reduce((s,t)=>s+(+t.caixas||0),0);
const cxFaltam=o=>Math.max(0,caixasPrev(o)-cxFeitas(o));
const litrosFaltam=o=>cxFaltam(o)*litrosCx(o);
const minTurnos=o=>turnosDe(o).reduce((s,t)=>s+Math.max(0,hm(t.fim)-hm(t.ini)),0);

/* quem pode liberar edição do que já foi fechado */
const ehSupervisor=op=>op&&/supervis|gestor|master/i.test(String(op.funcao||op.papel||''));
function autorizador(cred){
  const q=quemPorCredencial(cred);
  if(!q)return null;
  if(q.tipo==='acesso')return (q.master||/gestor|supervis/i.test(q.funcao||''))?q:null;
  return ehSupervisor(q.op)?q:null;
}

/* minutos fora da jornada da máquina naquele turno */
function extraDoTurno(o,t){
  if(!o.maq)return 0;
  const [ji,jf]=jorn(o.maq);
  const i=hm(t.ini),f=hm(t.fim);
  return Math.max(0,f-Math.max(i,jf))+Math.max(0,Math.min(f,ji)-i);
}
const extraTotal=o=>turnosDe(o).reduce((s,t)=>s+extraDoTurno(o,t),0);

/* ---------- painel dentro da OP ---------- */

/* =====================================================================
   O BOTÃO QUE ANDA COM A OP
   Um botão só, que muda conforme a etapa: iniciar setup, iniciar envase,
   concluir. Cada toque abre uma janelinha com a hora — que já vem
   preenchida com o relógio, mas dá para corrigir.
   ===================================================================== */
function etapaAtual(o){
  if(!o||!o.maq)return null;
  if(sit(o)==='concluida')return null;
  if(!o.iniReal&&!o.envIni)return o.setup>0?'setup':'envase';
  if(!o.envIni)return 'envase';
  if(!o.fimReal)return 'fim';
  return null;
}
const ROTULO_ETAPA={setup:'Iniciar setup',envase:'Iniciar envase',fim:'Concluir envase'};

function marcarEtapa(o,et){
  if(et==='fim'){concluir(o);return;}
  const agora=relogio();
  const ref=et==='setup'?null:(o.iniReal||null);
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('modal').classList.remove('wide');
  M('mTit').textContent=ROTULO_ETAPA[et];
  M('mSub').hidden=false;
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq} · lote ${o.lote||'—'}`;
  M('mB').innerHTML=`
    <div class="alert blue">${et==='setup'
      ? `Marca o começo da preparação da linha. Previsto: <b>${o.setup} min</b>.`
      : `Marca o começo do envase${ref?`, depois do setup iniciado às <b>${ref}</b>`:''}.
         Previsto: <b>${o.envase} min</b>.`}</div>
    <div class="g2">
      <div class="fld"><label>Hora <b>*</b></label>
        <input type="time" id="etHr" step="300" value="${agora}"></div>
      <div class="fld"><label>Operador</label>
        <input id="etPin" type="password" 
          placeholder="PIN ou senha" autocomplete="off">
        <div class="hint" id="etQuem" style="font-size:11.5px;color:var(--ink3);margin-top:4px">
          Opcional — sem isso, assina quem está logado.</div></div>
    </div>
    <div class="calc" id="etCalc"></div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="etC">Voltar</button>
    <button class="btn pri" id="etK">${ROTULO_ETAPA[et]}</button></div>`;
  const upd=()=>{
    const hr=cv('etHr');let t='';
    if(hr){
      if(et==='envase'&&ref){
        const d=hm(hr)-hm(ref);
        t=d>=0?`Setup levou <b>${hmm(d)}</b> · previsto ${o.setup} min.`
               :`<span class="w">Antes do início do setup (${ref}).</span>`;
      }else{
        const dif=hm(hr)-o.inicio;
        t=dif===0?'Começou na hora programada.'
          :dif>0?`<span class="w">${hmm(dif)} depois do programado (${hhmm(o.inicio)}).</span>`
                :`${hmm(-dif)} antes do programado (${hhmm(o.inicio)}).`;
      }
    }
    M('etCalc').innerHTML=t;
  };
  M('etHr').addEventListener('input',upd);upd();
  M('etPin').addEventListener('input',()=>{
    const op=quemPorCredencial(cv('etPin').trim());
    M('etQuem').innerHTML=op?`<b>${op.nome}</b>`:'Opcional — sem isso, assina quem está logado.';});
  M('etC').onclick=()=>abrirOrdem(o);
  M('etK').onclick=()=>{
    const hr=cv('etHr');
    if(!hr){toast('Informe a hora.',true);return;}
    if(et==='envase'&&ref&&hm(hr)<hm(ref)){
      toast('O envase não pode começar antes do setup.',true);return;}
    const op=quemPorCredencial(cv('etPin').trim());
    if(et==='setup'){o.iniReal=hr;registrar(o,'Setup iniciado',op,hr);}
    else{
      if(!o.iniReal)o.iniReal=hr;      /* sem setup, a OP começa no envase */
      o.envIni=hr;registrar(o,'Envase iniciado',op,hr);
    }
    agendarSalvar();fecharModal();render();
    toast(`${ROTULO_ETAPA[et]} · ${hr}.`);
  };
  abrirMask();
}


/* corrigir horário marcado por engano: pede o motivo e deixa rastro */
function corrigirHorarios(o){
  const fim=sit(o)==='concluida';
  const souMestre=!!(typeof MEU_ACESSO!=='undefined'&&MEU_ACESSO&&MEU_ACESSO.master);
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('modal').classList.remove('wide');
  M('mTit').textContent='Corrigir horários';
  M('mSub').hidden=false;
  M('mSub').textContent=`${nomeCurto(o.codigo)} · ${o.maq||'—'} · lote ${o.lote||'—'}`;
  M('mB').innerHTML=`
    <div class="alert">Só para acertar o que foi marcado errado.
      ${fim?'A OP está concluída, então precisa de <b>autorização de supervisor</b>.':''}
      A correção fica no histórico.</div>
    <div class="g3">
      <div class="fld"><label>Início do setup</label>
        <input type="time" id="chSet" step="300" value="${o.iniReal||''}"></div>
      <div class="fld"><label>Início do envase</label>
        <input type="time" id="chEnv" step="300" value="${o.envIni||''}"></div>
      <div class="fld"><label>Fim do envase</label>
        <input type="time" id="chFim" step="300" value="${o.fimReal||''}"></div>
    </div>
    <div class="calc" id="chCalc"></div>
    ${(fim&&!souMestre)?`<div class="fld"><label>PIN ou senha do supervisor <b>*</b></label>
      <div class="secreto">
        <input id="chPin" type="password" 
          placeholder="••••" autocomplete="off">
        <button type="button" class="olho" data-olho="chPin" title="Mostrar">&#128065;</button>
      </div>
      <div class="hint" id="chQuem" style="font-size:11.5px;color:var(--ink3);margin-top:4px"></div></div>`:''}
    <div class="fld"><label>Motivo <b>*</b></label>
      <textarea id="chMot" placeholder="Ex.: marquei 18:19 mas o envase começou 12:20"></textarea></div>`;
  M('mF').innerHTML=`<div class="mfesq">
      <button class="btn del sm" id="chLimpa">Apagar os horários</button>
    </div><div class="mfdir">
    <button class="btn" id="chC">Voltar</button>
    <button class="btn pri" id="chK">Salvar correção</button></div>`;
  const upd=()=>{
    const s=cv('chSet'),e=cv('chEnv'),f=cv('chFim');
    let t=[];
    if(s&&e)t.push(hm(e)>=hm(s)?`Setup levou <b>${hmm(hm(e)-hm(s))}</b> · previsto ${o.setup} min.`
      :'<span class="w">O envase está antes do setup.</span>');
    if(e&&f)t.push(hm(f)>=hm(e)?`Envase levou <b>${hmm(hm(f)-hm(e))}</b> · previsto ${o.envase} min.`
      :'<span class="w">O fim está antes do início do envase.</span>');
    M('chCalc').innerHTML=t.join('<br>');
  };
  ['chSet','chEnv','chFim'].forEach(i=>M(i)&&M(i).addEventListener('input',upd));upd();
  ligarOlhos();
  if(M('chPin'))M('chPin').addEventListener('input',()=>{
    const s=autorizador(cv('chPin').trim());
    M('chQuem').innerHTML=s?`<b>${s.nome}</b> · ${s.funcao||s.papel}`
      :(quemPorCredencial(cv('chPin').trim())?'<span style="color:var(--danger)">Esta pessoa não é supervisor.</span>':'');
  });
  const liberar=()=>{
    if(!fim)return {nome:quemAssina()};
    if(souMestre)return {nome:(MEU_ACESSO.nome||'master')};
    const s=autorizador(cv('chPin').trim());
    if(!s){toast('Precisa do PIN ou da senha de um supervisor.',true);return null;}
    return s;
  };
  const aplicar=(novo,rotulo)=>{
    const mot=cv('chMot').trim();
    if(!mot){toast('Escreva o motivo.',true);M('chMot').focus();return;}
    const quem=liberar();if(!quem)return;
    const antes=`${o.iniReal||'—'} / ${o.envIni||'—'} / ${o.fimReal||'—'}`;
    o.iniReal=novo.set;o.envIni=novo.env;o.fimReal=novo.fim;
    if(!o.fimReal)o.caixas=null;
    registrar(o,rotulo,null,
      `${antes} → ${o.iniReal||'—'} / ${o.envIni||'—'} / ${o.fimReal||'—'} · por ${quem.nome} · ${mot}`);
    agendarSalvar();fecharModal();render();toast('Horários corrigidos.');
  };
  M('chC').onclick=()=>abrirOrdem(o);
  M('chK').onclick=()=>{
    const s=cv('chSet'),e=cv('chEnv'),f=cv('chFim');
    if(s&&e&&hm(e)<hm(s)){toast('O envase não pode começar antes do setup.',true);return;}
    if(e&&f&&hm(f)<hm(e)){toast('O fim não pode ser antes do início do envase.',true);return;}
    if(f&&!e){toast('Informe o início do envase.',true);return;}
    aplicar({set:s,env:e,fim:f},'Horários corrigidos');
  };
  M('chLimpa').onclick=()=>aplicar({set:'',env:'',fim:''},'Horários apagados');
  abrirMask();
}

function turnosHTML(o){
  const l=turnosDe(o), prev=caixasPrev(o), feitas=cxFeitas(o), faltam=cxFaltam(o);
  const porTurno=l.length>0;
  const pc=prev?Math.min(100,feitas/prev*100):0;
  return `<div class="sec"><div class="st">Realizado</div>
    <p class="adp">${porTurno
      ? 'Vem dos turnos lançados abaixo.'
      : 'Vai sendo preenchido pelos botões de etapa, no rodapé.'}
      ${(!porTurno&&(o.iniReal||o.envIni||o.fimReal))
        ? ` <button type="button" class="linkb" id="fCorr">Corrigir horários</button>`:''}</p>
    <div class="g3">
      <div class="fld"><label>Início do setup</label>
        <input type="time" id="fIniR" step="300" value="${o.iniReal||''}" disabled>
        <div class="hint" id="fSetT" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
      <div class="fld"><label>Início do envase</label>
        <input type="time" id="fEnvI" step="300" value="${o.envIni||''}" disabled></div>
      <div class="fld"><label>Fim do envase</label>
        <input type="time" id="fFimR" step="300" value="${o.fimReal||''}" disabled>
        <div class="hint" id="fEnvT" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
    </div>
    ${o.caixas!=null?`<div class="fld" style="max-width:230px"><label>Caixas produzidas</label>
      <input type="number" id="fCx" value="${o.caixas}" disabled></div>`:''}
  </div>
  <div class="sec"><div class="st">Turnos</div>
    ${l.length?`<table class="tb tturn"><thead><tr>
      <th>Dia</th><th>Horário</th><th class="n">Tempo</th><th>Operador</th>
      <th class="n">Caixas</th><th class="n">Extra</th><th></th>
    </tr></thead><tbody>
    ${l.map((t,i)=>{
      const ex=extraDoTurno(o,t);
