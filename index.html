<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCP Atrius — Programação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --ink:#1A1D23; --ink2:#545C69; --ink3:#8B93A1;
  --line:#E4E2DC; --line2:#EFEEE9; --line3:#F5F4F0;
  --prep:#0891B2; --run:#15803D; --pausa:#B45309; --danger:#B3261E; --lib:#15803D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.top h1{font-family:'Barlow Condensed';font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--line3);padding:3px;border-radius:9px}
.tabs button{padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink2);border-radius:7px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{display:flex;gap:1px}
.nav button{width:30px;height:30px;border-radius:7px;color:var(--ink2);display:grid;place-items:center;font-size:15px}
.nav button:hover{background:var(--line3)}
.per{font-size:14px;font-weight:600;min-width:180px}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:#15803D;border-color:#15803D;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.blue{background:#2563EB;border-color:#2563EB;color:#fff}
.btn.del{color:var(--danger);border-color:#EDCFCC}
.btn.sm{padding:6px 11px;font-size:12px}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sw button{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.sw button.on{background:var(--ink);color:#fff}
.sp{margin-left:auto}
.ondeest{font-family:'Barlow Condensed';font-size:17px;font-weight:600;color:var(--ink2);
  padding-left:11px;margin-left:2px;border-left:1px solid var(--line)}
.burger{width:34px;height:34px;border-radius:8px;display:grid;place-content:center;gap:4px;flex-shrink:0}
.burger:hover{background:var(--line3)}
.burger span{display:block;width:17px;height:2px;background:var(--ink);border-radius:2px}
.menu[hidden],.mendrop[hidden]{display:none!important}
.mendrop{position:fixed;inset:0;background:rgba(26,29,35,.35);z-index:49}
.menu{position:fixed;top:0;left:0;bottom:0;width:246px;background:var(--surface);
  border-right:1px solid var(--line);z-index:50;padding:14px 12px;
  display:flex;flex-direction:column;gap:3px;box-shadow:4px 0 24px rgba(0,0,0,.12)}
.menu .mtit{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink3);padding:6px 10px 10px}
.menu button{text-align:left;padding:10px 12px;border-radius:9px;line-height:1.3}
.menu button:hover{background:var(--line3)}
.menu button.on{background:var(--ink);color:#fff}
.menu button.on i{color:rgba(255,255,255,.65)}
.menu button b{display:block;font-size:13.5px;font-weight:600}
.menu button i{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:1px}
.menu button.sub{padding:7px 12px 7px 22px;font-size:12.5px;color:var(--ink2)}
.menu button.sub.on{color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:100px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--ink2)}
.chip.bad{background:#FBEAE8;border-color:#EFCCC8;color:var(--danger)}
.chip.saldo{background:#F1ECFC;border-color:#CFC0F2;color:#5B21B6;cursor:pointer}
.chip.saldo:hover{background:#E7DEFA}
.chip.sop{background:#FEF3E7;border-color:#F0C89A;color:#8A5A08;font-weight:700}
.chip.atr{background:#FEF6E0;border-color:#E0B84A;color:#8A5A08;font-weight:700}
.chip.lib{background:#FDF3E3;border-color:#EDD3A0;color:#8A5A08;cursor:pointer;animation:bate 2s infinite}
.chip.lib:hover{background:#FBE7BF}
.chip.teste{background:var(--line3);border-color:var(--line);color:var(--ink3);font-weight:600}
@keyframes bate{0%,100%{box-shadow:0 0 0 0 rgba(180,83,9,.35)}50%{box-shadow:0 0 0 5px rgba(180,83,9,0)}}

.body{display:flex;flex:1;min-height:0}
.wrap{flex:1;overflow:auto;background:var(--surface);position:relative}
.grid{display:flex;min-width:max-content;position:relative}
.gut{width:52px;flex-shrink:0;position:sticky;left:0;z-index:10;background:var(--surface);border-right:1px solid var(--line)}
.guth{height:54px;position:sticky;top:0;z-index:22;background:var(--surface);border-bottom:1px solid var(--line)}
.gutb .h{height:60px;display:flex;justify-content:flex-end;padding-right:6px}
.gutb .h span{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);transform:translateY(-6px);font-weight:500}

.day{flex:1;min-width:288px;border-right:2px solid var(--line)}
.day:last-child{border-right:none}
.dhead{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);height:54px}
.dtop{display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 0 2px}
.dtop .dw{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3)}
.dtop .dn{font-family:'Barlow Condensed';font-size:21px;font-weight:700;line-height:1}
.day.today .dtop .dn{background:#2563EB;color:#fff;border-radius:50%;width:27px;height:27px;
  display:grid;place-items:center;font-size:15px}
.day.today .dtop .dw{color:#2563EB}
.dmaqs{display:flex;border-top:1px solid var(--line2)}
.dmaqs i{flex:1;text-align:center;font-style:normal;font-size:10px;font-weight:700;
  letter-spacing:.08em;color:var(--ink3);padding:4px 0;border-right:1px solid var(--line2)}
.dmaqs i:last-child{border-right:none}
.dmaqs i u{display:block;font-size:8.5px;font-weight:500;text-decoration:none;
  font-family:'JetBrains Mono';color:var(--ink3);opacity:.75;margin-top:1px}
.dmaqs i{padding:3px 0 4px}
.dbody{display:flex}
.mcol{flex:1;position:relative;border-right:1px solid var(--line2);cursor:copy}
.mcol:last-child{border-right:none}
.mcol .hh{height:30px;border-bottom:1px dashed var(--line3);box-sizing:border-box}
.mcol .hh.f{border-bottom:1px solid var(--line2)}
.posturno{background:repeating-linear-gradient(45deg,#FBFAF7,#FBFAF7 5px,#F1F0EB 5px,#F1F0EB 10px);
  border-top:1px solid var(--line);pointer-events:none}
.forajorn{position:absolute;left:0;right:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(45deg,#FAF9F6,#FAF9F6 6px,#F0EFEA 6px,#F0EFEA 12px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid #DC2626;z-index:12;pointer-events:none}
.nowlbl{position:sticky;left:0;display:inline-block;background:#DC2626;color:#fff;font-size:9.5px;
  font-weight:700;padding:1px 5px 1px 4px;border-radius:0 4px 4px 0;transform:translateY(-50%)}
.dl{position:absolute;left:1px;right:1px;border-top:2px dashed var(--ink);z-index:18;display:none;pointer-events:none}
.dl::after{content:attr(data-t);position:absolute;left:0;top:2px;font-family:'JetBrains Mono';
  font-size:9.5px;font-weight:700;background:var(--ink);color:#fff;padding:1px 4px;border-radius:3px}
.addhint{position:absolute;left:2px;right:2px;display:none;align-items:center;gap:5px;z-index:9;
  pointer-events:none;transform:translateY(-11px)}
.addhint::before{content:'';position:absolute;left:0;right:0;top:11px;height:2px;background:#0E9F6E;opacity:.5}
.addhint i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#0E9F6E;color:#fff;
  display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1;z-index:2;flex-shrink:0;
  pointer-events:auto;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.addhint i:hover{background:#0B7F58;transform:scale(1.12)}
.addhint span{font-family:'JetBrains Mono';font-size:10px;font-weight:700;background:#0E9F6E;color:#fff;
  padding:1px 5px;border-radius:4px;z-index:2}

.blk{position:absolute;left:2px;right:2px;border-radius:7px;overflow:hidden;cursor:pointer;z-index:3;
  border:1px solid var(--bc);background:var(--bg2);border-left:4px solid var(--bc);
  display:flex;flex-direction:column;transition:box-shadow .12s}
.blk:hover{box-shadow:0 3px 12px rgba(26,29,35,.2);z-index:6}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:7}
.blk.conf{border-color:var(--danger)}
.blk .pr{background:repeating-linear-gradient(45deg,rgba(184,115,9,.22),rgba(184,115,9,.22) 4px,transparent 4px,transparent 8px);
  border-bottom:1px dashed rgba(184,115,9,.6);flex-shrink:0}
.blk .in{padding:4px 7px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;gap:1px}
.blk .t1{font-size:12.5px;font-weight:700;line-height:1.2;color:var(--bc);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t2{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.blk .t3{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tagx{font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
  align-self:flex-start;margin-top:2px}
.tagx.ex{background:#8A5A08;color:#fff}
.tagx.atr{background:#C08A2E;color:#fff}
/* passou do fim previsto — chama a atenção do programador */
.blk.atrasada{background:#FEF6E0!important;border-color:#E0B84A!important;
  box-shadow:0 0 0 2px rgba(224,184,74,.35)}
.blk.atrasada .t1{color:#8A5A08!important}
.bat.atrasada{background:#FEF6E0;border-color:#E0B84A;box-shadow:0 0 0 2px rgba(224,184,74,.3)}
.bat .sptop{padding:2px 11px 8px}
.bat .spn{font-family:'Barlow Condensed';font-size:19px;font-weight:700;line-height:1.1;color:var(--ink)}
.bat .spq{font-family:'JetBrains Mono';font-size:17px;font-weight:700;color:var(--bc);margin-top:2px}
.bat .spenv{background:#FEF3E7;color:#8A5A08;font-size:11.5px;font-weight:700;
  padding:7px 11px;border-top:1px solid #F0C89A;letter-spacing:.02em}
.bat.st-pronto{opacity:.72}
.bat .bsop{background:#FEF3E7;color:#8A5A08;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat .bfin{background:#EAF2FE;color:#1D4ED8;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat .bvira{background:#F3EAFB;color:#6D28D9;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
.bat.trocar{border-color:#2563EB;box-shadow:0 0 0 2px rgba(37,99,235,.3);background:#EEF4FF}
.vao.alvo{background:#CFEDDE;border-color:#0E9F6E;border-style:solid}
.vaoslim.alvo::before{opacity:1;height:3px}
.vaoslim.alvo i{opacity:1;transform:scale(1.15)}
body.arrastando .vaoslim{height:30px}
body.arrastando .vaoslim i{opacity:.4}
.bat .batr{background:#FBEEC8;color:#8A5A08;font-size:10.5px;font-weight:700;
  padding:6px 11px;line-height:1.35}
.tagx.ok{background:var(--run);color:#fff}
/* concluída: acinzentada, como evento passado */
.blk.st-concluida{background:var(--line3)!important;border-color:var(--line)!important;
  border-left-color:var(--ink3)!important;opacity:.6}
.blk.st-concluida .t1{color:var(--ink3)!important;font-weight:600}
.blk.st-concluida .t2,.blk.st-concluida .t3{color:var(--ink3)}
.blk.st-concluida .pr{opacity:.2}

.tqwrap{flex:1;overflow:auto;background:var(--surface);padding:16px}
.tqgrid{display:flex;gap:12px;min-width:max-content;align-items:flex-start}
.tqcol{width:272px;flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden}
.tqh{padding:11px 13px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.tqh .n{display:flex;align-items:baseline;gap:8px}
.tqh .n b{font-family:'Barlow Condensed';font-size:20px;font-weight:700}
.tqh .n span{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-left:auto}
.tqh .s{font-size:11px;color:var(--ink3);margin-top:2px}
.tqb{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:70px}
.bat{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  border-left:4px solid var(--bc);cursor:pointer}
.bat:hover{box-shadow:0 2px 10px rgba(0,0,0,.09)}
.bat.st-liberado{opacity:.85}
.bat.st-concluido{opacity:.55}
.bat.fora{border-color:var(--danger);border-left-color:var(--danger)}
.bat .bh{padding:9px 11px 7px;display:flex;align-items:flex-start;gap:8px}
.bat .bn{font-size:12.5px;font-weight:700;line-height:1.2;flex:1;color:var(--bc)}
.bat .bn .fam{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bat .bm{padding:0 11px 9px;font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink2);line-height:1.6}
.bat .bm .k{color:var(--ink3)}
.bat .bm .kk{color:var(--ink3);opacity:.8;padding-left:10px;position:relative}
.bat .bm .kk::before{content:'└';position:absolute;left:0;opacity:.5}
.bat .ban{display:flex;gap:6px;padding:0 11px 9px;flex-wrap:wrap}
.bat .ban span{font-family:'JetBrains Mono';font-size:10px;font-weight:700;background:var(--line3);
  color:var(--ink2);padding:2px 7px;border-radius:5px}
.bat .ban span.fora{background:#FBEAE8;color:var(--danger)}
.bat .bo{border-top:1px solid var(--line2);padding:7px 11px;font-size:10.5px;color:var(--ink3);line-height:1.5}
.bat .bpuxa{border-top:1px solid var(--line2);padding:8px 11px;text-align:center;
  font-size:11.5px;font-weight:700;color:#6D28D9;background:#FAF7FF;cursor:pointer}
.bat .bpuxa:hover{background:#F1ECFC}
.bat .bw{background:#FBEAE8;color:var(--danger);font-size:10.5px;font-weight:600;padding:5px 11px;line-height:1.35}
.sb.alvo{background:#F5F0FF;box-shadow:0 0 0 2px #CFC0F2 inset}
.tqcol.alvo{border-color:#0E9F6E;box-shadow:0 0 0 2px rgba(14,159,110,.25) inset;background:#F0FAF5}
.tqh[data-col]{cursor:grab;user-select:none}
.tqh .ord{position:absolute;top:7px;right:9px;display:flex;gap:3px;z-index:2}
.tqh .ordb{width:20px;height:20px;line-height:1;border:1px solid var(--line);background:var(--paper);
  border-radius:5px;color:var(--ink3);font-size:14px;cursor:pointer;padding:0;font-family:inherit}
.tqh .ordb:hover:not(:disabled){background:#EFE6FB;border-color:#6D28D9;color:#6D28D9}
.tqh .ordb:disabled{opacity:.28;cursor:default}
.tqh .n span{margin-right:46px}
.bat .spok{background:#E6F6EE;color:#15803D;font-size:10.5px;font-weight:700;padding:6px 11px;line-height:1.35}
#errbox{position:fixed;right:14px;bottom:14px;z-index:9999;max-width:460px;background:#fff;
  border:2px solid var(--danger);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.24);
  font-size:12px;overflow:hidden}
#errbox[hidden]{display:none!important}
#errbox .errh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--danger);color:#fff}
#errbox .errh b{flex:1;font-size:13px}
#errbox .errh button{background:transparent;border:0;color:#fff;font-size:15px;cursor:pointer;padding:0 2px}
#errbox .erri{padding:8px 12px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono';
  font-size:11px;line-height:1.45;color:var(--ink)}
#errbox .errp{padding:8px 12px;color:var(--ink3);line-height:1.45}
.tqh[data-col]:active{cursor:grabbing}
.tqh[data-col]::after{content:"⠿";position:absolute;right:11px;bottom:7px;font-size:12px;color:var(--ink3);opacity:0;transition:opacity .12s}
.tqcol:hover .tqh[data-col]::after{opacity:.55}
.tqcol.alvocol{border-color:#6D28D9;box-shadow:0 0 0 2px rgba(109,40,217,.28) inset;background:#F7F2FD}
.tqcol.alvocol .tqh{background:#EFE6FB}
body.arrastando-col .tqcol{border-style:dashed}
body.tv .tqh[data-col]{cursor:default}
body.tv .tqh[data-col]::after{display:none}
.tqcol.alvo .tqh{background:#E4F4EC}
.olist .o.pend{border-color:#CFC0F2;background:#FCFAFF;cursor:grab}
.olist .o.urg{border-color:#E0A96A;background:#FEF6EC}
.olist .o.pend:hover{border-color:#9C7BE8;box-shadow:0 2px 10px rgba(109,40,217,.14)}
.olist .o .fam{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
body.arrastando .tqcol{border-style:dashed}
.diacol{flex-shrink:0;width:420px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.diacol.hoje{border-color:#2563EB;box-shadow:0 0 0 1px rgba(37,99,235,.25)}
.diah{padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px}
.diah b{font-family:'Barlow Condensed';font-size:18px;font-weight:700;text-transform:capitalize}
.diah span{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-left:auto}
.diab{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}
.mqsub{min-width:0}
.mqh{font-size:9.5px;font-weight:700;color:var(--ink3);text-align:center;
  padding-bottom:5px;border-bottom:1px solid var(--line2);margin-bottom:6px;letter-spacing:.06em}
.mqh u{display:block;font-family:'JetBrains Mono';font-size:8.5px;font-weight:500;
  text-decoration:none;opacity:.8;margin-top:1px}
.mqh i{display:block;font-style:normal;font-family:'JetBrains Mono';font-size:8.5px;
  font-weight:500;color:var(--ink3);opacity:.75;margin-top:1px}
.diab .bat{margin-bottom:5px}
.diab .bat .bn{font-size:11px}
.diab .bat .bm{font-size:9.5px;line-height:1.55;padding:0 7px 7px}
.diab .bat .bh{padding:7px 7px 3px}
.diab .bat .stq{font-size:8.5px;padding:2px 6px}
.diab .bat .bsop,.diab .bat .bfin,.diab .bat .bw,.diab .bat .bvira{font-size:9px;padding:4px 7px}
.vao.mini{padding:5px 7px;flex-direction:column;gap:2px;text-align:center}
.vao.mini span{font-family:'JetBrains Mono';font-size:9.5px;color:#0E7A50}
.vao.mini i{width:18px;height:18px;font-size:13px}
.tqvazio{text-align:center;color:var(--ink3);font-size:11.5px;padding:20px 8px;line-height:1.55}

.side{width:300px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.sh{padding:13px 15px;border-bottom:1px solid var(--line2)}
.sh h3{font-size:13.5px;font-weight:700;line-height:1.3}
.sh .sub{font-size:11px;font-weight:500;color:var(--ink3);margin-top:2px}
.sb{flex:1;overflow-y:auto;padding:12px 14px}
.olist .o{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.olist .o:hover{border-color:var(--ink3);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.olist .o.fim{opacity:.5}
.olist .o .n{font-size:12.5px;font-weight:600;line-height:1.25}

.stq.atrasadaq{background:#FBEEC8;color:#8A5A08}
.stq.finalizado{background:#EAF2FE;color:#1D4ED8}
.stq.preparacao{background:#E0F2F7;color:#0E7490}
.stq.producao{background:#E6F4EA;color:var(--run)}
.stq.atrasada{background:#FBEEC8;color:#8A5A08}

/* relatório */
.rep{flex:1;overflow:auto;background:var(--surface);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);

th{background:var(--line3);text-align:left;padding:9px 12px;font-size:10px;font-weight:700;

td{padding:9px 12px;border-top:1px solid var(--line2)}
td.n,th.n{text-align:right;font-family:'JetBrains Mono';white-space:nowrap}
tr:hover td{background:#FCFBF8}
tfoot td{background:var(--line3);font-weight:700;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
.pill.ok{background:#E6F4EA;color:var(--run)}
.pill.med{background:#FDF3E3;color:var(--pausa)}
.pill.mau{background:#FBEAE8;color:var(--danger)}
tr.mot td{background:#FDFAF0;font-size:11px;color:#7A5C0B;padding:6px 12px}
.vazio{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:34px;
  text-align:center;color:var(--ink3);font-size:13px;line-height:1.6}

.mask{position:fixed;inset:0;background:rgba(26,29,35,.45);display:none;place-items:center;z-index:60;padding:18px}
.mask.on{display:grid}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:470px;max-height:93vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:580px}
.modal.sacode{animation:sacode .28s}
@keyframes sacode{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.mh{padding:15px 19px 13px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:10px}
.mh h3{font-size:15.5px;font-weight:700}
.mh p{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:400}
.mh .x{color:var(--ink3);font-size:20px;line-height:1}
.mb{padding:16px 19px;overflow-y:auto;flex:1}
.mf{padding:12px 19px 16px;border-top:1px solid var(--line2);display:flex;
  align-items:flex-end;gap:14px;flex-wrap:wrap}
.mf .mfesq{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mf .mfrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.mf .mfrow:empty{display:none}
.mf .mfesq:empty{display:none}
.mf .mfdir{display:flex;gap:8px;flex-shrink:0;margin-left:auto}
#mAcao:empty{display:none}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fld label b{color:var(--danger);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:13.5px;background:var(--surface)}

.fld input.dentro{border-color:#9FD3B4;background:#F6FCF9}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.gsku{display:grid;grid-template-columns:96px 1fr;gap:9px}
.gsku .sku{font-family:'JetBrains Mono';font-weight:700;text-align:center;letter-spacing:.04em}
.pin{font-family:'JetBrains Mono';font-size:21px!important;letter-spacing:.35em;text-align:center;font-weight:700}
.sec{border-top:1px solid var(--line2);margin-top:4px;padding-top:14px}
.calc{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.75}
.calc b{font-family:'JetBrains Mono';font-weight:700}
.calc .w{color:var(--danger);font-weight:600}
.alert{background:#FEF9E7;border:1px solid #F0DFA8;border-radius:9px;padding:10px 12px;
  font-size:12.5px;color:#7A5C0B;line-height:1.45;margin-bottom:13px}
.alert.red{background:#FBEAE8;border-color:#EFCCC8;color:var(--danger)}
.alert.blue{background:#EAF2FE;border-color:#C7DBFA;color:#1D4ED8}
.alert.ok{background:#E9F6EE;border-color:#B7E0C6;color:#14532D}
.log{border-top:1px solid var(--line2);margin-top:12px;padding-top:11px}
.log .e{display:flex;gap:9px;font-size:11.5px;padding:4px 0;line-height:1.45}
.log .e .t{font-family:'JetBrains Mono';color:var(--ink3);flex-shrink:0}
.log .e em{font-style:normal;color:var(--ink2);display:block}
.usu{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);font-weight:600}
.usu b{font-weight:700}
.usu button{color:var(--ink3);font-size:11.5px;text-decoration:underline}
.usu button:hover{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;
  z-index:90;opacity:0;transition:.22s;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--danger)}

/* =====================================================================

.tvpanel{position:fixed;inset:0;z-index:900;background:#EEF0F3;color:#12151A;

.tvvazio{padding:22px 12px;text-align:center;color:#8A93A1;font-size:13px}

  padding:12px 14px;background:var(--surface);margin-bottom:16px;max-width:620px}
.tolx>div:first-child{flex:1}
.tolx b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.tolx span{font-size:12px;color:var(--ink3)}
.tolc{display:flex;align-items:center;gap:7px}
.tolc input{width:74px;text-align:right;border:1px solid var(--line);border-radius:7px;
  padding:7px 10px;font:inherit;font-family:'JetBrains Mono';font-size:14px}
.tagm{display:inline-block;font-size:11px;background:#EAF2FE;color:#1D4ED8;
  padding:3px 8px;border-radius:999px;margin-right:3px}

.tb .np{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);
  border-radius:6px;background:var(--card);color:var(--ink2)}
.tb .np:disabled{opacity:.45}
.tb tr.inat{opacity:.5}

/* ---------- preparo do lote ---------- */
.lin{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:14px 0}
.linh{padding:8px 13px;background:var(--sunkbg,#F4F6F8);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.linp{display:flex;align-items:center;gap:11px;padding:8px 13px;border-bottom:1px solid var(--line2)}
.linp:last-of-type{border-bottom:0}
.linp .h{width:104px;flex-shrink:0;font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink3)}
.linp .r{flex:1;font-size:13px;min-width:0}
.linp .r i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.linp .m{flex-shrink:0;font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink3);
  white-space:nowrap}
.linf{padding:9px 13px;background:#EAF2FE;color:#1D4ED8;font-size:13px;font-weight:600;
  border-top:1px solid #BFD2FA}
.linf b{font-family:'JetBrains Mono';font-size:15px}

/* ---------- certificado de análise ---------- */
.cert{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:14px 0}
.certh{padding:9px 13px;background:var(--surface);border-bottom:1px solid var(--line);
  font-size:13.5px;font-weight:700}
.certh span{display:block;font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:2px}
.certt{width:100%;border-collapse:collapse;table-layout:fixed}
.certt th{padding:7px 10px;background:var(--sunkbg,#F4F6F8);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;
  border-bottom:1px solid var(--line)}
.certt th:nth-child(1){width:24%}.certt th:nth-child(2){width:32%}
.certt th:nth-child(3){width:26%}.certt th:nth-child(4){width:18%}
.certt td{padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;
  vertical-align:middle;word-break:break-word}
.certt tr:last-child td{border-bottom:0}
.certt tr.fora td{background:#FDECEE}
.certt td.k,.certt th.n{color:var(--ink3)}
.certt td.n{text-align:right}
.certt select,.certt input{width:100%;font:inherit;font-size:12.5px;padding:4px 7px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);box-sizing:border-box}
.certt input{font-family:'JetBrains Mono'}
.certt tr.fora input{border-color:var(--danger)}
.certok{padding:9px 13px;background:#E6F6EE;color:#15803D;font-size:12.5px;font-weight:600;
  border-top:1px solid #BFE2CE}
.certno{padding:10px 13px;background:#FDECEE;color:#B02A37;font-size:12.5px;line-height:1.5;
  border-top:1px solid #F5C2C7}
.certpe{padding:9px 13px;background:#FDF1E3;color:#8A5A08;font-size:12.5px;
  border-top:1px solid #F0D5AC}
.certdv{padding:10px 13px;background:#F3EAFB;color:#6D28D9;font-size:12.5px;line-height:1.5;
  border-top:1px solid #DCC9F2}
.btn.warn{background:#FDF1E3;border-color:#F0D5AC;color:#8A5A08}
.btn.warn:hover{background:#F9E4CB}
</style>
</head>

  const e=especDe(g);if(!e||!e[k])return null;
  if(QUALI.includes(k))return valor==='ok'?'ok':(valor==='fora'?'fora':null);
  if(valor===''||valor==null)return null;
  const v=+String(valor).replace(',','.');
  if(isNaN(v))return null;
  const f=e[k];
  if(f.min!=null&&v<f.min)return 'fora';
  if(f.max!=null&&v>f.max)return 'fora';
  return 'ok';
}

/* =====================================================================
   BATELADAS — derivadas das ordens de envase
   ===================================================================== */
function bateladas(data){
  const list=[];
  /* saldos existentes: aparecem no dia em que foram lançados e seguem
     visíveis enquanto tiverem volume disponível */
  SALDOS.filter(sd=>sd.data<=data&&(dispDe(sd)>0||ORDENS.some(o=>o.saldoId===sd.id&&o.data===data)))
    .forEach(sd=>{
      const ords=ORDENS.filter(o=>o.saldoId===sd.id&&ativa(o));
      list.push({origem:'saldo',saldoId:sd.id,data:sd.data,tanque:sd.tanque,produto:sd.produto,
        grupo:sd.grupo,volume:sd.volume,consumido:consumidoDe(sd.id),disponivel:dispDe(sd),
        desde:sd.interrompidoEm||'',
        ordens:ords,lotes:new Set(ords.map(o=>o.lote).filter(Boolean)),
        prontoAte:ords.length?Math.min(...ords.map(o=>o.inicio??Infinity)):Infinity,idx:0,g:'saldo'+sd.id});
    });

  /* agrupa por tanque + produto, mas quebra em bateladas sequenciais
     sempre que o volume acumulado passa da capacidade — duas produções
     de 3.800 L no mesmo tanque são duas bateladas, uma depois da outra */
  const grupos={};
  ORDENS.filter(o=>o.data===data&&ativa(o)&&!o.saldoId).forEach(o=>{
    const pr=prodOf(o.codigo);
    const g=`${o.data}|${o.tanque||'—'}|${pr.tanque}`;
    (grupos[g] ||= []).push(o);
  });

  Object.entries(grupos).forEach(([g,ords])=>{
    ords.sort((a,b)=>(a.inicio??0)-(b.inicio??0));
    const tanque=ords[0].tanque||null;
    const pr=prodOf(ords[0].codigo);
    /* limite: o tanque escolhido ou a menor capacidade que comporte a ordem */
    const limite=tanque?tqOf(tanque).cap
      :(CAPACIDADES.find(c=>c>=Math.max(...ords.map(o=>o.litros)))||Math.max(...CAPACIDADES));
    let atual=null;
    ords.forEach(o=>{
      if(!atual||atual.volume+o.litros>limite){
        atual={data,tanque,produto:pr.tanque,grupo:pr.grupo,
          volume:0,ordens:[],lotes:new Set(),prontoAte:Infinity,idx:list.filter(b=>b.g===g).length,g};
        list.push(atual);
      }
      atual.volume+=o.litros;atual.ordens.push(o);
      if(o.lote)atual.lotes.add(o.lote);
      if(o.inicio!=null)atual.prontoAte=Math.min(atual.prontoAte,o.inicio);
    });
  });

  list.forEach(b=>{
    b.lote=[...b.lotes].join(', ');
    b.chave=b.origem==='saldo'?`saldo|${b.saldoId}`:`${b.data}|${b.tanque||'—'}|${b.produto}|${b.idx}`;
    const a=APONTA[b.chave]||{};
    b.obs=a.obs||'';b.liberadoEm=a.liberadoEm||'';b.log=a.log||[];b.concluidoEm=a.concluidoEm||'';
    b.analise=a.analise||null;          /* {resultados:{}, por:'', em:''} */
    b.excedeCap=b.tanque?b.volume>tqOf(b.tanque).cap:false;
    if(b.origem==='saldo'){
      b.status=b.disponivel<=0&&b.ordens.every(o=>sit(o)==='concluida')?'concluido'
        :(b.liberadoEm?'liberado':'saldo');
    }else{
      const todas=b.ordens.length&&b.ordens.every(o=>sit(o)==='concluida');
      b.status=(todas||b.concluidoEm)?'concluido':(b.liberadoEm?'liberado':'aguardando');
    }
    b.ordem=1;b.total=1;
  });
  TANQUES.forEach(t=>{
    const seq=list.filter(b=>b.tanque===t.id).sort((a,b)=>a.prontoAte-b.prontoAte);
    seq.forEach((b,i)=>{
      b.ordem=i+1;b.total=seq.length;
      /* limpeza só quando o granel anterior naquele tanque foi outro */
      b.trocouProduto=i===0?true:seq[i-1].produto!==b.produto;
    });
  });
  list.forEach(b=>{b.etapas=etapasDoLote(b);});
  return list;
}

/* =====================================================================
   LINHA DO TEMPO DO LOTE
   limpeza (se trocou de produto) → enchimento → fabricação → descanso
   → análise. O envase só pode começar quando tudo isso terminou.
   ===================================================================== */
function etapasDoLote(b){
  const g=tempoG(b.produto);
  const ench=b.tanque?(tqOf(b.tanque)||{}).ench||0:0;
  const passos=[];
  if(b.trocouProduto&&g.limpeza)passos.push({k:'limpeza',rot:'Limpeza',min:g.limpeza,
    nota:'trocou de produto'});
  if(ench)passos.push({k:'enchimento',rot:'Enchimento',min:ench,
    nota:'separação das MPs em paralelo'});
  if(g.fabricacao)passos.push({k:'fabricacao',rot:'Fabricação',min:g.fabricacao,nota:''});
  if(g.descanso)passos.push({k:'descanso',rot:'Descanso',min:g.descanso,nota:''});
  const total=passos.reduce((s,p)=>s+p.min,0);
  /* o preparo termina quando a primeira OC quer envasar; começa antes disso */
  const fimPreparo=b.prontoAte===Infinity?null:b.prontoAte;
  let t0=fimPreparo!=null?fimPreparo-total:null;
  passos.forEach(p=>{if(t0!=null){p.de=t0;p.ate=t0+p.min;t0=p.ate;}});
  return {passos,total,inicio:fimPreparo!=null?fimPreparo-total:null,
    fimPreparo:fimPreparo,pronto:b.liberadoEm?hm(b.liberadoEm):null};
}
/* a que horas o envase pode começar de verdade */
function liberadoAPartir(b){
  if(b.liberadoEm)return hm(b.liberadoEm);
  return b.etapas&&b.etapas.fimPreparo!=null?b.etapas.fimPreparo:null;
}
/* a análise cumpre a especificação? */
function analiseOk(b){
  const ens=ensaiosDe(b.produto);
  if(!ens.length)return {ok:true,pend:[],fora:[]};
  const r=(b.analise&&b.analise.resultados)||{};
  const pend=[],fora=[];
  ens.forEach(([k,rot])=>{
    const s=confereEnsaio(b.produto,k,r[k]);
    if(s===null)pend.push(rot); else if(s==='fora')fora.push(rot);
  });
  return {ok:!pend.length&&!fora.length,pend,fora,desvio:!!(b.analise&&b.analise.desvio)};
}

}

/* =====================================================================
   ORDENS DE SOPRO — derivadas das OCs de envase
   ===================================================================== */
const LBL_SOP={aguardando:'Aguardando',soprando:'Soprando',pronto:'Pronto'};
const COR_SOP={aguardando:'#8B93A1',soprando:'#0891B2',pronto:'#15803D'};
/* rotulagem: segunda etapa do frasco. Soprado não basta, tem que estar rotulado. */
const LBL_ROT={aguardando:'Sem rótulo',rotulando:'Rotulando',pronto:'Rotulado'};
const COR_ROT={aguardando:'#8B93A1',rotulando:'#B45309',pronto:'#15803D'};

function sopros(data){
  return ORDENS.filter(x=>x.data===data&&ativa(x)&&x.status!=='pendente'
    &&sopraFrasco(prodOf(x.codigo))).map(x=>{
    const p=prodOf(x.codigo),fr=frascoDe(p);
    const un=caixasPrev(x)*p.un_cx;
    const ap=SOPRO[x.id]||{};
    const sop=ap.sopradora?sopOf(ap.sopradora):null;
    const cad=sop?sop.cad:(SOPRADORAS[0]||{cad:1000}).cad;
    const dur=Math.max(15,Math.ceil(un/cad*60/5)*5);
    const fimP=ap.fimPrev?hm(ap.fimPrev):x.inicio;      /* pronto quando o envase começa */
    const iniP=ap.iniPrev?hm(ap.iniPrev):Math.max(H0*60,fimP-dur);
    const boas=(ap.produzidas??0)-(ap.quebras??0);
    const rot=ap.rotulo||'aguardando';
    const st=ap.status||'aguardando';
    return {oc:x,codigo:x.codigo,frasco:fr,info:frascoInfo(fr),un,
      sopradora:ap.sopradora||null,iniPrev:iniP,fimPrev:fimP,dur,
      iniReal:ap.iniReal||'',fimReal:ap.fimReal||'',
      produzidas:ap.produzidas??null,quebras:ap.quebras??null,boas,
      obs:ap.obs||'',status:st,naFila:ap.fila??null,
      rot,rotIni:ap.rotIni||'',rotFim:ap.rotFim||'',rotQuem:ap.rotQuem||'',
      rotUn:ap.rotUn??null,rotObs:ap.rotObs||'',
      liberado:st==='pronto'&&rot==='pronto',
      falta:Math.max(0,un-boas),envaseEm:x.inicio};
  }).sort((a,b)=>a.envaseEm-b.envaseEm);
}
const soproDe=oc=>{if(!sopraFrasco(prodOf(oc.codigo)))return 'pronto';
  const a=SOPRO[oc.id]||{};return a.status||'aguardando';};
const rotuloDe=oc=>{if(!sopraFrasco(prodOf(oc.codigo)))return 'pronto';
  const a=SOPRO[oc.id]||{};return a.rotulo||'aguardando';};
/* o envase só pode contar com o frasco quando ele está soprado E rotulado */
const frascoOk=oc=>soproDe(oc)==='pronto'&&rotuloDe(oc)==='pronto';
/* o que falta, em uma palavra, para o card do envase */
function faltaNoFrasco(oc){
  const s=soproDe(oc),r=rotuloDe(oc);
  if(s!=='pronto')return s==='soprando'?'em sopro':'aguardando sopro';
  if(r!=='pronto')return r==='rotulando'?'em rotulagem':'soprado, falta rotular';
  return '';
}

/* =====================================================================
   RENDER
   ===================================================================== */
const M=id=>document.getElementById(id);
let DRAG=null;
function render(){
  recomporTudo();
  const c=conflitos();
  topo(c);
  M('wrap').hidden=true;
  M('tqwrap').hidden=!(S.page==='envase'||S.page==='tanques');
  M('spwrap').hidden=S.page!=='sopro';
  M('repwrap').hidden=S.page!=='relatorio';
  M('adwrap').hidden=S.page!=='admin';
  M('side').hidden=['relatorio','admin'].includes(S.page);
  if(S.page==='envase'){gradeFila(c);lateralEnvase();}
  else if(S.page==='tanques'){gradeTanques();lateralTanques();}
  else if(S.page==='sopro'){gradeSopro();lateralSopro();}
  else if(S.page==='admin')gradeAdmin();
  else gradeRelatorio();
  agendarSalvar();
}

function topo(conf){
  const env=S.page==='envase';
  M('vw').style.display=env?'':'none';
  M('nova').style.display=['relatorio','admin','sopro'].includes(S.page)?'none':'';
  M('novoSaldo').style.display=S.page==='tanques'?'':'none';
  const d=S.page==='envase'?S.ref:S.refTq;
  M('prev').disabled=M('next').disabled=(S.page==='admin');
  const nomes={envase:'Envase',tanques:'Tanques',sopro:'Sopro',relatorio:'Relatórios',admin:'Administração'};
  try{M('ondeest').textContent=nomes[S.page]||'';}catch(e){}
  if(env&&S.view!=='dia'){
    const dias=diasHorizonte(S.ref,+S.view);
    const f=x=>`${p2(x.getDate())} ${x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}`;
    M('per').textContent=`${f(dias[0])} – ${f(dias[dias.length-1])}`;
  }else M('per').textContent=dLongo(ymd(d));
  const c=M('conf');c.hidden=!conf.size;c.textContent=`${conf.size} sobrepostas`;
  const sl=ORDENS.filter(x=>x.status==='pendente').length,se=M('saldo');
  se.hidden=!sl;se.textContent=`${sl} saldo${sl>1?'s':''} a reprogramar`;
  const hojeS=ymd(new Date());
  const sp=sopros(S.page==='envase'?ymd(S.ref):ymd(S.refTq)).filter(x=>!x.liberado).length;
  const se2=M('chipSop');se2.hidden=!sp;se2.textContent=`${sp} frasco${sp>1?'s':''} pendente${sp>1?'s':''}`;
  const at=ORDENS.filter(atrasada).length,ae=M('chipAtr');
  ae.hidden=!at;ae.textContent=`${at} atrasada${at>1?'s':''}`;
  const lb=aguardandoLiberacao(),le=M('lib');
  le.hidden=!lb.length;
  le.textContent=`${lb.length} ${lb.length>1?'lotes aguardam':'lote aguarda'} liberação`;
  document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const grupo=['envase','tanques'].includes(S.page)?'envase':S.page;
  document.querySelectorAll('#menu button').forEach(b=>{
    b.classList.toggle('on',b.dataset.p===grupo);
    b.style.display=podeVer(b.dataset.p)?'':'none';
  });
  const et=M('etsw');
  et.style.display=['envase','tanques'].includes(S.page)?'':'none';
  document.querySelectorAll('#etsw button').forEach(b=>
    b.classList.toggle('on',b.dataset.p===S.page));
  const ed=podeEditar(S.page);
  M('nova').style.display=(['relatorio','admin','sopro'].includes(S.page)||!ed)?'none':'';
  M('novoSaldo').style.display=(S.page==='tanques'&&ed)?'':'none';
}

/* ---------- fila: um dia ou horizonte de dias úteis ---------- */
function colunaMaq(m,data,conf,estreita){
  const seq=ORDENS.filter(o=>o.maq===m&&o.data===data&&naGrade(o)).sort((a,b)=>a.inicio-b.inicio);
  const ocup=seq.reduce((s,o)=>s+total(o),0);
  const [ji,jf]=jorn(m),jornMin=jf-ji,livre=Math.max(0,jornMin-ocup);
  let corpo='',cur=ji;
  seq.forEach(o=>{corpo+=vao(m,data,cur,o.inicio,estreita);corpo+=cardFila(o,conf,estreita);
    cur=Math.max(cur,o.fimReal?hm(o.fimReal):fimPrev(o));});
  corpo+=vao(m,data,cur,jf,estreita);
  if(estreita)return `<div class="mqsub">
    <div class="mqh">${m}<u>${hhmm(ji)}–${hhmm(jf)}</u>
      <i>${seq.length?`${seq.length} OC · ${Math.floor(livre/60)}h livre`:'livre'}</i></div>
    ${corpo}</div>`;
  return `<div class="tqcol" style="width:306px">
    <div class="tqh"><div class="n"><b>${m}</b>
      <span>${Math.floor(ocup/60)}h ${p2(ocup%60)} ocupada</span></div>
      <div class="s">${seq.length?`${seq.length} OC${seq.length>1?'s':''}`:'Sem programação'}
        · ${Math.floor(livre/60)}h ${p2(livre%60)} livres · jornada ${hhmm(ji)}–${hhmm(jf)}</div></div>
    <div class="tqb">${corpo}</div></div>`;
}

function gradeFila(conf){
  if(S.view==='dia'){
    const data=ymd(S.ref);
    M('tqgrid').innerHTML=MAQUINAS.map(m=>colunaMaq(m,data,conf,false)).join('');
  }else{
    const dias=diasHorizonte(S.ref,+S.view);
    M('tqgrid').innerHTML=dias.map(d=>{
      const data=ymd(d);
      const doDia=ORDENS.filter(o=>o.data===data&&naGrade(o));
      const cx=doDia.reduce((s,o)=>s+caixasPrev(o),0);
      const hoje=data===ymd(new Date());
      return `<div class="diacol ${hoje?'hoje':''}">
        <div class="diah">
          <b>${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')} ${d.getDate()}</b>
          <span>${doDia.length?`${doDia.length} OC · ${nf(cx)} cx`:'sem programação'}</span></div>
        <div class="diab">${MAQUINAS.map(m=>colunaMaq(m,data,conf,true)).join('')}</div>
      </div>`;
    }).join('');
  }
  if(MODO_TV||!podeEditar('envase'))return;
  M('tqgrid').querySelectorAll('[data-fo]').forEach(e=>{
    const oc=ORDENS.find(x=>x.id===e.dataset.fo);
    if(!oc)return;
    e.addEventListener('click',()=>{if(FDRAG)return;S.sel=oc.id;abrirOrdem(oc);});
    if(sit(oc)==='programada'){
      e.setAttribute('draggable','true');e.style.cursor='grab';
      e.addEventListener('dragstart',ev=>{
        FDRAG=oc.id;ev.dataTransfer.effectAllowed='move';
        ev.dataTransfer.setData('text/plain',oc.id);
        e.style.opacity='.4';document.body.classList.add('arrastando');});
      e.addEventListener('dragend',()=>{e.style.opacity='';
        document.body.classList.remove('arrastando');setTimeout(()=>FDRAG=null,80);});
    }
    /* soltar sobre outra OC troca as duas de lugar */
    const marca=v=>e.classList.toggle('trocar',v);
    e.addEventListener('dragenter',ev=>{ev.preventDefault();if(FDRAG&&FDRAG!==oc.id)marca(true);});
    e.addEventListener('dragover',ev=>{ev.preventDefault();
      ev.dataTransfer.dropEffect='move';if(FDRAG&&FDRAG!==oc.id)marca(true);});
    e.addEventListener('dragleave',()=>marca(false));
    e.addEventListener('drop',ev=>{
      ev.preventDefault();ev.stopPropagation();marca(false);
      const id=FDRAG||ev.dataTransfer.getData('text/plain');FDRAG=null;
      document.body.classList.remove('arrastando');
      if(!id||id===oc.id)return;
      trocarOC(ORDENS.find(x=>x.id===id),oc);
    });
  });

  M('tqgrid').querySelectorAll('[data-gi]').forEach(e=>{
    e.addEventListener('click',()=>{if(FDRAG)return;
      abrirOrdem(null,{data:e.dataset.gd,maq:e.dataset.gm,inicio:+e.dataset.gi});});
    const marca=v=>e.classList.toggle('alvo',v);
    e.addEventListener('dragenter',ev=>{ev.preventDefault();if(FDRAG)marca(true);});
    e.addEventListener('dragover',ev=>{ev.preventDefault();
      ev.dataTransfer.dropEffect='move';if(FDRAG)marca(true);});
    e.addEventListener('dragleave',()=>marca(false));
    e.addEventListener('drop',ev=>{
      ev.preventDefault();marca(false);
      const id=FDRAG||ev.dataTransfer.getData('text/plain');FDRAG=null;
      document.body.classList.remove('arrastando');
      const oc=ORDENS.find(x=>x.id===id);if(!oc)return;
      moverOC(oc,e.dataset.gm,e.dataset.gd,+e.dataset.gi);
    });
  });
}
function vao(maq,data,de,ate,estreita){
  const min=ate-de,attr=`data-gd="${data}" data-gm="${maq}" data-gi="${de}"`;
  if(min<SNAP)return `<div class="vaoslim" ${attr}><i>+</i></div>`;
  if(estreita)return `<div class="vao mini" ${attr}>
    <span>${Math.floor(min/60)?`${Math.floor(min/60)}h`:''}${min%60?` ${min%60}min`:''} livre</span><i>+</i></div>`;
  return `<div class="vao" ${attr}>
    <div class="vt"><b>${Math.floor(min/60)?`${Math.floor(min/60)}h `:''}${p2(min%60)}min livres</b>
      <span>${hhmm(de)} – ${hhmm(ate)}</span></div><i>+</i></div>`;
}

  const p=prodOf(o.codigo),fim=sit(o)==='concluida',atr=atrasada(o);
  const cor=fim?'#8B93A1':CORES[p.grupo];
  const t=tempoReal(o),dv=desvio(o);
  return `<div class="bat ${fim?'st-concluido':''} ${atr?'atrasada':''} ${conf.has(o.id)?'fora':''}"
    data-fo="${o.id}" style="--bc:${cor}">
    <div class="bh"><div class="bn"><i class="fam" style="background:${CORES[p.grupo]}"></i>${nomeCurto(p)}</div>
      <span class="stq ${atr?'atrasadaq':sit(o)}">${atr?'Atrasada':ST[sit(o)]}</span></div>
    ${estreita?`<div class="bm">
      <span class="k">${hhmm(o.inicio)}–${hhmm(fimPrev(o))}</span><br>
      ${nf(caixasPrev(o))} cx · ${o.tanque||'sem tanque'}
      ${o.fimReal?`<br><span class="k">real</span> ${o.iniReal||'--:--'}–${o.fimReal}`:''}
    </div>`:`<div class="bm">
      <span class="k">Previsto</span><br>
      ${o.setup?`<span class="kk">setup</span> ${hhmm(o.inicio)} – ${hhmm(o.inicio+o.setup)}<br>`:''}
      <span class="kk">envase</span> ${hhmm(o.inicio+o.setup)} – ${hhmm(fimPrev(o))}<br>
      <span class="k">Realizado</span><br>
      ${o.setup?`<span class="kk">setup</span> ${o.iniReal||'--:--'} – ${o.setupFim||'--:--'}${badge(dvSetup(o))}<br>`:''}
      <span class="kk">envase</span> ${iniEnvase(o)||'--:--'} – ${o.fimReal||'--:--'}${badge(dvEnvase(o))}<br>
      ${o.lote?`<span class="k">Lote</span> ${o.lote}<br>`:''}
      <span class="k">Tanque</span> ${o.tanque||'a programar'} · ${nf(o.litros)} L<br>
      <span class="k">Caixas</span> ${o.caixas!=null?`${nf(o.caixas)} de ${nf(caixasPrev(o))}`:`${nf(caixasPrev(o))} previstas`}
    </div>`}
    ${sit(o)!=='concluida'&&!frascoOk(o)
      ?`<div class="bsop">Frasco ${frascoDe(p)} · ${faltaNoFrasco(o)}</div>`:''}
    ${sit(o)==='finalizado'?`<div class="bfin">Envase finalizado — aguardando conclusão</div>`:''}
    ${!fim&&fimPrev(o)>jorn(o.maq)[1]
      ?`<div class="bvira">Passa das ${hhmm(jorn(o.maq)[1])} — continua amanhã</div>`:''}
    ${!fim&&sit(o)!=='finalizado'&&!loteLiberado(o)?`<div class="bw">Tanque não liberado pelo gestor para envase.</div>`:''}
  </div>`;
}

/* move a OC para outra máquina/horário */
function moverOC(o,maq,data,inicio){
  const [ji,jf]=jorn(maq);
  const novo=Math.max(ji,Math.min(jf-total(o),inicio));
  if(o.maq===maq&&o.data===data&&o.inicio===novo)return;
  const de=`${o.maq} ${hhmm(o.inicio)}`;
  o.maq=maq;o.data=data;o.inicio=novo;o.inicioOriginal=null;
  registrar(o,'Reprogramada na fila',null,`${de} → ${maq} ${hhmm(novo)}`);
  S.sel=o.id;render();toast(`${nomeCurto(o.codigo)} → ${maq}, ${hhmm(novo)}.`);
}
/* troca duas OCs de posição, inclusive entre máquinas */
function trocarOC(a,b){
  if(!a||!b)return;
  const A={maq:a.maq,data:a.data,inicio:a.inicio};
  const B={maq:b.maq,data:b.data,inicio:b.inicio};
  const [ja]=jorn(B.maq),[jb]=jorn(A.maq);
  Object.assign(a,{maq:B.maq,data:B.data,inicio:Math.max(ja,B.inicio)});
  Object.assign(b,{maq:A.maq,data:A.data,inicio:Math.max(jb,A.inicio)});
  a.inicioOriginal=null;b.inicioOriginal=null;
  registrar(a,'Trocada de posição',null,`${A.maq} ${hhmm(A.inicio)} ↔ ${B.maq} ${hhmm(B.inicio)}`);
  registrar(b,'Trocada de posição',null,`${B.maq} ${hhmm(B.inicio)} ↔ ${A.maq} ${hhmm(A.inicio)}`);
  S.sel=a.id;render();
  toast(`${nomeCurto(a.codigo)} ↔ ${nomeCurto(b.codigo)}.`);
}

/* ---------- tanques ---------- */
let ARR=null,FDRAG=null,SDRAG=null,CDRAG=null;
function gradeTanques(){
  const data=ymd(S.refTq),bats=bateladas(data);
  M('tqgrid').innerHTML=TANQUES.map(t=>{
    const seq=bats.filter(b=>b.tanque===t.id).sort((a,b)=>a.prontoAte-b.prontoAte);
    const usado=seq.reduce((s,b)=>s+b.volume,0);
    return `<div class="tqcol" data-tq="${t.id}">
      <div class="tqh"><div class="n"><b>${t.id}</b><span>${nf(t.cap)} L</span></div>
        <div class="s">${seq.length?`${seq.length} lote${seq.length>1?'s':''} · ${nf(usado)} L no dia`
          :'Sem programação'}</div></div>
      <div class="tqb">${seq.length?seq.map(cardBat).join('')
        :`<div class="tqvazio">Solte um lote aqui.<br>Eles ficam em <b>a programar</b>, à direita.</div>`}</div>
    </div>`;
  }).join('');

  M('tqgrid').querySelectorAll('[data-puxa]').forEach(e=>
    e.addEventListener('click',ev=>{ev.stopPropagation();
      const sd=SALDOS.find(x=>x.id===e.dataset.puxa);
      if(sd)abrirOrdem(null,{saldoId:sd.id,tanque:sd.tanque,data:ymd(S.refTq),
        litros:dispDe(sd),prodTanque:sd.produto});}));
  M('tqgrid').querySelectorAll('[data-bat]').forEach(e=>{
    e.addEventListener('click',ev=>{if(ARR||ev.target.closest('[data-puxa]'))return;
      abrirLote(bateladas(ymd(S.refTq)).find(b=>b.chave===e.dataset.bat));});
    e.addEventListener('dragstart',ev=>{
      ARR=e.dataset.bat;ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain',e.dataset.bat);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>ARR=null,80);});
  });

  /* a coluna inteira é alvo — dragenter e dragover precisam do preventDefault */
  M('tqgrid').querySelectorAll('.tqcol').forEach(z=>{
    const marca=v=>z.classList.toggle('alvo',v);
    z.addEventListener('dragenter',ev=>{ev.preventDefault();if(ARR)marca(true);});
    z.addEventListener('dragover',ev=>{ev.preventDefault();
      ev.dataTransfer.dropEffect='move';if(ARR)marca(true);});
    z.addEventListener('dragleave',ev=>{if(!z.contains(ev.relatedTarget))marca(false);});
    z.addEventListener('drop',ev=>{
      ev.preventDefault();marca(false);
      const chave=ARR||ev.dataTransfer.getData('text/plain');
      if(!chave)return;
      const b=bateladas(ymd(S.refTq)).find(x=>x.chave===chave);
      const destino=z.dataset.tq;ARR=null;
      if(!b||b.tanque===destino)return;
      atribuirTanque(b,destino);
    });
  });
}

  M('sT').textContent='Tanques a programar';M('sD').textContent=dLongo(data);
  M('sB').innerHTML=`
    ${livres.length?`<div class="olist">${livres.map(b=>`
      <div class="o pend" draggable="true" data-livre="${b.chave}">
        <div style="display:flex;gap:8px;align-items:flex-start">
          <div class="n" style="flex:1"><i class="fam" style="background:${CORES[b.grupo]}"></i>${abrevTq(b.produto)}</div>
          <span class="stq pendente">${nf(b.volume)} L</span></div>
        <div class="m">${b.ordens.length} envase${b.ordens.length>1?'s':''} ·
          ${b.ordens.map(o=>`${o.maq} ${hhmm(o.inicio)}`).join(' · ')}</div>
        <div class="m" style="color:#6D28D9">arraste para um tanque</div>
      </div>`).join('')}</div>`
      :`<div class="empty">Nada a programar.<br>Lotes sem tanque aparecem aqui quando você lança a OC.</div>`}
    ${postos.length?`<div class="st" style="margin-top:14px">Já nos tanques</div>
      <div class="olist">${postos.map(b=>`
        <div class="o ${b.status==='concluido'?'fim':''}" data-bl="${b.chave}">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div class="n" style="flex:1">${b.tanque} · ${abrevTq(b.produto)}</div>
            <span class="stq ${b.status}">${LBL_BAT[b.status]}</span></div>
          <div class="m">${nf(b.volume)} L${b.lote?` · lote ${b.lote}`:''}</div>
        </div>`).join('')}</div>`:''}`;

  /* soltar aqui devolve o lote para "a programar" */
  const painel=M('sB');
  const marcaP=v=>painel.classList.toggle('alvo',v);
  painel.ondragenter=ev=>{ev.preventDefault();if(ARR)marcaP(true);};
  painel.ondragover=ev=>{ev.preventDefault();ev.dataTransfer.dropEffect='move';if(ARR)marcaP(true);};
  painel.ondragleave=ev=>{if(!painel.contains(ev.relatedTarget))marcaP(false);};
  painel.ondrop=ev=>{
    ev.preventDefault();marcaP(false);
    const chave=ARR||ev.dataTransfer.getData('text/plain');ARR=null;
    if(!chave)return;
    const b=bateladas(data).find(x=>x.chave===chave);
    if(!b||!b.tanque)return;
    if(b.origem==='saldo'){toast('Saldo lançado não volta para a fila.',true);return;}
    devolverParaProgramar(b);
  };

  M('sB').querySelectorAll('[data-bl]').forEach(e=>{
    e.addEventListener('click',()=>{if(!ARR)abrirLote(bateladas(data).find(b=>b.chave===e.dataset.bl));});
    e.setAttribute('draggable','true');
    e.addEventListener('dragstart',ev=>{
      ARR=e.dataset.bl;ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain',e.dataset.bl);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>ARR=null,80);});
  });
  M('sB').querySelectorAll('[data-livre]').forEach(e=>{
    e.addEventListener('click',()=>{if(!ARR)abrirLote(bateladas(data).find(b=>b.chave===e.dataset.livre));});
    e.addEventListener('dragstart',ev=>{
      if(!podeEditar('tanques')){ev.preventDefault();return;}
      ARR=e.dataset.livre;ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain',e.dataset.livre);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>ARR=null,80);});
  });
}

/* devolve o lote para a fila de programação, sem tanque */
function devolverParaProgramar(b){
  const antigo=b.tanque,apont=APONTA[b.chave];
  if(apont)delete APONTA[b.chave];
  b.ordens.forEach(o=>{o.tanque=null;
    registrar(o,'Tanque removido',null,`${antigo} → a programar`);});
  render();
  toast(`${abrevTq(b.produto)} voltou para "a programar".`);
}

/* atribui ou troca o tanque de um lote inteiro */
function atribuirTanque(b,destino){
  const cap=tqOf(destino).cap;
  if(b.volume>cap){toast(`O ${destino} comporta ${nf(cap)} L e o lote tem ${nf(b.volume)} L.`,true);return;}
  const sd=SALDOS.find(x=>x.tanque===destino&&dispDe(x)>0);
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent=b.tanque?'Trocar de tanque':'Programar no tanque';
  M('mSub').textContent=`${b.produto} · ${nf(b.volume)} L · ${b.tanque?`${b.tanque} → ${destino}`:destino}`;
  M('mSub').hidden=false;M('modal').classList.add('wide');
  M('mB').innerHTML=`
    ${sd?`<div class="alert">O ${destino} ainda tem <b>${nf(dispDe(sd))} L</b> de
      <b>${sd.produto}</b>${sd.interrompidoEm?`, interrompido em ${sd.interrompidoEm}`:''}.
      Este lote entra como batelada seguinte.</div>`:''}
    <div class="alert blue">Isto define o tanque de <b>${b.ordens.length}</b>
      OC${b.ordens.length>1?'s':''} de envase:
      <ul style="margin:8px 0 0;padding-left:18px;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.7">
      ${b.ordens.map(o=>`<li>${nomeCurto(o.codigo)} ·
        ${o.maq} ${hhmm(o.inicio)} · ${nf(o.litros)} L</li>`).join('')}</ul></div>`;
  M('mF').innerHTML=`<div style="flex:1"></div>
    <button class="btn" id="aC">Cancelar</button>
    <button class="btn pri" id="aK">Confirmar</button>`;
  M('aC').onclick=()=>{fecharModal();render();};
  M('aK').onclick=()=>{
    const antigo=b.tanque,apont=APONTA[b.chave];
    if(apont)delete APONTA[b.chave];
    b.ordens.forEach(o=>{o.tanque=destino;
      registrar(o,antigo?'Tanque alterado':'Tanque definido',null,
        antigo?`${antigo} → ${destino}`:`${destino} · ${b.produto}`);});
    if(apont){const nova=batDe(b.ordens[0]);if(nova)APONTA[nova.chave]=apont;}
    fecharModal();render();
    toast(antigo?`Lote movido para ${destino}.`:`${b.produto} programado no ${destino}.`);
  };
  M('mask').classList.add('on');
}

/* ---------- manutenção dos motivos ---------- */
function modalMotivo(m){
  const novo=!m;
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('mTit').textContent=novo?'Novo motivo':'Editar motivo';
  M('mSub').hidden=true;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="fld"><label>Motivo <b>*</b></label>
      <input id="moNome" value="${novo?'':m.nome}" placeholder="Falta de embalagem"></div>
    <div class="fld"><label>Aparece em <b>*</b></label>
      <div class="hint" style="font-size:11.5px;color:var(--ink3);margin:-2px 0 8px">
        Marque as etapas em que este motivo faz sentido.</div>
      <div class="motl">${ETAPAS.map(([id,rot])=>{
        const on=novo?false:m.etapas.includes(id);
        return `<button type="button" class="motb ${on?'on':''}" data-et="${id}">${rot}</button>`;
      }).join('')}</div></div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="moC">Fechar</button>
    <button class="btn pri" id="moK">${novo?'Cadastrar':'Salvar'}</button></div>`;
  const sel=new Set(novo?[]:m.etapas);
  M('mB').querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{
    const e=b.dataset.et;
    if(sel.has(e)){sel.delete(e);b.classList.remove('on');}
    else{sel.add(e);b.classList.add('on');}
  });
  M('moC').onclick=fecharModal;
  M('moK').onclick=()=>{
    const nome=M('moNome').value.trim();
    if(!nome){toast('Informe o nome do motivo.',true);return;}
    if(!sel.size){toast('Marque ao menos uma etapa.',true);return;}
    if(MOTIVOS.some(x=>x.nome.toLowerCase()===nome.toLowerCase()&&(novo||x.id!==m.id))){
      toast('Já existe um motivo com esse nome.',true);return;}
    if(novo)MOTIVOS.push({id:'m'+Date.now().toString(36),nome:nome,etapas:[...sel]});
    else{m.nome=nome;m.etapas=[...sel];}
    agendarSalvar();fecharModal();gradeAdmin();
    toast(novo?'Motivo cadastrado.':'Motivo atualizado.');
  };
  M('mask').classList.add('on');
}

function excluirMotivo(id){
  const m=MOTIVOS.find(x=>x.id===id);if(!m)return;
  /* quantas OCs já apontaram este motivo? apagar não pode reescrever o passado */
  const usos=ORDENS.filter(o=>Object.values(motivosOC(o))
    .some(v=>(v.ids||[]).includes(id))).length;
  if(M('mAcao'))M('mAcao').innerHTML='';
  M('mTit').textContent='Excluir motivo';M('mSub').hidden=true;
  M('mB').innerHTML=`<div class="alert">
    <b>${m.nome}</b> deixa de aparecer no fechamento das próximas OCs.
    ${usos?`<br><br><b>${usos} OC${usos>1?'s já usaram':' já usou'}</b> este motivo.
      O que já foi apontado continua no histórico e no relatório — só não pode ser
      escolhido de novo.`:''}</div>`;
  M('mF').innerHTML=`<div class="mfesq"></div><div class="mfdir">
    <button class="btn" id="mxC">Voltar</button>
    <button class="btn del" id="mxK">Excluir</button></div>`;
  M('mxC').onclick=fecharModal;
  M('mxK').onclick=()=>{
    const i=MOTIVOS.findIndex(x=>x.id===id);
    if(i>=0)MOTIVOS.splice(i,1);
    agendarSalvar();fecharModal();gradeAdmin();toast('Motivo excluído.');
  };
  M('mask').classList.add('on');
}

        <span>${String(f.gramatura).replace('.',',')}g${f.pescoco?' · '+f.pescoco:''}</span></div>
        <div class="s">${seq.length?`${seq.length} ${seq.length>1?'ordens':'ordem'} · ${nf(un)} un no dia`
          :'Sem necessidade'}${feito?` · ${nf(feito)} boas`:''}</div></div>
      <div class="tqb">${seq.length?seq.map(cardSopro).join('')
        :`<div class="tqvazio">Solte aqui as ordens deste frasco.<br>Elas ficam à direita, por urgência.</div>`}</div>
    </div>`;
  }).join('');
  M('spgrid').querySelectorAll('[data-sp]').forEach(e=>{
    e.addEventListener('click',()=>{if(!SDRAG)abrirSopro(sopros(ymd(S.refTq)).find(x=>x.oc.id===e.dataset.sp));});
    e.setAttribute('draggable','true');
    e.addEventListener('dragstart',ev=>{SDRAG=e.dataset.sp;
      ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',e.dataset.sp);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>SDRAG=null,80);});
  });
  /* setas: caminho garantido, funciona em tela sensível ao toque e sem arrastar */
  M('spgrid').querySelectorAll('[data-esq]').forEach(b=>{
    b.addEventListener('click',ev=>{ev.stopPropagation();
      const id=b.dataset.esq,k=FRASCOS.findIndex(f=>f.id===id);
      if(k>0)moverFrasco(id,FRASCOS[k-1].id);});
  });
  M('spgrid').querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click',ev=>{ev.stopPropagation();
      const id=b.dataset.dir,k=FRASCOS.findIndex(f=>f.id===id);
      if(k>=0&&k<FRASCOS.length-1)moverFrasco(id,FRASCOS[k+1].id);});
  });
  /* o cabeçalho arrasta a coluna inteira: define a ordem em que os frascos aparecem */
  M('spgrid').querySelectorAll('.tqh[data-col]').forEach(h=>{
    h.addEventListener('dragstart',ev=>{
      CDRAG=h.dataset.col;SDRAG=null;
      ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain','col:'+h.dataset.col);
      const c=h.parentNode;if(c&&c.style)c.style.opacity='.45';
      document.body.classList.add('arrastando-col');});
    h.addEventListener('dragend',()=>{
      const c=h.parentNode;if(c&&c.style)c.style.opacity='';
      document.body.classList.remove('arrastando-col');
      setTimeout(()=>CDRAG=null,80);});
  });
  /* colunas recebem a ordem e definem a sequência de produção */
  M('spgrid').querySelectorAll('.tqcol').forEach(z=>{
    const marca=v=>z.classList.toggle('alvo',v);
    const marcaCol=v=>z.classList.toggle('alvocol',v);
    const limpa=()=>{marca(false);marcaCol(false);};
    z.addEventListener('dragenter',ev=>{ev.preventDefault();
      if(CDRAG)marcaCol(CDRAG!==z.dataset.fr);else if(SDRAG)marca(true);});
    z.addEventListener('dragover',ev=>{ev.preventDefault();
      ev.dataTransfer.dropEffect='move';
      if(CDRAG)marcaCol(CDRAG!==z.dataset.fr);else if(SDRAG)marca(true);});
    z.addEventListener('dragleave',ev=>{if(!z.contains(ev.relatedTarget))limpa();});
    z.addEventListener('drop',ev=>{
      ev.preventDefault();limpa();
      /* arrastou o cabeçalho: é reordenação de coluna, não movimento de ordem */
      const bruto=ev.dataTransfer.getData('text/plain')||'';
      const col=CDRAG||(bruto.startsWith('col:')?bruto.slice(4):null);
      if(col){CDRAG=null;moverFrasco(col,z.dataset.fr);return;}
      const id=SDRAG||bruto;SDRAG=null;
      const x=sopros(ymd(S.refTq)).find(y=>y.oc.id===id);
      if(!x)return;
      if(x.frasco!==z.dataset.fr){
        toast(`Esta ordem é de ${x.frasco}, não cabe na coluna ${z.dataset.fr}.`,true);return;}
      const usados=sopros(ymd(S.refTq)).filter(y=>y.frasco===x.frasco&&y.naFila!=null)
        .map(y=>y.naFila);
      SOPRO[id]={...(SOPRO[id]||{}),fila:(usados.length?Math.max(...usados):0)+1};
      render();toast(`${x.frasco} na fila de produção.`);
    });
  });
}

/* reordena as colunas de frasco: a arrastada passa por cima da coluna alvo */
function moverFrasco(de,para){
  if(!de||!para||de===para)return;
  const i=FRASCOS.findIndex(f=>f.id===de),j0=FRASCOS.findIndex(f=>f.id===para);
  if(i<0||j0<0)return;
  const [f]=FRASCOS.splice(i,1);
  let j=FRASCOS.findIndex(x=>x.id===para);
  if(i<j0)j+=1;                 /* veio da esquerda: entra depois do alvo */
  FRASCOS.splice(j,0,f);
  agendarSalvar();render();
  toast(`${de} agora é a ${j+1}ª coluna.`);
}

    <div class="bh" style="padding-bottom:2px;gap:5px">
      <div style="flex:1"></div>
      <span class="stq ${x.status==='pronto'?'liberado':x.status==='soprando'?'preparando':'aguardando'}">${LBL_SOP[x.status]}</span>
      <span class="stq ${x.rot==='pronto'?'liberado':x.rot==='rotulando'?'atrasadaq':'aguardando'}">${LBL_ROT[x.rot]}</span></div>
    <div class="sptop">
      <div class="spn">${nomeCurto(x.codigo)}</div>
      <div class="spq">${nf(x.un)} un</div>
    </div>
    <div class="bm">
      <span class="k">Sopradora</span> ${x.sopradora?`${x.sopradora} ${sopOf(x.sopradora).nome}`:'—'}<br>

      ${x.produzidas!=null?`<br><span class="k">Boas</span> ${nf(x.boas)} un${x.falta?` · <b style="color:var(--danger)">faltam ${nf(x.falta)}</b>`:''}`:''}
      <br><span class="k">Rótulo</span> ${x.rot==='pronto'
        ?`${nf(x.rotUn??x.boas)} un${x.rotQuem?` · ${x.rotQuem}`:''}${x.rotFim?` · ${x.rotFim}`:''}`
        :(x.rot==='rotulando'?`iniciada ${x.rotIni||'--:--'}`:'não iniciada')}
    </div>
    ${x.liberado
      ?`<div class="spok">Frasco liberado para o envase</div>`
      :`<div class="spenv">${x.status==='pronto'
          ?'Soprado — falta rotular para liberar o envase'

function lateralSopro(){
  const data=ymd(S.refTq),lista=sopros(data);
  const fila=lista.filter(x=>x.naFila==null);
  const agora=agoraMin();
  M('sT').textContent='Necessidades do dia';
  M('sD').textContent=`${dLongo(data)} · por urgência do envase`;
  M('sB').innerHTML=fila.length?`<div class="olist">${fila.map(x=>{
    const falta=x.envaseEm-agora;
    const urg=data===ymd(new Date())&&falta<120;
    return `<div class="o pend ${urg?'urg':''}" draggable="true" data-sq="${x.oc.id}">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div class="n" style="flex:1">${x.frasco}</div>
        <span class="stq ${urg?'atrasadaq':'pendente'}">${nf(x.un)} un</span></div>
      <div class="m">${nomeCurto(x.codigo)}</div>
      <div class="m" style="color:#B45309;font-weight:700">envase às ${hhmm(x.envaseEm)}</div>
      <div class="m" style="color:#6D28D9">arraste para a coluna do frasco</div>
    </div>`;}).join('')}</div>`
    :`<div class="empty">Tudo colocado na fila.<br>Novas OCs de envase aparecem aqui.</div>`;
  M('sB').querySelectorAll('[data-sq]').forEach(e=>{
    e.addEventListener('click',()=>{if(!SDRAG)abrirSopro(sopros(data).find(x=>x.oc.id===e.dataset.sq));});
    e.addEventListener('dragstart',ev=>{SDRAG=e.dataset.sq;
      ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',e.dataset.sq);
      e.style.opacity='.4';document.body.classList.add('arrastando');});
    e.addEventListener('dragend',()=>{e.style.opacity='';
      document.body.classList.remove('arrastando');setTimeout(()=>SDRAG=null,80);});
  });
  /* soltar de volta no painel tira da fila */
  const painel=M('sB');
  painel.ondragenter=ev=>{ev.preventDefault();if(SDRAG)painel.classList.add('alvo');};
  painel.ondragover=ev=>{ev.preventDefault();if(SDRAG)painel.classList.add('alvo');};
  painel.ondragleave=ev=>{if(!painel.contains(ev.relatedTarget))painel.classList.remove('alvo');};
  painel.ondrop=ev=>{
    ev.preventDefault();painel.classList.remove('alvo');
    const id=SDRAG||ev.dataTransfer.getData('text/plain');SDRAG=null;
    if(!id||!SOPRO[id])return;
    SOPRO[id]={...SOPRO[id],fila:null};render();toast('Voltou para as necessidades.');
  };
}

/* iniciar, finalizar e apontar a ordem de sopro */
function abrirSopro(x){
  if(!x)return;
  const trava=x.status==='pronto'?'disabled':'';
  if(M('mAcao'))M('mAcao').innerHTML='';  M('mTit').textContent=`${x.frasco} · ${nf(x.un)} un`;
  M('mSub').innerHTML=`${nomeCurto(x.codigo)} · envase às ${hhmm(x.envaseEm)} ·
    <span class="stq ${x.status==='pronto'?'liberado':x.status==='soprando'?'preparando':'aguardando'}">${LBL_SOP[x.status]}</span>`;
  M('mSub').hidden=false;M('modal').classList.remove('wide');
  M('mB').innerHTML=`
    <div class="alert" style="background:#FEF3E7;border-color:#F0C89A;color:#8A5A08">
      <b>${nomeCurto(x.codigo)}</b> precisa de <b>${nf(x.un)} frascos</b> de
      ${x.frasco} (${String(x.info.gramatura).replace('.',',')}g${x.info.pescoco?' · '+x.info.pescoco:''})
      prontos até <b>${hhmm(x.envaseEm)}</b>.</div>
    <div class="fld"><label>Sopradora <b>*</b></label>
      <select id="pSop" ${trava}><option value="">Selecione…</option>
      ${SOPRADORAS.map(m=>`<option value="${m.id}" ${x.sopradora===m.id?'selected':''}>${m.id} · ${m.nome} · ${nf(m.cad)} un/h</option>`).join('')}</select>
      <div class="hint" id="pDur" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
    <div class="g2">
      <div class="fld"><label>Início previsto</label>
        <input type="time" id="pIniP" step="300" value="${hhmm(x.iniPrev)}" ${trava}></div>
      <div class="fld"><label>Fim previsto</label>
        <input type="time" id="pFimP" step="300" value="${hhmm(x.fimPrev)}" ${trava}></div>
    </div>
    <div class="g2">
      <div class="fld"><label>Início real</label>
        <input type="time" id="pIniR" step="300" value="${x.iniReal}" ${trava}></div>
      <div class="fld"><label>Fim real</label>
        <input type="time" id="pFimR" step="300" value="${x.fimReal}" ${trava}></div>
    </div>
    <div class="g2">
      <div class="fld"><label>Produzidas (un)</label>
        <input type="number" id="pProd" min="0" step="1" value="${x.produzidas??''}" ${trava}></div>
      <div class="fld"><label>Quebras (un)</label>
        <input type="number" id="pQue" min="0" step="1" value="${x.quebras??''}" ${trava}></div>
    </div>
    <div class="calc" id="pCalc"></div>
    <div style="margin:15px 0 4px;padding-top:13px;border-top:1px solid var(--line)">
      <b style="font-size:13.5px">Rotulagem</b>
      <div class="hint" style="font-size:11px;color:var(--ink3);margin-top:2px">
        O envase só libera com o frasco soprado <b>e</b> rotulado.</div>
    </div>
    <div class="g2">
      <div class="fld"><label>Início da rotulagem</label>
        <input type="time" id="pRotI" step="300" value="${x.rotIni}" ${trava}></div>
      <div class="fld"><label>Fim da rotulagem</label>
        <input type="time" id="pRotF" step="300" value="${x.rotFim}" ${trava}></div>
    </div>
    <div class="g2">
      <div class="fld"><label>Rotuladas (un)</label>
        <input type="number" id="pRotU" min="0" step="1" value="${x.rotUn??''}" ${trava}></div>
      <div class="fld"><label>Quem rotulou</label>
        <select id="pRotQ" ${trava}><option value="">Selecione…</option>
        ${USUARIOS.map(u=>`<option ${x.rotQuem===u.nome?'selected':''}>${u.nome}</option>`).join('')}</select></div>
    </div>
    <div class="calc" id="pRotCalc"></div>
    <div class="fld" style="margin-top:13px"><label>Observação</label>
      <textarea id="pObs" ${trava} placeholder="Molde, ajuste, parada">${x.obs}</textarea></div>`;
  const edS=podeEditar('sopro');
  M('mF').innerHTML=`
    ${x.status==='aguardando'&&edS?`<button class="btn cyan" id="pStart">Iniciar sopro</button>`:''}
    ${x.status==='soprando'&&edS?`<button class="btn pri" id="pEnd">OK do sopro</button>`:''}
    ${x.status==='pronto'&&edS?`<button class="btn warn sm" id="pReab">Reabrir sopro</button>`:''}
    ${x.status==='pronto'&&x.rot==='aguardando'&&edS?`<button class="btn cyan" id="pRotS">Iniciar rotulagem</button>`:''}
    ${x.status==='pronto'&&x.rot==='rotulando'&&edS?`<button class="btn pri" id="pRotE">OK da rotulagem</button>`:''}
    ${x.rot==='pronto'&&edS?`<button class="btn warn sm" id="pRotR">Reabrir rótulo</button>`:''}
    <div style="flex:1"></div>
    <button class="btn" id="pC">Fechar</button>
    ${(trava||!edS)?'':`<button class="btn blue" id="pS">Salvar</button>`}`;
  M('pC').onclick=fecharModal;

  const upd=()=>{
    const m=sopOf(M('pSop').value);
    const dur=m?Math.max(15,Math.ceil(x.un/m.cad*60/5)*5):null;
    M('pDur').textContent=m?`${nf(x.un)} un a ${nf(m.cad)} un/h ≈ ${dur} min de sopro.`
      :'Escolha a sopradora para estimar o tempo.';
    const pr=+M('pProd').value||0,qb=+M('pQue').value||0,boas=pr-qb;
    const iR=M('pIniR').value,fR=M('pFimR').value;
    let h='';
    if(iR&&fR)h+=`Sopro real <b>${Math.max(0,hm(fR)-hm(iR))} min</b>.<br>`;
    if(pr)h+=boas>=x.un
      ? `<span style="color:var(--run);font-weight:600">${nf(boas)} boas — atende as ${nf(x.un)} un.</span>`
      : `<span class="w">${nf(boas)} boas · faltam ${nf(x.un-boas)} un.</span>`;
    if(qb&&pr)h+=`<br>Quebra de <b>${nf1(qb/pr*100)}%</b>.`;
    M('pCalc').innerHTML=h||'Informe o realizado ao finalizar.';
    /* rotulagem */
    const ri=M('pRotI').value,rf=M('pRotF').value,ru=M('pRotU').value===''?null:+M('pRotU').value;
    let r='';
    if(ri&&rf)r+=`Rotulagem <b>${Math.max(0,hm(rf)-hm(ri))} min</b>.<br>`;
    if(ru!=null){
      const alvo=boas||x.un;
      r+=ru>=alvo
        ? `<span style="color:var(--run);font-weight:600">${nf(ru)} rotuladas — cobre as ${nf(alvo)} un.</span>`
        : `<span class="w">${nf(ru)} rotuladas · faltam ${nf(alvo-ru)} un para o envase.</span>`;
    }
    M('pRotCalc').innerHTML=r||'Informe a rotulagem ao dar o OK.';
  };
  ['pSop','pProd','pQue','pIniR','pFimR','pRotI','pRotF','pRotU'].forEach(i=>M(i)&&M(i).addEventListener('input',upd));
  if(M('pSop'))M('pSop').addEventListener('change',()=>{
    const m=sopOf(M('pSop').value);
    if(m){const dur=Math.max(15,Math.ceil(x.un/m.cad*60/5)*5);
      M('pFimP').value=hhmm(x.envaseEm);
      M('pIniP').value=hhmm(Math.max(H0*60,x.envaseEm-dur));}
    upd();
  });
  upd();

  const grava=extra=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),
      sopradora:M('pSop').value||null,
      iniPrev:M('pIniP').value,fimPrev:M('pFimP').value,
      iniReal:M('pIniR').value,fimReal:M('pFimR').value,
      produzidas:M('pProd').value===''?null:+M('pProd').value,
      quebras:M('pQue').value===''?null:+M('pQue').value,
      rotIni:M('pRotI').value,rotFim:M('pRotF').value,
      rotUn:M('pRotU').value===''?null:+M('pRotU').value,
      rotQuem:M('pRotQ').value||'',
      obs:M('pObs').value.trim(),...extra};
  };
  if(M('pS'))M('pS').onclick=()=>{grava({});fecharModal();render();toast('Sopro salvo.');};
  if(M('pStart'))M('pStart').onclick=()=>{
    if(!M('pSop').value){toast('Selecione a sopradora.',true);return;}
    grava({status:'soprando',iniReal:M('pIniR').value||relogio()});
    registrar(x.oc,'Sopro iniciado',null,`${x.frasco} · ${M('pSop').value}`);
    fecharModal();render();toast('Sopro iniciado.');
  };
  if(M('pEnd'))M('pEnd').onclick=()=>{
    const pr=M('pProd').value;
    if(pr===''){toast('Informe as unidades produzidas.',true);M('pProd').focus();return;}
    grava({status:'pronto',fimReal:M('pFimR').value||relogio()});
    const b=(+pr)-(+M('pQue').value||0);
    registrar(x.oc,'Sopro finalizado',null,
      `${x.frasco} · ${nf(b)} boas de ${nf(x.un)} un${+M('pQue').value?` · ${nf(+M('pQue').value)} quebras`:''}`);
    fecharModal();render();
    toast(b>=x.un?`Sopro pronto · ${nf(b)} un boas.`:`Sopro finalizado · faltam ${nf(x.un-b)} un.`);
  };
  if(M('pReab'))M('pReab').onclick=()=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),status:'soprando'};
    registrar(x.oc,'Sopro reaberto',null,x.frasco);
    fecharModal();render();toast('Sopro reaberto.');
  };
  if(M('pRotS'))M('pRotS').onclick=()=>{
    grava({rotulo:'rotulando',rotIni:M('pRotI').value||relogio()});
    registrar(x.oc,'Rotulagem iniciada',null,x.frasco);
    fecharModal();render();toast('Rotulagem iniciada.');
  };
  if(M('pRotE'))M('pRotE').onclick=()=>{
    if(M('pRotU').value===''){toast('Informe quantas foram rotuladas.',true);M('pRotU').focus();return;}
    if(!M('pRotQ').value){toast('Informe quem rotulou.',true);M('pRotQ').focus();return;}
    const ru=+M('pRotU').value,alvo=x.boas||x.un;
    grava({rotulo:'pronto',rotFim:M('pRotF').value||relogio()});
    registrar(x.oc,'Rotulagem finalizada',null,
      `${x.frasco} · ${nf(ru)} rotuladas · ${M('pRotQ').value}`);
    fecharModal();render();
    toast(ru>=alvo?`Frasco liberado para o envase · ${nf(ru)} un rotuladas.`
      :`Rotulado · faltam ${nf(alvo-ru)} un para cobrir o envase.`);
  };
  if(M('pRotR'))M('pRotR').onclick=()=>{
    SOPRO[x.oc.id]={...(SOPRO[x.oc.id]||{}),rotulo:'rotulando'};
    registrar(x.oc,'Rótulo reaberto',null,x.frasco);
    fecharModal();render();toast('Rótulo reaberto — o envase volta a ficar travado.');
  };
  M('mask').classList.add('on');
}

   MODAIS
